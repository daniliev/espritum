<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Espritum — Abonnement</title>
<link rel="apple-touch-icon" href="sensei-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0B0B0C"/><text x="50" y="62" font-family="Oswald,sans-serif" font-size="34" font-weight="700" fill="#C41E26" text-anchor="middle">E</text></svg>
</template>
<style>
*{box-sizing:border-box}
html,body{height:100%;background:#08080A}
body{margin:0;min-height:100%;background:#08080A;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:#0B0B0C}
@media (min-width:420px) and (min-height:880px){.phone{border-radius:44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(242,239,233,.07)}}
@media (max-width:420px){.phone{width:100%;height:100vh;height:100dvh}body{padding:0}}
@keyframes eFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.screen{position:absolute;inset:0;padding:62px 20px 24px;display:flex;flex-direction:column;gap:12px;justify-content:space-between;animation:eFade .45s ease both}

.topbar{flex:none;display:flex;align-items:center;justify-content:space-between}
.topbar .back{width:40px;height:40px;margin-left:-10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(242,239,233,.4);font:400 14px 'IBM Plex Mono',monospace;border-radius:12px;transition:.2s;-webkit-tap-highlight-color:transparent}
.topbar .back:hover{color:#F2EFE9;background:rgba(242,239,233,.06)}
.topbar img{width:24px;height:auto;opacity:.85}
.topbar .sp{width:40px}

.head{flex:none;display:flex;flex-direction:column;gap:8px}
.head .t{font:700 29px/0.96 Oswald,sans-serif;text-transform:uppercase;white-space:nowrap}
.head .s{font:400 12px/1.55 'IBM Plex Sans';color:rgba(242,239,233,.48);text-wrap:pretty}

.plan{flex:none;padding:17px 18px;border-radius:19px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:11px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.plan .row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex:none}
.plan .names{display:flex;flex-direction:column;gap:4px}
.plan .tag{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.16em}
.plan .name{font:700 19px/1 Oswald,sans-serif;text-transform:uppercase}
.plan .price{display:flex;align-items:baseline;gap:3px;flex:none}
.plan .price b{font:400 34px/0.85 'Bebas Neue',Oswald,sans-serif;font-weight:400;color:#F6F2EE}
.plan .price i{font:500 13px 'IBM Plex Sans';color:rgba(242,239,233,.5);font-style:normal}
.plan .perks{display:flex;flex-direction:column;gap:6px}
.plan .perk{display:flex;gap:9px;align-items:baseline}
.plan .perk i{width:4px;height:4px;flex:none;transform:rotate(45deg);display:block}
.plan .perk span{font:400 11px/1.45 'IBM Plex Sans';text-wrap:pretty}
.plan .cta{flex:none;padding:14px;border-radius:12px;text-align:center;font:600 12.5px 'IBM Plex Sans'}

/* offre mise en avant */
.plan.hero{background:linear-gradient(150deg,rgba(196,30,38,.17),rgba(196,30,38,.04));border:1.5px solid #C41E26}
.plan.hero:hover{transform:translateY(-2px)}
.plan.hero .tag{color:#E23B44}
.plan.hero .perk i{background:#E23B44}
.plan.hero .perk span{color:rgba(242,239,233,.62)}
.plan.hero .cta{background:#C41E26;color:#F6F2EE;box-shadow:0 12px 28px -12px rgba(196,30,38,.85)}

/* offre secondaire */
.plan.alt{background:#121214;border:1px solid rgba(242,239,233,.1)}
.plan.alt:hover{border-color:rgba(196,30,38,.5);transform:translateY(-2px)}
.plan.alt .tag{color:rgba(242,239,233,.35)}
.plan.alt .perk i{background:rgba(226,59,68,.7)}
.plan.alt .perk span{color:rgba(242,239,233,.55)}
.plan.alt .cta{border:1px solid rgba(242,239,233,.18);color:#F2EFE9}

.note{flex:none;text-align:center;font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:rgba(242,239,233,.28)}

.langbar{position:absolute;top:18px;right:20px;display:flex;gap:6px;z-index:30}
.langbar button{background:none;border:1px solid rgba(242,239,233,.12);color:rgba(242,239,233,.35);font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;padding:5px 9px;border-radius:7px;cursor:pointer;transition:.2s}
.langbar button[aria-pressed="true"]{color:#E23B44;border-color:rgba(196,30,38,.5);background:rgba(196,30,38,.12)}
</style>
</head>
<body>
<div class="phone">
<div class="screen">
<div class="topbar">
<div class="back" id="back">←</div>
<img src="logo-blanc.png" alt="">
<div class="sp"></div>
</div>

<div class="head">
<div class="t" id="title"></div>
<div class="s" id="sub"></div>
</div>

<div class="plan alt" id="planFree">
<div class="row">
<div class="names">
<span class="tag" id="freeTag"></span>
<span class="name" id="freeName"></span>
</div>
<div class="price"><b>0</b><i>€</i></div>
</div>
<div class="perks" id="freePerks"></div>
<div class="cta" id="freeCta"></div>
</div>

<div class="plan hero" id="planPaid">
<div class="row">
<div class="names">
<span class="tag" id="paidTag"></span>
<span class="name" id="paidName"></span>
</div>
<div class="price"><b>11,99</b><i>€</i></div>
</div>
<div class="perks" id="paidPerks"></div>
<div class="cta" id="paidCta"></div>
</div>

<div class="note" id="note"></div>
</div>
</div>

<script>
/* ------------------------------------------------------------------
   Espritum — écran 10 « Abonnement ».

   L'offre payante porte le rouge : c'est celle qu'on pousse.
   La formule gratuite reste disponible, en traitement sobre.
   Suite : gratuit → accueil, payant → écran de paiement.

   Intégration :
     window.EspritumPricing.setLang('fr'|'en'|'bg')
     window.EspritumPricing.setPrice('11,99')
   Émet espritum:pick-free, espritum:pick-paid et espritum:back.
   ------------------------------------------------------------------ */

var T = {
  fr: {
    title: "Choisis ton rythme.",
    sub: "Ton plan est prêt dans les deux cas. Tu peux commencer sans rien payer.",
    freeTag: "2 SEMAINES GRATUITES", freeName: "Découverte", freeCta: "Commencer gratuitement",
    freePerks: ["Ton plan d'entraînement complet, calculé sur ton scan", "Scan hebdomadaire et recalibrage automatique", "Verset du jour et suivi de ta série"],
    paidTag: "SANS INTERRUPTION", paidName: "Espritum", paidCta: "Prendre l'abonnement",
    paidPerks: ["Tout Découverte, sans limite de temps", "Sensei illimité : il répond, ajuste, recadre", "Nutrition détaillée et scan des repas", "Classement et groupes entre amis"],
    note: "Après 2 semaines, on te demandera 11,99 € / mois. Pas avant."
  },
  en: {
    title: "Pick your pace.",
    sub: "Your plan is ready either way. You can start without paying anything.",
    freeTag: "2 WEEKS FREE", freeName: "Trial", freeCta: "Start for free",
    freePerks: ["Your full training plan, computed on your scan", "Weekly scan and automatic recalibration", "Verse of the day and streak tracking"],
    paidTag: "NO INTERRUPTION", paidName: "Espritum", paidCta: "Take the subscription",
    paidPerks: ["Everything in Trial, with no time limit", "Unlimited Sensei: he answers, adjusts, corrects", "Detailed nutrition and meal scanning", "Ranking and friend groups"],
    note: "After 2 weeks we'll ask for €11.99 / month. Not before."
  },
  bg: {
    title: "Избери своето темпо.",
    sub: "Планът ти е готов и в двата случая. Можеш да започнеш, без да плащаш.",
    freeTag: "2 СЕДМИЦИ БЕЗПЛАТНО", freeName: "Пробен", freeCta: "Започни безплатно",
    freePerks: ["Пълният ти тренировъчен план, изчислен по сканирането", "Седмично сканиране и автоматично рекалибриране", "Стих на деня и следене на серията"],
    paidTag: "БЕЗ ПРЕКЪСВАНЕ", paidName: "Espritum", paidCta: "Вземи абонамент",
    paidPerks: ["Всичко от Пробен, без ограничение във времето", "Неограничен Сенсей: отговаря, коригира, връща те в ритъм", "Подробно хранене и сканиране на храна", "Класиране и групи с приятели"],
    note: "След 2 седмици ще поискаме 11,99 € / месец. Не по-рано."
  }
};

var lang = 'en';

function perkRows(list) {
  return list.map(function (p) { return '<div class="perk"><i></i><span>' + p + '</span></div>'; }).join('');
}

function render(l) {
  lang = l;
  var d = T[l];
  document.getElementById('title').textContent = d.title;
  document.getElementById('sub').textContent = d.sub;
  document.getElementById('freeTag').textContent = d.freeTag;
  document.getElementById('freeName').textContent = d.freeName;
  document.getElementById('freeCta').textContent = d.freeCta + ' →';
  document.getElementById('freePerks').innerHTML = perkRows(d.freePerks);
  document.getElementById('paidTag').textContent = d.paidTag;
  document.getElementById('paidName').textContent = d.paidName;
  document.getElementById('paidCta').textContent = d.paidCta + ' →';
  document.getElementById('paidPerks').innerHTML = perkRows(d.paidPerks);
  document.getElementById('note').textContent = d.note;
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === l));
  });
  document.documentElement.lang = l;
  try { localStorage.setItem('espritum.lang', l); if (window.EspAuth && EspAuth.saveLang) EspAuth.saveLang(l); } catch (e) {}
}

document.getElementById('planFree').addEventListener('click', function () {
  document.dispatchEvent(new CustomEvent('espritum:pick-free'));
});
document.getElementById('planPaid').addEventListener('click', function () {
  document.dispatchEvent(new CustomEvent('espritum:pick-paid'));
});
document.getElementById('back').addEventListener('click', function () {
  document.dispatchEvent(new CustomEvent('espritum:back'));
});
document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

window.EspritumPricing = {
  setLang: render,
  setPrice: function (v) { document.querySelector('#planPaid .price b').textContent = v; }
};

var saved = 'en';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
render(saved);
</script>
<script>/* ESP-NAV — intégration */
document.addEventListener('espritum:pick-free', function () {
  try { localStorage.setItem('espritum.plan', 'free'); } catch (e) {}
  /* activation réelle de l'essai (Supabase) : plus tard */
  window.location.href = 'accueil.html';
});
document.addEventListener('espritum:pick-paid', function () {
  try { localStorage.setItem('espritum.plan', 'paid'); } catch (e) {}
  window.location.href = 'paiement.html';
});
document.addEventListener('espritum:back', function () { window.location.href = 'compte.html'; });
</script>
</body>
</html>
