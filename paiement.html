<head>

<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;background:#08080A;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:#0B0B0C}
@media (min-width:420px) and (min-height:880px){.phone{border-radius:44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(242,239,233,.07)}}
@media (max-width:420px){.phone{width:100%;height:100vh;height:100dvh}body{padding:0}}
@keyframes eFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:eFade .45s ease both}

.top{flex:none;padding:56px 20px 14px;display:flex;flex-direction:column;gap:16px;background:#0B0B0C;border-bottom:1px solid rgba(242,239,233,.07);z-index:2}
.toprow{display:flex;align-items:center;justify-content:space-between}
.toprow .back{width:40px;height:40px;margin-left:-10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(242,239,233,.4);font:400 14px 'IBM Plex Mono',monospace;border-radius:12px;transition:.2s;-webkit-tap-highlight-color:transparent}
.toprow .back:hover{color:#F2EFE9;background:rgba(242,239,233,.06)}
.toprow .brand{font:700 13px Oswald,sans-serif;letter-spacing:.34em;text-transform:uppercase}
.toprow .sp{width:40px}

.steps{display:flex;align-items:center;gap:9px}
.steps .grp{display:flex;align-items:center;gap:7px;flex:none}
.steps .rule{flex:1;height:1px;background:rgba(242,239,233,.1)}
.steps .dot{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 9px 'IBM Plex Mono',monospace}
.steps .dot.done{background:rgba(196,30,38,.16);border:1px solid rgba(196,30,38,.45);color:#E23B44}
.steps .dot.done svg{width:10px;height:10px;display:block;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.steps .dot.now{background:#C41E26;color:#F6F2EE;box-shadow:0 0 14px rgba(196,30,38,.55)}
.steps .dot.next{border:1px solid rgba(242,239,233,.16);color:rgba(242,239,233,.3)}
.steps label{font:600 8px 'IBM Plex Mono',monospace;letter-spacing:.16em}
.steps .grp.done label{color:rgba(242,239,233,.4)}
.steps .grp.now label{color:#E23B44}
.steps .grp.next label{color:rgba(242,239,233,.28)}

.body{flex:1;min-height:0;overflow-y:auto;padding:14px 20px 22px;display:flex;flex-direction:column;gap:12px}
.card{flex:none;padding:16px 17px;border-radius:18px;background:#121214;border:1px solid rgba(242,239,233,.09);display:flex;flex-direction:column;gap:13px}
.sep{height:1px;background:rgba(242,239,233,.07)}

.planrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.planleft{display:flex;align-items:center;gap:12px;min-width:0}
.planleft .mark{width:42px;height:42px;flex:none;border-radius:12px;background:rgba(196,30,38,.12);border:1px solid rgba(196,30,38,.4);display:flex;align-items:center;justify-content:center}
.planleft .mark img{width:26px;height:26px;object-fit:contain}
.planleft .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.planleft .n{font:700 18px/1 Oswald,sans-serif;text-transform:uppercase}
.planleft .c{font:400 10.5px 'IBM Plex Sans';color:rgba(242,239,233,.4)}
.planprice{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.planprice .p{display:flex;align-items:baseline;gap:2px}
.planprice .p b{font:400 30px/0.85 'Bebas Neue',Oswald,sans-serif;font-weight:400;color:#E23B44}
.planprice .p i{font:500 12px 'IBM Plex Sans';color:#E23B44;font-style:normal}
.planprice .per{font:400 9.5px 'IBM Plex Sans';color:rgba(242,239,233,.35);margin-top:3px}

.perks{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
.perks .perk{display:flex;gap:7px;align-items:baseline}
.perks .perk i{width:4px;height:4px;flex:none;background:#E23B44;transform:rotate(45deg);display:block}
.perks .perk span{font:400 10px/1.35 'IBM Plex Sans';color:rgba(242,239,233,.55);text-wrap:pretty}

.lines{display:flex;flex-direction:column;gap:7px}
.lines .l{display:flex;align-items:baseline;justify-content:space-between}
.lines .l span{font:400 11px 'IBM Plex Sans';color:rgba(242,239,233,.42)}
.lines .l b{font:500 11px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.58)}
.lines .tot span{font:700 14px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em;color:#F2EFE9}
.lines .tot b{font:600 15px 'IBM Plex Mono',monospace;color:#E23B44}

.seckick{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#E23B44}
.sectitle{font:700 24px/1 Oswald,sans-serif;text-transform:uppercase}
.stripe{display:flex;align-items:center;gap:7px;margin-top:2px}
.stripe svg{width:12px;height:12px;flex:none;display:block;fill:none;stroke:rgba(242,239,233,.4);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stripe span{font:400 10.5px 'IBM Plex Sans';color:rgba(242,239,233,.4)}

.applepay{display:flex;align-items:center;justify-content:center;gap:7px;padding:16px;border-radius:13px;background:#F2EFE9;color:#0B0B0C;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent}
.applepay:hover{background:#FFFFFF;transform:translateY(-1px)}
.applepay svg{width:17px;height:17px;flex:none;display:block;fill:currentColor}
.applepay span{font:600 14px 'IBM Plex Sans'}

.or{display:flex;align-items:center;gap:11px}
.or .rule{flex:1;height:1px;background:rgba(242,239,233,.09)}
.or span{font:600 8px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:rgba(242,239,233,.28);white-space:nowrap}

.cardfields{display:flex;flex-direction:column;gap:8px}
.cardfields .lab{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:rgba(242,239,233,.35)}
.numwrap{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;background:#0D0D0F;border:1px solid rgba(242,239,233,.12);transition:.2s}
.numwrap:focus-within{border-color:rgba(196,30,38,.55)}
.numwrap svg{width:16px;height:16px;flex:none;display:block;fill:none;stroke:rgba(242,239,233,.3);stroke-width:1.7;stroke-linecap:round}
.numwrap input{flex:1;min-width:0;background:none;border:none;outline:none;color:#F2EFE9;font:500 14px 'IBM Plex Mono',monospace;letter-spacing:.06em}
.pair{display:flex;gap:8px}
.cardfields input.box{padding:13px 14px;border-radius:12px;background:#0D0D0F;border:1px solid rgba(242,239,233,.12);outline:none;color:#F2EFE9;font:500 14px 'IBM Plex Mono',monospace;letter-spacing:.06em;transition:.2s}
.pair input.box{flex:1;min-width:0}
.cardfields input.name{font:400 13px 'IBM Plex Sans';letter-spacing:0}
.cardfields input.box:focus{border-color:rgba(196,30,38,.55)}
.cardfields input::placeholder{color:rgba(242,239,233,.28)}

.badges{display:flex;gap:8px;padding:10px 12px;border-radius:11px;background:#0D0D0F;border:1px solid rgba(242,239,233,.07)}
.badges div{flex:1;display:flex;align-items:center;gap:6px;justify-content:center}
.badges svg{width:11px;height:11px;flex:none;display:block;fill:none;stroke:rgba(242,239,233,.28);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badges span{font:500 8.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:rgba(242,239,233,.32);white-space:nowrap}

.pay{display:flex;align-items:center;justify-content:center;gap:9px;padding:17px;border-radius:13px;background:#C41E26;color:#F6F2EE;cursor:pointer;box-shadow:0 14px 32px -12px rgba(196,30,38,.85);transition:.2s;-webkit-tap-highlight-color:transparent}
.pay:hover{background:#E23B44;transform:translateY(-1px)}
.pay svg{width:14px;height:14px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.pay span{font:600 13px 'IBM Plex Sans';letter-spacing:.14em;text-transform:uppercase}

.terms{text-align:center;font:400 10px/1.5 'IBM Plex Sans';color:rgba(242,239,233,.3);text-wrap:pretty}
.guarantee{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding-top:2px}
.guarantee svg{width:13px;height:13px;flex:none;display:block;fill:none;stroke:rgba(226,59,68,.75);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.guarantee span{font:400 10.5px 'IBM Plex Sans';color:rgba(242,239,233,.38)}

.langbar{position:absolute;top:18px;right:20px;display:flex;gap:6px;z-index:30}
.langbar button{background:none;border:1px solid rgba(242,239,233,.12);color:rgba(242,239,233,.35);font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;padding:5px 9px;border-radius:7px;cursor:pointer;transition:.2s}
.langbar button[aria-pressed="true"]{color:#E23B44;border-color:rgba(196,30,38,.5);background:rgba(196,30,38,.12)}
</style>
</head>
<body>
<div class="phone">
<div class="langbar">
<button data-lang="fr" aria-pressed="true">FR</button>
<button data-lang="en" aria-pressed="false">EN</button>
<button data-lang="bg" aria-pressed="false">BG</button>
</div>

<div class="screen">
<div class="top">
<div class="toprow">
<div class="back" id="back">←</div>
<span class="brand">ESPRITUM</span>
<div class="sp"></div>
</div>
<div class="steps">
<div class="grp done">
<div class="dot done"><svg viewBox="0 0 24 24"><path d="M4 12.5L9 17.5L20 6.5"></path></svg></div>
<label id="stAccount"></label>
</div>
<div class="rule"></div>
<div class="grp now">
<div class="dot now">2</div>
<label id="stPay"></label>
</div>
<div class="rule"></div>
<div class="grp next">
<div class="dot next">3</div>
<label id="stAccess"></label>
</div>
</div>
</div>

<div class="body">
<div class="card">
<div class="planrow">
<div class="planleft">
<div class="mark"><img src="sensei-mark.png" alt=""></div>
<div class="txt">
<span class="n" id="planName"></span>
<span class="c" id="planCycle"></span>
</div>
</div>
<div class="planprice">
<div class="p"><b id="planPrice">11,99</b><i>€</i></div>
<span class="per" id="perMonth"></span>
</div>
</div>
<div class="sep"></div>
<div class="perks" id="perks"></div>
<div class="sep"></div>
<div class="lines">
<div class="l"><span id="lSubtotal"></span><b>9,99 €</b></div>
<div class="l"><span id="lVat"></span><b>2,00 €</b></div>
<div class="sep" style="margin-top:2px"></div>
<div class="l tot"><span id="lTotal"></span><b id="totalVal">11,99 €</b></div>
</div>
</div>

<div class="card">
<div style="display:flex;flex-direction:column;gap:5px">
<span class="seckick" id="secKick"></span>
<span class="sectitle" id="secTitle"></span>
<div class="stripe">
<svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg>
<span id="secStripe"></span>
</div>
</div>

<div class="applepay" id="applepay">
<svg viewBox="0 0 24 24"><path d="M16.3 12.6c0-2 1.6-3 1.7-3.1-.9-1.4-2.4-1.5-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.5 2 2.5 2 1 0 1.4-.6 2.6-.6s1.5.6 2.6.6c1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3 0 0-2.2-.8-2.2-3zM14.4 6.6c.5-.7.9-1.6.8-2.6-.8 0-1.8.5-2.4 1.2-.5.6-1 1.6-.8 2.5.9.1 1.8-.4 2.4-1.1z"></path></svg>
<span id="applePayLabel"></span>
</div>

<div class="or"><div class="rule"></div><span id="orLabel"></span><div class="rule"></div></div>

<div class="cardfields">
<span class="lab" id="cardLabel"></span>
<div class="numwrap">
<svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"></rect><path d="M2.5 10h19"></path></svg>
<input id="num" inputmode="numeric" autocomplete="cc-number">
</div>
<div class="pair">
<input id="exp" class="box" inputmode="numeric" autocomplete="cc-exp">
<input id="cvc" class="box" inputmode="numeric" autocomplete="cc-csc">
</div>
<input id="cname" class="box name" autocomplete="cc-name">
</div>

<div class="badges" id="badges"></div>

<div class="pay" id="pay">
<svg viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg>
<span id="payLabel"></span>
</div>

<span class="terms" id="terms"></span>
</div>

<div class="guarantee">
<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
<span id="guarantee"></span>
</div>
</div>
</div>
</div>

<script>
/* ------------------------------------------------------------------
   Espritum — écran 11 « Paiement ».

   Vu uniquement par ceux qui ont pris l'abonnement à l'écran 10.
   Apple Pay d'abord (chemin le plus court), carte ensuite.

   ATTENTION intégration réelle : ne jamais poster ces champs sur ton
   serveur. Remplacer le bloc carte par Stripe Elements / Payment
   Element, qui tokenise côté Stripe. Les champs ci-dessous sont une
   maquette visuelle.

   Intégration :
     window.EspritumPay.getValues()  {num, exp, cvc, name}
     window.EspritumPay.setPrice('11,99', '9,99', '2,00')
     window.EspritumPay.setLang('fr'|'en'|'bg')
     window.EspritumPay.setApplePayAvailable(bool)
   Émet espritum:apple-pay, espritum:pay (detail = valeurs), espritum:back.
   ------------------------------------------------------------------ */

var T = {
  fr: {
    stAccount: "COMPTE", stPay: "PAIEMENT", stAccess: "ACCÈS",
    planName: "Espritum", planCycle: "Abonnement mensuel", perMonth: "/ mois",
    perks: ["Programme d'entraînement IA", "Nutrition complète et scan des repas", "Analyse corporelle par photo", "Classement et communauté"],
    subtotal: "Sous-total", vat: "TVA (20 %)", total: "Total / mois",
    secKick: "— PAIEMENT SÉCURISÉ", secTitle: "Informations", stripe: "Chiffré et sécurisé par Stripe",
    applePay: "Payer avec Apple Pay", or: "OU PAR CARTE",
    cardLabel: "CARTE BANCAIRE", phNum: "Numéro de carte", phExp: "MM / AA", phCvc: "CVC", phName: "Nom sur la carte",
    badges: ["SSL 256-bit", "Stripe Secure", "3D Secure"],
    pay: "Payer maintenant",
    terms: "En confirmant, tu acceptes le renouvellement automatique chaque mois. Annulation possible à tout moment depuis ton profil.",
    guarantee: "Garantie 7 jours satisfait ou remboursé"
  },
  en: {
    stAccount: "ACCOUNT", stPay: "PAYMENT", stAccess: "ACCESS",
    planName: "Espritum", planCycle: "Monthly subscription", perMonth: "/ month",
    perks: ["AI training programme", "Full nutrition and meal scanning", "Photo body analysis", "Ranking and community"],
    subtotal: "Subtotal", vat: "VAT (20%)", total: "Total / month",
    secKick: "— SECURE PAYMENT", secTitle: "Details", stripe: "Encrypted and secured by Stripe",
    applePay: "Pay with Apple Pay", or: "OR BY CARD",
    cardLabel: "CARD", phNum: "Card number", phExp: "MM / YY", phCvc: "CVC", phName: "Name on card",
    badges: ["SSL 256-bit", "Stripe Secure", "3D Secure"],
    pay: "Pay now",
    terms: "By confirming, you accept automatic renewal every month. You can cancel at any time from your profile.",
    guarantee: "7-day money-back guarantee"
  },
  bg: {
    stAccount: "АКАУНТ", stPay: "ПЛАЩАНЕ", stAccess: "ДОСТЪП",
    planName: "Espritum", planCycle: "Месечен абонамент", perMonth: "/ месец",
    perks: ["AI тренировъчна програма", "Пълно хранене и сканиране на ястия", "Анализ на тялото по снимка", "Класиране и общност"],
    subtotal: "Междинна сума", vat: "ДДС (20 %)", total: "Общо / месец",
    secKick: "— СИГУРНО ПЛАЩАНЕ", secTitle: "Данни", stripe: "Криптирано и защитено от Stripe",
    applePay: "Плати с Apple Pay", or: "ИЛИ С КАРТА",
    cardLabel: "КАРТА", phNum: "Номер на картата", phExp: "ММ / ГГ", phCvc: "CVC", phName: "Име върху картата",
    badges: ["SSL 256-bit", "Stripe Secure", "3D Secure"],
    pay: "Плати сега",
    terms: "С потвърждаването приемаш автоматично подновяване всеки месец. Можеш да откажеш по всяко време от профила си.",
    guarantee: "7 дни гаранция за връщане на парите"
  }
};

var lang = 'fr';
var num = document.getElementById('num');
var exp = document.getElementById('exp');
var cvc = document.getElementById('cvc');
var cname = document.getElementById('cname');

function set(id, txt) { document.getElementById(id).textContent = txt; }

function render(l) {
  lang = l;
  var d = T[l];
  set('stAccount', d.stAccount); set('stPay', d.stPay); set('stAccess', d.stAccess);
  set('planName', d.planName); set('planCycle', d.planCycle); set('perMonth', d.perMonth);
  set('lSubtotal', d.subtotal); set('lVat', d.vat); set('lTotal', d.total);
  set('secKick', d.secKick); set('secTitle', d.secTitle); set('secStripe', d.stripe);
  set('applePayLabel', d.applePay); set('orLabel', d.or);
  set('cardLabel', d.cardLabel); set('payLabel', d.pay);
  set('terms', d.terms); set('guarantee', d.guarantee);
  num.placeholder = d.phNum; exp.placeholder = d.phExp; cvc.placeholder = d.phCvc; cname.placeholder = d.phName;
  document.getElementById('perks').innerHTML = d.perks.map(function (p) {
    return '<div class="perk"><i></i><span>' + p + '</span></div>';
  }).join('');
  document.getElementById('badges').innerHTML = d.badges.map(function (b) {
    return '<div><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"></path></svg><span>' + b + '</span></div>';
  }).join('');
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === l));
  });
  document.documentElement.lang = l;
  try { localStorage.setItem('espritum.lang', l); } catch (e) {}
}

num.addEventListener('input', function () {
  var d = num.value.replace(/\D/g, '').slice(0, 16);
  num.value = d.replace(/(.{4})/g, '$1 ').trim();
});
exp.addEventListener('input', function () {
  var d = exp.value.replace(/\D/g, '').slice(0, 4);
  exp.value = d.length > 2 ? d.slice(0, 2) + ' / ' + d.slice(2) : d;
});
cvc.addEventListener('input', function () {
  cvc.value = cvc.value.replace(/\D/g, '').slice(0, 4);
});

function values() {
  return { num: num.value, exp: exp.value, cvc: cvc.value, name: cname.value.trim() };
}

document.getElementById('applepay').addEventListener('click', function () {
  document.dispatchEvent(new CustomEvent('espritum:apple-pay'));
});
document.getElementById('pay').addEventListener('click', function () {
  document.dispatchEvent(new CustomEvent('espritum:pay', { detail: values() }));
});
document.getElementById('back').addEventListener('click', function () {
  document.dispatchEvent(new CustomEvent('espritum:back'));
});
document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

window.EspritumPay = {
  getValues: values,
  setLang: render,
  setPrice: function (total, subtotal, vat) {
    document.getElementById('planPrice').textContent = total;
    document.getElementById('totalVal').textContent = total + ' €';
    if (subtotal) document.querySelector('.lines .l b').textContent = subtotal + ' €';
    if (vat) document.querySelectorAll('.lines .l b')[1].textContent = vat + ' €';
  },
  setApplePayAvailable: function (ok) {
    document.getElementById('applepay').style.display = ok ? '' : 'none';
    document.querySelector('.or').style.display = ok ? '' : 'none';
  }
};

var saved = 'fr';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
