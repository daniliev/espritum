<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#141416;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding:22px 22px 60px;overflow-x:auto}
a{color:#E23B44;text-decoration:none}
a:hover{color:#FF6B62}
@keyframes aFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes aIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
input,select{font-family:'IBM Plex Sans',sans-serif}
input:focus,select:focus{outline:none;border-color:rgba(196,30,38,.55)}
input::placeholder{color:rgba(242,239,233,.28)}
.scr::-webkit-scrollbar{width:0;height:0}
.scr{scrollbar-width:none}
.desk{width:100%;max-width:1320px;min-width:1180px;margin:0 auto;height:840px;display:flex;border-radius:20px;overflow:hidden;background:#0B0B0C;border:1px solid rgba(242,239,233,.08);box-shadow:0 40px 90px -40px rgba(0,0,0,.9);animation:aFade .35s ease both}
.side{width:212px;flex:none;display:flex;flex-direction:column;gap:26px;padding:24px 16px;background:#0E0E10;border-right:1px solid rgba(242,239,233,.07)}

.nav.on{background:rgba(196,30,38,.16);color:#E23B44}
.nav svg{stroke:currentColor}
.card{border-radius:16px;background:#131315;border:1px solid rgba(242,239,233,.08)}
.klab{font:600 8px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:rgba(242,239,233,.33)}
.th{font:600 8px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:rgba(242,239,233,.3)}
.grid5{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr .9fr;gap:12px;align-items:center;padding:12px 17px}
.row{border-bottom:1px solid rgba(242,239,233,.05);cursor:pointer;transition:.15s}
.row:hover{background:rgba(255,255,255,.028)}
.row.sel{background:rgba(196,30,38,.07)}
.ava{border-radius:50%;background:#1D1D21;border:1px solid rgba(242,239,233,.1);display:flex;align-items:center;justify-content:center;font-family:Oswald,sans-serif;font-weight:600;color:rgba(242,239,233,.7);flex:none}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:20px}
.filt{display:flex;gap:4px;padding:4px;border-radius:11px;background:#111113;border:1px solid rgba(242,239,233,.09);flex:none}
.filt div{padding:7px 12px;border-radius:8px;cursor:pointer;font:500 10.5px 'IBM Plex Sans';color:rgba(242,239,233,.45);transition:.18s}
.filt div.on{background:rgba(196,30,38,.16);color:#E23B44}
.search{display:flex;align-items:center;gap:9px;height:40px;padding:0 13px;border-radius:11px;background:#111113;border:1px solid rgba(242,239,233,.09)}
.search input{flex:1;min-width:0;background:none;border:none;color:#F2EFE9;font:400 12.5px 'IBM Plex Sans'}
.x{border-radius:50%;border:1px solid rgba(242,239,233,.14);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(242,239,233,.45);transition:.2s;flex:none}

.fact{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px}
.fk{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:rgba(242,239,233,.32)}
.fv{font:500 11.5px 'IBM Plex Sans'}
select{background:#0F0F11;border:1px solid rgba(242,239,233,.1);color:#F2EFE9;border-radius:11px;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.18s;font:600 12.5px 'IBM Plex Sans';-webkit-tap-highlight-color:transparent}
.red{background:#C41E26;color:#F6F2EE;box-shadow:0 10px 22px -14px rgba(196,30,38,.9)}

.off{background:#1B1B1F;color:rgba(242,239,233,.3)}
.note{font:400 9.5px/1.5 'IBM Plex Sans';color:rgba(242,239,233,.28)}
.lbl{font:500 10px 'IBM Plex Sans';color:rgba(242,239,233,.45)}
.inp{height:40px;padding:0 12px;border-radius:11px;background:#0F0F11;border:1px solid rgba(242,239,233,.1);color:#F2EFE9;font:500 12.5px 'IBM Plex Sans'}
.frame{position:relative;width:390px;flex:none;margin:0 auto;height:844px;border-radius:46px;background:#0B0B0C;overflow:hidden;box-shadow:0 50px 110px -30px rgba(0,0,0,.9),0 0 0 1px rgba(242,239,233,.07);animation:aFade .35s ease both}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:16px;background:#000;z-index:41}
.mscr{position:absolute;inset:0;padding:58px 18px 96px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.tabs{position:absolute;left:0;right:0;bottom:0;height:80px;z-index:40;background:rgba(11,11,12,.94);border-top:1px solid rgba(242,239,233,.07);display:flex;align-items:flex-start;padding:13px 24px 0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:500 8.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:rgba(242,239,233,.35)}
.tab.on{color:#E23B44}
.tab svg{stroke:currentColor}
.veil{position:absolute;inset:0;z-index:60;background:rgba(6,6,8,.72);backdrop-filter:blur(6px);animation:aIn .2s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:calc(100% - 62px);overflow-y:auto;background:#0E0E10;border-top:1px solid rgba(242,239,233,.09);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding:16px 20px 26px;gap:14px;animation:aFade .28s ease both}
.hidden{display:none!important}
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:#0B0B0C;background-image:linear-gradient(rgba(242,239,233,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(242,239,233,.045) 1px,transparent 1px),radial-gradient(90% 70% at 50% 45%,rgba(196,30,38,.09),transparent 70%);background-size:44px 44px,44px 44px,100% 100%;background-position:center center}
#gateCard{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:18px;padding:36px 28px;border-radius:22px;background:#111113;border:1px solid rgba(242,239,233,.08);box-shadow:0 40px 90px -40px rgba(0,0,0,.9);animation:aFade .35s ease both;text-align:center}
#gateCard img{width:52px;height:auto;display:block}
.spin{width:24px;height:24px;border-radius:50%;border:2.5px solid rgba(242,239,233,.15);border-top-color:#C41E26;animation:spin .8s linear infinite}
.langs{display:flex;justify-content:center;gap:7px}
.langs div{padding:7px 14px;border-radius:9px;cursor:pointer;border:1px solid rgba(242,239,233,.1);font:600 9.5px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:rgba(242,239,233,.4);transition:.18s}
.langs div.on{background:rgba(196,30,38,.16);border-color:rgba(196,30,38,.4);color:#E23B44}
#logoutWrap{position:fixed;top:12px;right:14px;z-index:150}
#logout{width:36px;height:36px;border-radius:50%;background:rgba(19,19,21,.94);border:1px solid rgba(242,239,233,.1);color:rgba(242,239,233,.55);backdrop-filter:blur(6px)}
@media (max-width:980px){
  html,body{background:#0B0B0C}
  body{padding:0;overflow-x:hidden;min-height:100vh;min-height:100dvh}
  .desk{display:none!important}
  .frame{width:100vw;min-width:0;height:100vh;height:100dvh;border-radius:0;box-shadow:none;margin:0}
  .notch{display:none}
  .mscr{padding:calc(env(safe-area-inset-top,12px) + 52px) 18px 100px}
  .tabs{height:calc(78px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
  #gate{padding:0}
  #gateCard{width:100%;max-width:none;min-height:100vh;border-radius:0;border:none;justify-content:center;box-shadow:none}
}
</style>

function frDate(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)?"—":d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}); }
function frShort(iso){ if(!iso) return "—"; const d=new Date(iso); return isNaN(d)?"—":d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}); }
function monthsSince(iso){ if(!iso) return 0; const d=new Date(iso); if(isNaN(d)) return 0; const n=new Date(); return Math.max(0,(n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth())); }

// ── Mapping vraies données (users + subscriptions) → modèle d'affichage ──
function mapUsers(data){
  const subs = {};
  (data.subscriptions||[]).forEach(s => { const c=subs[s.user_id]; if(!c || (s.created_at||"")>(c.created_at||"")) subs[s.user_id]=s; });
  const out = [];
  (data.users||[]).forEach(u => {
    const sub = subs[u.id];
    let status, plan;
    if (sub) {
      const st = sub.statut || "";
      status = st==="trialing" ? "essai" : st==="suspendu" ? "suspendu" : st==="active" ? "actif" : (u.plan==="premium" ? "actif" : "annule");
      plan = (sub.plan && T_ALL.fr.plans[sub.plan]) ? sub.plan : (st==="trialing" ? "essai" : (Number(sub.montant)>0 ? "mensuel" : (u.plan==="premium" ? "offert" : "aucun")));
    } else if (u.plan === "premium") {
      status = "actif"; plan = "offert";
    } else {
      status = "gratuit"; plan = "aucun";   // comptes gratuits : affichés aussi
    }
    const montant = sub && sub.montant!=null ? Number(sub.montant) : 0;
    const debut = sub && sub.debut ? sub.debut : u.created_at;
    const next = sub && sub.prochain_paiement ? sub.prochain_paiement : null;
    const showNext = (status==="actif"||status==="essai") && next;
    const created = new Date(u.created_at);
    const now = new Date();
    const isNew = !isNaN(created) && created.getFullYear()===now.getFullYear() && created.getMonth()===now.getMonth();
    const name = (u.prenom ? (u.prenom + (u.nom?(" "+u.nom):"")) : "") || (u.email ? u.email.split("@")[0] : "Utilisateur");
    out.push({ id:u.id, name, email:u.email||"—", status, plan, since:frDate(debut), next:showNext?frShort(next):"—", months:monthsSince(debut), montant, isNew });
  });
  return out;
}

function kpis() {
  const t = T(), u = S.users, actifs = u.filter(x => x.status === "actif");
  const paying = actifs.filter(x => x.montant > 0);
  const mrr = paying.reduce((a,x) => a + x.montant, 0);
  const total = u.reduce((a,x) => a + x.months*x.montant, 0);
  const vals = [
    [String(actifs.length), t.kpiSub[0].replace("{n}", S.totalAccounts), "#F2EFE9"],
    [eur0(mrr), t.kpiSub[1].replace("{n}", paying.length), "#E23B44"],
    [String(u.filter(x => x.isNew).length), t.kpiSub[2].replace("{m}", monthLabel), "#F2EFE9"],
    [String(u.filter(x => x.status === "essai").length), t.kpiSub[3], "#D8A24A"],
    [eur0(total), t.kpiSub[4], "#F2EFE9"]
  ];
  return vals.map((v,i) => ({ label:t.kpi[i], value:v[0], sub:v[1], color:v[2] }));
}

}

    [t.facts[4], eur(u.months*u.montant), "#F2EFE9"]

}

// ── Appels API réels ──
async function authHeaders(){
  const s = await window.EspAuth.getSession();
  return s ? { Authorization: "Bearer " + s.access_token } : null;
}
async function act(payload){
  if(S.busy) return false;
  S.busy = true; render();
  try {
    const h = await authHeaders(); if(!h){ S.busy=false; render(); return false; }
    h["Content-Type"] = "application/json";
    const r = await fetch("/api/admin-action", { method:"POST", headers:h, body:JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    S.busy = false;
    if(!r.ok){ alert(j.error || ("Erreur "+r.status)); render(); return false; }
    return true;
  } catch(e){ S.busy=false; alert(e.message); render(); return false; }
}
async function loadData(first){
  S.gate = first ? "verifying" : S.gate; renderGate();
  const h = await authHeaders();
  if(!h){ S.gate = "needlogin"; renderGate(); return; }
  if(first){ S.gate = "loading"; renderGate(); }
  try {
    const r = await fetch("/api/admin-data", { headers:h });
    if(r.status===401){ S.gate = "denied"; renderGate(); return; }
    if(r.status===503){ S.gate = "error"; renderGate(); return; }
    if(!r.ok){ S.gate = "error"; renderGate(); return; }
    const data = await r.json();
    S.totalAccounts = (data.users||[]).length;
    S.users = mapUsers(data);
    S.promos = (data.promos||[]).map(p => ({ id:p.id, code:p.code, off:p.off, dur:p.dur, used:p.used||0, max:p.max||0 }));
    S.gate = "ok"; renderGate(); render();
  } catch(e){ S.gate = "error"; renderGate(); }
}

      + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px"><div style="display:flex;align-items:center;gap:11px;min-width:0">'
      + '<div class="ava" style="width:42px;height:42px;font-size:15px">' + ini(u.name) + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="ell" style="font:600 14px \'IBM Plex Sans\'">' + u.name + '</span>'
      + '<span class="ell" style="font:400 10px \'IBM Plex Mono\',monospace;color:rgba(242,239,233,.35)">' + u.email + '</span></div></div>'
      + '<div class="x" data-close style="width:26px;height:26px">' + CLOSE + '</div></div>'
      + factsHtml(u,"#0F0F11")
      + '<div style="display:flex;flex-direction:column;gap:7px"><span class="fk" style="letter-spacing:.14em">' + t.planWord + '</span>' + planSelect(u,false) + saveBtn(u,false) + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:7px">' + suspBtn(u,false) + '<span class="note">' + suspNote(u) + '</span></div></div>'
    : '<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:40px 24px;border-radius:16px;border:1px dashed rgba(242,239,233,.13);background:rgba(255,255,255,.012)">'
      + '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="rgba(242,239,233,.3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8"></path></svg>'
      + '<span style="font:600 11.5px \'IBM Plex Sans\';color:rgba(242,239,233,.65)">' + t.noSel + '</span>'
      + '<span style="font:400 10.5px/1.5 \'IBM Plex Sans\';color:rgba(242,239,233,.32);max-width:190px">' + t.noSelSub + '</span></div>';

  const mobSheet = !!u;
  $("mSheet").classList.toggle("hidden", !mobSheet);
  $("mPromoForm").classList.toggle("hidden", !S.promoForm);
  $("mVeil").classList.toggle("hidden", !(mobSheet || S.promoForm));
  if (mobSheet) $("mSheet").innerHTML =
    '<div style="flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:10px"><div style="display:flex;align-items:center;gap:11px;min-width:0">'
    + '<div class="ava" style="width:40px;height:40px;font-size:15px">' + ini(u.name) + '</div>'
    + '<div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="ell" style="font:600 14px \'IBM Plex Sans\'">' + u.name + '</span>'
    + '<span class="ell" style="font:400 10px \'IBM Plex Mono\',monospace;color:rgba(242,239,233,.35)">' + u.email + '</span></div></div>'
    + '<div class="x" data-close style="width:28px;height:28px">' + CLOSE + '</div></div>'
    + factsHtml(u,"#131315")
    + '<div style="flex:none;display:flex;flex-direction:column;gap:7px"><span class="fk" style="letter-spacing:.14em">' + t.planWord + '</span>' + planSelect(u,true) + saveBtn(u,true) + '</div>'
    + suspBtn(u,true) + '<span class="note" style="text-align:center">' + suspNote(u) + '</span>';
  if (S.promoForm) $("mPromoForm").innerHTML =
    '<div style="flex:none;display:flex;align-items:center;justify-content:space-between"><span style="font:600 8.5px \'IBM Plex Mono\',monospace;letter-spacing:.2em;color:#E23B44">' + t.newCode + '</span>'
    + '<div class="x" data-close style="width:28px;height:28px">' + CLOSE + '</div></div>' + promoFormHtml(true);

  const pCells = p => '<span style="font:600 12.5px \'IBM Plex Mono\',monospace;letter-spacing:.06em">' + p.code + '</span>'
    + '<span style="font:500 12px \'IBM Plex Sans\';color:#E23B44">' + p.off + '</span>'
    + '<span style="font:400 11px \'IBM Plex Mono\',monospace;color:rgba(242,239,233,.55)">' + p.dur + '</span>'
    + '<div style="display:flex;flex-direction:column;gap:5px"><span style="font:400 10.5px \'IBM Plex Mono\',monospace;color:rgba(242,239,233,.5)">' + p.used + (p.max?(' / ' + p.max):'') + '</span>'
    + (p.max?'<div style="height:3px;border-radius:2px;background:#1F1F23;overflow:hidden"><div style="height:100%;border-radius:2px;background:#C41E26;width:' + Math.min(100,Math.round(p.used/p.max*100)) + '%"></div></div>':'') + '</div>';

  $("dPromos").innerHTML = S.promos.length
    ? S.promos.map(p => '<div style="display:grid;grid-template-columns:1.3fr .8fr .8fr 1fr .5fr;gap:12px;align-items:center;padding:13px 17px;border-bottom:1px solid rgba(242,239,233,.05)">' + pCells(p) + '<div style="display:flex;justify-content:flex-end"><div class="x" data-pid="' + p.id + '" style="width:24px;height:24px">' + XSVG + '</div></div></div>').join("")
    : '<div style="padding:40px 20px;text-align:center;font:400 11px \'IBM Plex Sans\';color:rgba(242,239,233,.32)">' + t.noPromos + '</div>';

  $("mPromos").innerHTML = S.promos.length ? S.promos.map(p =>
    '<div style="display:flex;flex-direction:column;gap:9px;padding:14px;border-radius:14px;background:#141416;border:1px solid rgba(242,239,233,.08)">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="font:600 14px \'IBM Plex Mono\',monospace;letter-spacing:.07em">' + p.code + '</span>'
    + '<div class="x" data-pid="' + p.id + '" style="width:24px;height:24px">' + XSVG + '</div></div>'
    + '<div style="display:flex;align-items:center;gap:10px"><span style="font:500 11.5px \'IBM Plex Sans\';color:#E23B44">' + p.off + '</span>'
    + '<span style="font:400 10.5px \'IBM Plex Mono\',monospace;color:rgba(242,239,233,.4)">' + p.dur + '</span>'
    + '<span style="font:400 10.5px \'IBM Plex Mono\',monospace;color:rgba(242,239,233,.3);margin-left:auto">' + p.used + (p.max?(' / ' + p.max):'') + '</span></div>'
    + (p.max?'<div style="height:3px;border-radius:2px;background:#1F1F23;overflow:hidden"><div style="height:100%;border-radius:2px;background:#C41E26;width:' + Math.min(100,Math.round(p.used/p.max*100)) + '%"></div></div>':'') + '</div>').join("")
    : '<div style="padding:24px;text-align:center;font:400 11px \'IBM Plex Sans\';color:rgba(242,239,233,.32)">' + t.noPromos + '</div>';

  document.querySelectorAll("[data-pid]").forEach(el => el.onclick = async () => {
    if(!confirm(S.lang==="en"?"Deactivate this code?":S.lang==="bg"?"Деактивирай кода?":"Désactiver ce code ?")) return;
    if(await act({ action:"delete-promo", promo_id:el.dataset.pid })) await loadData();
  });
  document.querySelectorAll("[data-close]").forEach(el => el.onclick = closeAll);
  wire();
}

function closeAll() { S.selId = null; S.draftPlan = null; S.promoForm = false; render(); }

function wire() {
  document.querySelectorAll(".planSel").forEach(el => el.onchange = e => { S.draftPlan = e.target.value; render(); });
  document.querySelectorAll(".saveBtn").forEach(el => el.onclick = async () => {
    const u = sel(), plan = S.draftPlan;
    if (!u || !plan || plan === u.plan) return;
    if (await act({ action:"set-plan", user_id:u.id, plan })) { S.draftPlan = null; await loadData(); }
  });
  document.querySelectorAll(".suspBtn").forEach(el => el.onclick = async () => {
    const u = sel(); if (!u) return;
    const status = u.status === "suspendu" ? "actif" : "suspendu";
    if (await act({ action:"set-status", user_id:u.id, status })) await loadData();
  });
  document.querySelectorAll(".pCode").forEach(el => el.oninput = e => { S.pCode = e.target.value.toUpperCase(); e.target.value = S.pCode; });
  document.querySelectorAll(".pOff").forEach(el => el.onchange = e => { S.pOff = e.target.value; });
  document.querySelectorAll(".pDur").forEach(el => el.onchange = e => { S.pDur = e.target.value; });
  document.querySelectorAll(".pMax").forEach(el => el.oninput = e => { S.pMax = e.target.value.replace(/[^0-9]/g,""); e.target.value = S.pMax; });
  document.querySelectorAll(".pAdd").forEach(el => el.onclick = async () => {
    const code = S.pCode.trim();
    if (!code) return;
    const durIdx = parseInt(S.pDur,10)||0;
    if (await act({ action:"create-promo", code, off:S.pOff, dur:DUR_API[durIdx], max:Math.max(1, parseInt(S.pMax||"100",10)) })) {
      S.pCode = ""; S.promoForm = false; await loadData();
    }
  });
}

// gate lang buttons
document.querySelectorAll(".nav,.tab").forEach(el => el.onclick = () => {
  S.tab = el.dataset.tab; S.promoForm = false; if (S.tab === "promo") S.selId = null; render();
});
$("dq").oninput = e => { S.q = e.target.value; render(); $("dq").focus(); };
$("mq").oninput = e => { S.q = e.target.value; render(); $("mq").focus(); };
$("mVeil").onclick = closeAll;
$("mNewPromo").onclick = () => { S.promoForm = true; render(); };
$("gLogin").onclick = () => { window.location.href = "compte.html?mode=login"; };
$("logout").onclick = () => {
  if (window.EspAuth && window.EspAuth.logout) window.EspAuth.logout().then(function(){ S.gate="needlogin"; closeAll(); renderGate(); }, function(){ S.gate="needlogin"; renderGate(); });
  else { S.gate="needlogin"; renderGate(); }
};
window.addEventListener("resize", function(){ if(S.gate==="ok") render(); });

renderGate();
render();
if (window.EspAuth) loadData(true); else { S.gate = "error"; renderGate(); }
</script>
</body>
</html>
