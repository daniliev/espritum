<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Espritum — Profil</title>
<link rel="apple-touch-icon" href="sensei-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0B0B0C"/><text x="50" y="62" font-family="Oswald,sans-serif" font-size="34" font-weight="700" fill="#C41E26" text-anchor="middle">E</text></svg>
</template>
<style>
*{box-sizing:border-box}
html,body{height:100%;background:#08080A}
body{margin:0;min-height:100%;background:#08080A;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:#0B0B0C}
@media (min-width:420px) and (min-height:880px){.phone{border-radius:44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(242,239,233,.07)}}
@media (max-width:420px){.phone{width:100%;height:100vh;height:100dvh}body{padding:0}}
@keyframes eFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.screen{position:absolute;inset:0;padding:58px 22px 30px;display:flex;flex-direction:column;gap:13px;animation:eFade .4s ease both;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.hscroll{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

.head{flex:none;display:flex;align-items:center;gap:13px}
.back{font:400 13px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.4);cursor:pointer;background:none;border:none;padding:0}
.back:hover{color:#E23B44}
.head .av{width:52px;height:52px;flex:none;border-radius:50%;background:#18181B;border:1px solid rgba(196,30,38,.4);display:flex;align-items:center;justify-content:center;font:600 18px Oswald,sans-serif;color:#F2EFE9}
.head .c{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.head .c b{font:700 21px/1 Oswald,sans-serif;text-transform:uppercase}
.head .c span{font:500 9.5px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.35)}

.stats{flex:none;display:flex;gap:9px}
.stat{flex:1;padding:13px 14px;border-radius:15px;background:#141416;border:1px solid rgba(242,239,233,.08);display:flex;flex-direction:column;gap:5px}
.stat b{font:700 22px/1 Oswald,sans-serif}
.stat span{font:600 8px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:rgba(242,239,233,.35)}

.sechd{flex:none;display:flex;justify-content:space-between;align-items:baseline}
.sechd span:first-child{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:rgba(242,239,233,.35)}
.sechd span:last-child{font:600 10px 'IBM Plex Mono',monospace;color:#E23B44}
.shot{flex:none;width:96px;display:flex;flex-direction:column;gap:6px}
.shot .img{height:128px;border-radius:13px;overflow:hidden;background:#191A1D;border:1px solid rgba(242,239,233,.09);position:relative}
.shot .img div{position:absolute;inset:0;background-size:cover;background-position:50% 20%}
.shot span{font:500 9px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.4);text-align:center}

.rank{flex:none;padding:14px 17px;border-radius:16px;background:linear-gradient(150deg,rgba(196,30,38,.18),#131315);border:1px solid rgba(196,30,38,.32);display:flex;align-items:center;gap:13px}
.rank img{width:28px;height:auto;flex:none}
.rank .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rank .k{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:rgba(242,239,233,.4)}
.rank .n{font:400 27px/0.82 'Bebas Neue',Oswald,sans-serif;color:#F6F2EE;letter-spacing:.03em}
.rank .r{flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.rank .r span:last-child{font:400 16px/0.9 'Bebas Neue',Oswald,sans-serif;color:rgba(242,239,233,.6);letter-spacing:.03em}

.axes{flex:none;display:flex;flex-direction:column;gap:8px}
.axis{padding:12px 15px;border-radius:14px;background:#141416;border:1px solid rgba(242,239,233,.08);display:flex;flex-direction:column;gap:6px}
.axis .hd{display:flex;align-items:baseline;gap:9px}
.axis .hd .k{font:400 21px/0.85 'Bebas Neue',Oswald,sans-serif;color:#F6F2EE;letter-spacing:.04em;flex:1}
.axis .hd .v{font:400 21px/0.85 'Bebas Neue',Oswald,sans-serif;color:#C41E26}
.axis .hd .p{font:500 9px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.3);width:38px;text-align:right}
.axis .how{font:400 10px/1.4 'IBM Plex Sans';color:rgba(242,239,233,.38);text-wrap:pretty}
.axis .bar{height:4px;border-radius:2px;background:#1F1F23;overflow:hidden}
.axis .bar i{display:block;height:100%;border-radius:2px;background:#C41E26;transition:width .5s ease}

.link{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 17px;border-radius:14px;background:#141416;border:1px solid rgba(242,239,233,.09);cursor:pointer;transition:.2s}
.link:hover{border-color:rgba(196,30,38,.4)}
.link .l{display:flex;align-items:center;gap:11px}
.link .l span{font:500 12.5px 'IBM Plex Sans';color:#F2EFE9}
.link svg{width:17px;height:17px;flex:none}
.link .arrow{font:400 13px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.35)}

.langbar{position:absolute;top:18px;right:20px;display:flex;gap:6px;z-index:70}
.langbar button{background:none;border:1px solid rgba(242,239,233,.12);color:rgba(242,239,233,.35);font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;padding:5px 9px;border-radius:7px;cursor:pointer}
.langbar button[aria-pressed="true"]{color:#E23B44;border-color:rgba(196,30,38,.5);background:rgba(196,30,38,.12)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="esp-supabase.js"></script>
<script>/* ESP-AUTH-GATE : accès réservé aux connectés */
if (window.EspAuth) window.EspAuth.requireAuth();</script>
</head>
<body>
<div class="phone">
<div class="screen">

<div class="head">
<button class="back" id="back" type="button" aria-label="Retour">←</button>
<div class="av" id="initials">ES</div>
<div class="c">
<b id="pName">TOI</b>
<span id="since">MEMBRE DEPUIS AVRIL 2026</span>
</div>
</div>

<div class="stats" id="stats"></div>

<div class="sechd">
<span data-k="photoTimeline">PHOTOS SEMAINE PAR SEMAINE</span>
<span id="bfRange">19,4 % → 14 %</span>
</div>
<div class="hscroll" id="timeline"></div>

<div class="rank">
<img src="logo-blanc.png" alt="">
<div class="c">
<span class="k"><span data-k="rankLabel">RANG</span> <span id="rankNum">5</span>/7</span>
<span class="n" id="rankName">Acier</span>
</div>
<div class="r">
<span class="k" data-k="recordLabel">RECORD</span>
<span id="rankRecord">Acier</span>
</div>
</div>

<div class="axes" id="axes"></div>

<div class="link" id="goSettings" role="button" tabindex="0">
<div class="l">
<svg viewBox="0 0 24 24" fill="none" stroke="rgba(242,239,233,.6)" stroke-width="1.6" stroke-linecap="round"><path d="M6 4v7M6 15v5M12 4v3M12 11v9M18 4v9M18 17v3"></path><circle cx="6" cy="13" r="2"></circle><circle cx="12" cy="9" r="2"></circle><circle cx="18" cy="15" r="2"></circle></svg>
<span data-k="settingsTitle">Réglages</span>
</div>
<span class="arrow">→</span>
</div>

</div>
</div>

<script>
/* ------------------------------------------------------------------
   Écran 18 — Profil. Autonome, trilingue (FR/EN/BG).
   Données de maquette : rang, axes et positions viennent du serveur.
   API : window.EspritumProfile.setUser({name, since, weeks, streak, points})
         window.EspritumProfile.setRank({rank, record})
         window.EspritumProfile.setAxes([{v, pos, w}, ...])   // ordre : esprit, force, endurance
         window.EspritumProfile.setTimeline([{label, img}, ...])
   Events : espritum:navigate ({to:'home'|'settings'})
   ------------------------------------------------------------------ */
var T = {
  fr: { memberSince:"MEMBRE DEPUIS AVRIL 2026", photoTimeline:"PHOTOS SEMAINE PAR SEMAINE",
    stats:["SEMAINES","SÉRIE","POINTS"], streakUnit:"J",
    rankLabel:"RANG", recordLabel:"RECORD", settingsTitle:"Réglages", you:"Toi",
    ranks:["Cendre","Pierre","Fer","Bronze","Acier","Obsidienne","Esprit"],
    axes:["ESPRIT","FORCE","ENDURANCE"],
    how:["Scan hebdo 100 pts · séance 40 · journée nutrition dans la cible 20 · progression vers ton objectif jusqu'à 300.",
         "Développé + squat + soulevé de terre, divisé par ton poids de corps. Un homme de 65 kg peut battre un homme de 95 kg.",
         "Kilomètres courus par semaine, pondérés par ta meilleure allure sur 5 km."],
    weeks:["S1","S4","S8","S12"] },
  en: { memberSince:"MEMBER SINCE APRIL 2026", photoTimeline:"WEEK BY WEEK PHOTOS",
    stats:["WEEKS","STREAK","POINTS"], streakUnit:"D",
    rankLabel:"RANK", recordLabel:"BEST", settingsTitle:"Settings", you:"You",
    ranks:["Ash","Stone","Iron","Bronze","Steel","Obsidian","Spirit"],
    axes:["SPIRIT","STRENGTH","ENDURANCE"],
    how:["Weekly scan 100 pts · session 40 · day on calorie target 20 · progress toward your goal up to 300.",
         "Bench + squat + deadlift, divided by your body weight. A 65 kg man can beat a 95 kg man.",
         "Kilometres run per week, weighted by your best 5 km pace."],
    weeks:["W1","W4","W8","W12"] },
  bg: { memberSince:"ЧЛЕН ОТ АПРИЛ 2026", photoTimeline:"СНИМКИ СЕДМИЦА ПО СЕДМИЦА",
    stats:["СЕДМИЦИ","СЕРИЯ","ТОЧКИ"], streakUnit:"Д",
    rankLabel:"РАНГ", recordLabel:"РЕКОРД", settingsTitle:"Настройки", you:"Ти",
    ranks:["Пепел","Камък","Желязо","Бронз","Стомана","Обсидиан","Дух"],
    axes:["ДУХ","СИЛА","ИЗДРЪЖЛИВОСТ"],
    how:["Седмично сканиране 100 т. · тренировка 40 · ден в калорийната цел 20 · напредък към целта до 300.",
         "Лежанка + клек + мъртва тяга, разделено на телесното ти тегло. Мъж от 65 кг може да победи мъж от 95 кг.",
         "Изтичани километри на седмица, претеглени с най-доброто ти време на 5 км."],
    weeks:["С1","С4","С8","С12"] }
};

var state = {
  lang:'fr', name:'', since:null, weeks:12, streak:12, points:860,
  rank:5, record:5, bfRange:"19,4 % → 14 %",
  axes:[{ v:"8 240", pos:"#42", w:"72%" }, { v:"4,1 ×", pos:"#118", w:"58%" }, { v:"31 km", pos:"#77", w:"64%" }],
  timeline:[
    { label:null, img:"photo-avant.png" },
    { label:null, img:"photo-avant.png" },
    { label:null, img:"photo-apres.png" },
    { label:null, img:"photo-apres.png" }
  ]
};

function d() { return T[state.lang]; }
function emit(n, x) { document.dispatchEvent(new CustomEvent(n, { detail: x || {} })); }
function myName() { return state.name.trim() || d().you; }

function render(l) {
  if (l) { state.lang = l; }
  var dd = d();
  document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = dd[el.dataset.k]; });

  document.getElementById('pName').textContent = myName().toUpperCase();
  document.getElementById('initials').textContent = state.name.trim() ? state.name.trim().slice(0, 2).toUpperCase() : 'ES';
  document.getElementById('since').textContent = state.since || dd.memberSince;
  document.getElementById('bfRange').textContent = state.bfRange;
  document.getElementById('rankNum').textContent = String(state.rank);
  document.getElementById('rankName').textContent = dd.ranks[state.rank - 1];
  document.getElementById('rankRecord').textContent = dd.ranks[state.record - 1];

  var vals = [String(state.weeks), state.streak + ' ' + dd.streakUnit, String(state.points)];
  document.getElementById('stats').innerHTML = dd.stats.map(function (k, i) {
    return '<div class="stat"><b style="color:' + (i === 2 ? '#E23B44' : '#F2EFE9') + '">' + vals[i] + '</b><span>' + k + '</span></div>';
  }).join('');

  document.getElementById('timeline').innerHTML = state.timeline.map(function (p, i) {
    return '<div class="shot"><div class="img"><div style="background-image:url(' + p.img + ')"></div></div>' +
      '<span>' + (p.label || dd.weeks[i] || '') + '</span></div>';
  }).join('');

  document.getElementById('axes').innerHTML = dd.axes.map(function (k, i) {
    var a = state.axes[i] || {};
    return '<div class="axis"><div class="hd"><span class="k">' + k + '</span>' +
      '<span class="v">' + a.v + '</span><span class="p">' + a.pos + '</span></div>' +
      '<span class="how">' + dd.how[i] + '</span>' +
      '<div class="bar"><i style="width:' + a.w + '"></i></div></div>';
  }).join('');

  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
  });
  document.documentElement.lang = state.lang;
  try { localStorage.setItem('espritum.lang', state.lang); } catch (e) {}
}

document.getElementById('back').addEventListener('click', function () { emit('espritum:navigate', { to: 'home' }); });
document.getElementById('goSettings').addEventListener('click', function () { emit('espritum:navigate', { to: 'settings' }); });
document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

window.EspritumProfile = {
  setLang: render,
  setUser: function (o) {
    ['name', 'since', 'weeks', 'streak', 'points', 'bfRange'].forEach(function (k) {
      if (o[k] !== undefined) state[k] = o[k];
    });
    render();
  },
  setRank: function (o) {
    if (o.rank !== undefined) state.rank = o.rank;
    if (o.record !== undefined) state.record = o.record;
    render();
  },
  setAxes: function (list) { state.axes = list; render(); },
  setTimeline: function (list) { state.timeline = list; render(); },
  getState: function () { return JSON.parse(JSON.stringify(state)); }
};

var saved = 'fr';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
render(saved);
</script>
<script>/* ESP-NAV — intégration */
(function () {
  try {
    var acc = JSON.parse(localStorage.getItem('espritum.account') || 'null');
    if (acc && acc.name && window.EspritumProfile) window.EspritumProfile.setUser({ name: acc.name });
  } catch (e) {}
})();
var ESP_ROUTES = { home: 'accueil.html', settings: 'reglages.html' };
document.addEventListener('espritum:navigate', function (ev) {
  var to = (ev.detail || {}).to;
  var url = ESP_ROUTES[to];
  if (url) window.location.href = url;
});

// Données réelles : profil (prénom, série, membre depuis) + timeline des photos de scan
if (window.EspAuth) {
  var espLang = 'fr'; try { espLang = localStorage.getItem('espritum.lang') || 'fr'; } catch (e) {}
  var espLocale = { fr: 'fr-FR', en: 'en-US', bg: 'bg-BG' }[espLang] || 'fr-FR';
  var pctFmt = function (n) { return Number(n).toFixed(1).replace('.', espLang === 'en' ? '.' : ',') + ' %'; };

  window.EspAuth.getProfile().then(function (p) {
    if (!p) return;
    var o = {};
    if (p.prenom) o.name = p.prenom;
    if (p.streak != null) o.streak = p.streak;
    if (p.created_at) {
      var s = new Date(p.created_at).toLocaleDateString(espLocale, { month: 'long', year: 'numeric' }).toUpperCase();
      o.since = (espLang === 'en' ? 'MEMBER SINCE ' : espLang === 'bg' ? 'ЧЛЕН ОТ ' : 'MEMBRE DEPUIS ') + s;
    }
    if (Object.keys(o).length) window.EspritumProfile.setUser(o);
  }).catch(function () {});

  window.EspAuth.listScans().then(function (scans) {
    if (!scans || !scans.length) return;
    // Fourchette de masse grasse (premier → dernier scan) + nombre de semaines suivies
    var withBf = scans.filter(function (s) { return s.masse_grasse != null; });
    if (withBf.length) {
      var first = withBf[0].masse_grasse, last = withBf[withBf.length - 1].masse_grasse;
      window.EspritumProfile.setUser({ weeks: scans.length, bfRange: withBf.length > 1 ? (pctFmt(first) + ' → ' + pctFmt(last)) : pctFmt(last) });
    }
    // Timeline : photos réelles (URLs signées), étiquetées par semaine
    var withPhoto = scans.filter(function (s) { return s.photo_url; });
    if (!withPhoto.length) return;
    var firstDate = new Date(scans[0].created_at).getTime();
    Promise.all(withPhoto.map(function (s) { return window.EspAuth.getSignedUrl(s.photo_url); })).then(function (urls) {
      var tl = withPhoto.map(function (s, i) {
        var wk = Math.max(1, Math.floor((new Date(s.created_at).getTime() - firstDate) / (7 * 86400000)) + 1);
        return { label: 'S' + wk, img: urls[i] || 'photo-avant.png' };
      });
      window.EspritumProfile.setTimeline(tl);
    });
  }).catch(function () {});
}
</script>
</body>
</html>
