<style>
*{box-sizing:border-box}
html,body{height:100%;background:#0B0B0C}
body{margin:0;background:#0B0B0C;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
@keyframes eFadeIn{from{opacity:0}to{opacity:1}}
@keyframes eSpin{to{transform:rotate(360deg)}}
@keyframes eBlink{0%,100%{opacity:.2}50%{opacity:1}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:66px 26px 30px;gap:14px;animation:eFadeIn .4s ease both}
.center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.ring{position:relative;width:184px;height:184px;flex:none}
.ring .inner{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(242,239,233,.08)}
.ring .orbit{position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(196,30,38,.2);animation:eSpin 18s linear infinite}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font:700 52px/1 Oswald,sans-serif;color:#F2EFE9}
.ring .num i{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.2em;color:rgba(242,239,233,.35);margin-top:4px;font-style:normal}

.title{font:700 20px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-top:38px;text-align:center}
.steps{display:flex;flex-direction:column;gap:11px;margin-top:26px;width:100%}
.step{display:flex;gap:11px;align-items:center}
.step .mark{width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid rgba(196,30,38,.3);display:flex;align-items:center;justify-content:center;color:rgba(196,30,38,.35);animation:eBlink 1.4s ease-in-out infinite;transition:border-color .3s ease,background .3s ease,color .3s ease}
.step .mark svg{width:11px;height:11px;display:block;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.step .label{font:400 12px 'IBM Plex Sans';color:rgba(242,239,233,.3);transition:color .3s ease}
.step.done .mark{border-color:#C41E26;background:rgba(196,30,38,.16);color:#E23B44;animation:none}
.step.done .label{color:#F2EFE9}

.verse{flex:none;font:400 11.5px/1.6 'IBM Plex Sans';color:rgba(242,239,233,.28);text-align:center;font-style:italic}

.langbar{position:absolute;top:18px;right:20px;display:flex;gap:6px;z-index:5}
.langbar button{background:none;border:1px solid rgba(242,239,233,.12);color:rgba(242,239,233,.35);font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;padding:5px 9px;border-radius:7px;cursor:pointer;transition:.2s}
.langbar button[aria-pressed="true"]{color:#E23B44;border-color:rgba(196,30,38,.5);background:rgba(196,30,38,.12)}
</style>
<style>/* ESP-MOBILE-FRAME — cadre téléphone sur grand écran (desktop) */
@media (min-width: 500px) {
  html { background: #050506; min-height: 100%; }
  body {
    position: relative;
    width: 390px;
    height: 844px;
    max-height: calc(100dvh - 24px);
    margin: 12px auto;
    overflow: hidden;
    border-radius: 44px;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(242,239,233,.07);
  }
}
.errbox{display:none;flex-direction:column;align-items:center;text-align:center;gap:13px;padding:0 30px;max-width:340px}
body.error .center,body.error .verse{display:none}
body.error .errbox{display:flex}
.erricon{width:58px;height:58px;border-radius:50%;background:rgba(196,30,38,.12);border:1px solid rgba(196,30,38,.4);display:flex;align-items:center;justify-content:center}
.errtitle{font:600 20px 'Bebas Neue',Oswald,sans-serif;letter-spacing:.05em;color:#F6F2EE}
.errmsg{font:400 13px/1.5 'IBM Plex Sans',sans-serif;color:rgba(242,239,233,.6)}
.errbtn{margin-top:6px;padding:13px 28px;border:none;border-radius:12px;background:#C41E26;color:#F6F2EE;font:600 13px 'IBM Plex Sans',sans-serif;letter-spacing:.02em;cursor:pointer}
.errbtn:hover{background:#E23B44}

<body>
<div class="screen">

</div>

<div class="errtitle" id="errTitle">Photo non exploitable</div>
<div class="errmsg" id="errMsg"></div>
<button type="button" class="errbtn" id="errRetake">Reprendre la photo</button>
</div>

<div class="verse" data-k="analyzeVerse">« Ne savez-vous pas que votre corps est le temple du Saint-Esprit ? »</div>
</div>

<script>
/* ------------------------------------------------------------------
   Espritum — écran « Analyse IA ».
   Écran d'attente : la progression est pilotée de l'extérieur.

   Intégration :
     window.EspritumAnalyze.setProgress(0..100)   position exacte
     window.EspritumAnalyze.simulate()            démo autonome
     window.EspritumAnalyze.stop()                arrête la démo
     window.EspritumAnalyze.setLang('fr'|'en'|'bg')
   Émet espritum:analyze-done quand la barre atteint 100.

   Le vrai appel API doit plafonner à 92 % tant que la réponse
   n'est pas revenue, puis appeler setProgress(100).
   ------------------------------------------------------------------ */

var T = {
  fr: {
    analyzing: "L'IA t'analyse",
    analyzeVerse: "« Ne savez-vous pas que votre corps est le temple du Saint-Esprit ? »",
    steps: ["Détection de la morphologie", "Estimation de la masse grasse", "Calcul de l'écart à l'objectif", "Génération de ton plan"]
  },
  en: {
    analyzing: "The AI is reading you",
    analyzeVerse: "\u201CDo you not know that your body is a temple of the Holy Spirit?\u201D",
    steps: ["Detecting morphology", "Estimating body fat", "Measuring the gap", "Generating your plan"]
  },
  bg: {
    analyzing: "AI те анализира",
    analyzeVerse: "„Не знаете ли, че тялото ви е храм на Светия Дух?“",
    steps: ["Разпознаване на морфологията", "Оценка на телесните мазнини", "Изчисляване на разликата", "Генериране на плана ти"]
  }
};

var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5L10 17.5L19 7"></path></svg>';
var arc = document.getElementById('arc');
var pctEl = document.getElementById('pct');
var stepsEl = document.getElementById('steps');
var pct = 0, lang = 'en', timer = null, fired = false;

function renderSteps() {
  var labels = T[lang].steps;
  var at = Math.floor(pct / 25);
  stepsEl.innerHTML = labels.map(function (l, i) {
    return '<div class="step' + (i < at ? ' done' : '') + '"><div class="mark">' + CHECK + '</div><div class="label">' + l + '</div></div>';
  }).join('');
}

function setProgress(v) {
  pct = Math.max(0, Math.min(100, Math.round(v)));
  pctEl.textContent = pct;
  arc.setAttribute('stroke-dashoffset', String(590 - 590 * (pct / 100)));
  renderSteps();
  if (pct >= 100 && !fired) {
    fired = true;
    stop();
    document.dispatchEvent(new CustomEvent('espritum:analyze-done'));
  }
  if (pct < 100) fired = false;
}

function stop() { if (timer) { clearInterval(timer); timer = null; } }

function simulate(cap) {
  var ceiling = typeof cap === 'number' ? cap : 100;
  stop();
  timer = setInterval(function () {
    if (pct >= ceiling) { stop(); return; }
    setProgress(pct + 2);
  }, 90);
}

function render(l) {
  lang = l;
  var d = T[l];
  document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = d[el.dataset.k]; });
  renderSteps();
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === l));
  });
  document.documentElement.lang = l;
  try { localStorage.setItem('espritum.lang', l); if (window.EspAuth && EspAuth.saveLang) EspAuth.saveLang(l); } catch (e) {}
}

document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

window.EspritumAnalyze = { setProgress: setProgress, simulate: simulate, stop: stop, setLang: render, getProgress: function () { return pct; } };

var saved = 'en';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
render(saved);
setProgress(0);
simulate(92); // plafonne à 92% tant que l'IA n'a pas répondu (voir ESP-NAV plus bas)
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="esp-supabase.js"></script>
<script>/* ESP-NAV — intégration */
var ESP_WEEKLY = /[?&]mode=weekly/.test(location.search);
document.addEventListener('espritum:analyze-done', function () {
  window.location.href = ESP_WEEKLY ? 'recalibrage.html?mode=weekly' : 'resultat.html';
});

/* Analyse IA réelle : envoie les photos + contexte à /api/analyze (onboarding)
   ou /api/recalibrate (scan hebdo), stocke le résultat, puis passe la barre à 100%. */
(function () {
  function readLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function readSS(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } }

  // Réduit une image (data-URL) à 768px max, JPEG qualité 0.72 — léger pour l'envoi + moins cher.
  function downscale(dataUrl, max, cb) {
    if (!dataUrl) { cb(null); return; }
    var img = new Image();
    img.onload = function () {
      var w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
      var c = document.createElement('canvas'); c.width = cw; c.height = ch;
      c.getContext('2d').drawImage(img, 0, 0, cw, ch);
      try { cb(c.toDataURL('image/jpeg', 0.72)); } catch (e) { cb(null); }
    };
    img.onerror = function () { cb(null); };
    img.src = dataUrl;
  }
  function raw(dataUrl) { if (!dataUrl) return null; var i = dataUrl.indexOf(','); return i >= 0 ? dataUrl.slice(i + 1) : dataUrl; }
  function finish() { try { window.EspritumAnalyze.setProgress(100); } catch (e) {} }

  // Scan hebdomadaire : nouvelle photo + profil → /api/recalibrate → localStorage 'espritum.recalibrage'
  function runWeekly(cur) {
    var lang = readLS('espritum.lang') || 'en';
    var profP = (window.EspAuth && window.EspAuth.getProfile) ? window.EspAuth.getProfile() : Promise.resolve(null);
    profP.then(function (p) {
      var profile = {};
      if (p) {
        profile.objectif = p.objectif; profile.poids = p.poids; profile.taille = p.taille;
        profile.masse_grasse = p.masse_grasse; profile.delai_mois = p.delai_mois;
        profile.calories_objectif = p.calories_objectif; profile.proteines_objectif = p.proteines_objectif;
      }
      downscale(cur, 768, function (curS) {
        fetch('/api/recalibrate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current: raw(curS), profile: profile, lang: lang })
        })
          .then(function (r) { return r.json().then(function (data) { return { status: r.status, data: data }; }); })
          .then(function (res) {
            // 422 : la photo n'est pas un corps — on refuse, sinon le plan serait
            // recalibré sur une estimation inventée
            if (res.status === 422 && res.data && res.data.rejected) {
              showAnalyzeError({ currentUsable: false, issue: res.data.reason });
              return;
            }
            var data = res.data;
            if (data && data.bodyFatCurrent != null && !data.error) {
              try { localStorage.setItem('espritum.recalibrage', JSON.stringify(data)); } catch (e) {}
            }
            finish();
          })
          .catch(function () { finish(); });
      });
    }, function () { finish(); });
  }

  function run() {
    var cur = readSS('espritum.photo.current');
    var goal = readSS('espritum.photo.goal');
    if (!cur) { finish(); return; } // pas de photo (accès direct) → on laisse passer
    if (ESP_WEEKLY) { runWeekly(cur); return; }

    var quiz = null, months = null, lang = 'en';
    try { quiz = JSON.parse(readLS('espritum.quiz') || 'null'); } catch (e) {}
    try { var dl = JSON.parse(readLS('espritum.deadline') || 'null'); months = dl && dl.months; } catch (e) {}
    lang = readLS('espritum.lang') || 'en';

    downscale(cur, 768, function (curS) {
      downscale(goal, 768, function (goalS) {
        fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current: raw(curS), goal: raw(goalS), quiz: quiz, months: months, lang: lang })
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            // Photos non exploitables (pas un corps) → on refuse l'analyse
            if (data && !data.error && (data.currentUsable === false || data.goalUsable === false)) {
              showAnalyzeError(data); return;
            }
            if (data && data.aiMonths && !data.error) {
              try { localStorage.setItem('espritum.analysis', JSON.stringify(data)); } catch (e) {}
            }
            finish();
          })
          .catch(function () { finish(); }); // en cas d'échec réseau, on continue (écran 8 en repli)
      });
    });
  }

  // Écran d'erreur : photo non exploitable → bouton pour reprendre la bonne photo
  function showAnalyzeError(data) {
    var lang = readLS('espritum.lang') || 'en';
    var L = {
      fr: { t: 'Photo non exploitable', d: 'Cette photo ne montre pas un corps analysable. Reprends une vraie photo de toi.', dg: 'La photo objectif doit montrer un physique humain. Choisis-en une autre.', b: 'Reprendre la photo' },
      en: { t: 'Unusable photo', d: 'This photo doesn\'t show an analysable body. Retake a real photo of yourself.', dg: 'The goal photo must show a human physique. Pick another one.', b: 'Retake photo' },
      bg: { t: 'Неизползваема снимка', d: 'Тази снимка не показва тяло за анализ. Направи истинска твоя снимка.', dg: 'Целевата снимка трябва да показва физика. Избери друга.', b: 'Направи отново' }
    }[lang] || { t: 'Photo non exploitable', d: 'Cette photo ne montre pas un corps analysable. Reprends une vraie photo de toi.', dg: 'La photo objectif doit montrer un physique humain.', b: 'Reprendre la photo' };
    var goalOnly = (data.currentUsable !== false && data.goalUsable === false);
    document.getElementById('errTitle').textContent = L.t;
    document.getElementById('errMsg').textContent = data.issue || (goalOnly ? L.dg : L.d);
    var btn = document.getElementById('errRetake');
    btn.textContent = L.b;
    // en scan hebdo on renvoie sur la prise de vue hebdo, pas sur celle de l'onboarding
    btn.onclick = function () {
      window.location.href = goalOnly ? 'corps-de-reve.html'
        : (ESP_WEEKLY ? 'photo-actuelle.html?mode=weekly' : 'photo-actuelle.html');
    };
    try { window.EspritumAnalyze.stop(); } catch (e) {}
    document.body.classList.add('error');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
