*{box-sizing:border-box}
html,body{height:100%;background:#08080A}
body{margin:0;min-height:100%;background:#08080A;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}

.budget .hd .l{display:flex;flex-direction:column;gap:3px;min-width:0}
.budget .k{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.18em;color:rgba(242,239,233,.35)}
.budget .v{font:400 26px/1 'Bebas Neue',Oswald,sans-serif;letter-spacing:.04em;color:#F2EFE9}

.budget .note.over{color:#E23B44}
.slider{position:relative;height:16px;display:flex;align-items:center;cursor:ew-resize;touch-action:none}
.slider .ticks{position:absolute;left:0;right:0;height:11px;background-image:repeating-linear-gradient(90deg,rgba(242,239,233,.16) 0 1px,transparent 1px 8.33%);background-repeat:no-repeat}
.slider .rail{position:absolute;left:0;right:0;height:1px;background:rgba(242,239,233,.14)}
.slider .fill{position:absolute;left:0;height:1px;background:#C41E26}
.slider .dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#C41E26;transform:translateX(-50%)}
.place{display:flex;align-items:center;gap:6px}
.place span:first-child{font-size:10px;line-height:1}
.place span:last-child{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:rgba(242,239,233,.3)}

.group{flex:none;display:flex;flex-direction:column;gap:2px}
.group .hd{display:flex;align-items:center;gap:10px;padding-bottom:6px}
.group .hd span{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.18em;color:rgba(242,239,233,.35);white-space:nowrap}
.group .hd i{flex:1;height:1px;background:rgba(242,239,233,.08);display:block}
.it{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid rgba(242,239,233,.06);cursor:pointer;transition:.2s}
.it:hover{padding-left:5px}
.it .e{width:18px;flex:none;font-size:13px;line-height:1;text-align:center}
.it .n{flex:1;min-width:0;font:400 12px 'IBM Plex Sans';color:#F2EFE9}
.it.on .n{color:rgba(242,239,233,.32);text-decoration:line-through}
.it .p{flex:none;font:400 13px/1 'Bebas Neue',Oswald,sans-serif;letter-spacing:.05em;color:rgba(242,239,233,.4)}
.it .tick{width:21px;height:21px;flex:none;border-radius:50%;border:1px solid rgba(242,239,233,.18);display:flex;align-items:center;justify-content:center;color:transparent;transition:.2s}
.it.on .tick{border-color:#3FBF63;background:rgba(63,191,99,.16);color:#3FBF63}

.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;background:linear-gradient(180deg,rgba(11,11,12,0),rgba(11,11,12,.96) 32%);backdrop-filter:blur(14px);border-top:1px solid rgba(242,239,233,.07);display:flex;align-items:flex-start;padding:10px 14px 0;z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding-top:9px;color:rgba(242,239,233,.32);transition:.2s}
.tab:hover{color:rgba(242,239,233,.72)}
.tab.on{color:#E23B44}

.tab.scan{gap:0;padding-top:0;margin-top:-12px}
.bigscan{position:relative;width:54px;height:54px;border-radius:50%;background:#18181B;border:1px solid rgba(242,239,233,.16);display:flex;align-items:center;justify-content:center;transition:.2s}
.bigscan:hover{border-color:rgba(196,30,38,.5);transform:translateY(-3px)}
.bigscan i{width:21px;height:21px;border:2px solid rgba(242,239,233,.5);border-radius:5px;display:block}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:132px;height:4px;border-radius:3px;background:rgba(242,239,233,.28);z-index:31}

.langbar{position:absolute;top:18px;right:20px;display:flex;gap:6px;z-index:70}

    groups:[
      { m:"Закуски · 7 дни", items:["Яйца — 24","Овесени ядки — 1 кг","Скир натурален — 4 бр.","Боровинки — 500 г","Бадеми — 200 г"] },
      { m:"Обеди · 7 дни", items:["Пилешко филе — 1,4 кг","Ориз басмати — 1 кг","Броколи — 800 г","Кайма 5% — 600 г","Сладък картоф — 1 кг"] },

    ] }
};

/* Pays : fx = taux de change (1 = zone euro), cost = niveau de prix local.
   Remplacer refPrice() par un appel à un vrai fournisseur de prix le jour venu. */
var REGIONS = [
  { key:"fr", label:"France", cur:"€", fx:1, cost:1 },
  { key:"be", label:"Belgique", cur:"€", fx:1, cost:1.06 },
  { key:"ch", label:"Suisse", cur:"CHF", fx:0.94, cost:1.55 },

var FOOD_EMOJI = [

];
var REF_PRICE = [
  [["bœuf","beef","кайма"], 9.5], [["œuf","egg","яйц"], 5.2], [["avoine","oat","овес"], 2.4],
  [["skyr","кисело","fromage blanc"], 4.8], [["myrtille","blueberr","боровинк"], 6.5], [["amande","almond","бадем"], 4.2],
  [["poulet","chicken","пиле"], 12.6], [["riz","rice","ориз"], 2.8], [["brocoli","broccoli","броколи"], 2.6],
  [["patate douce","sweet potato","сладък картоф"], 3.2], [["saumon","salmon","сьомга"], 18.9],
  [["cabillaud","cod","треска"], 11.4], [["lentille","lentil","леща"], 2.1], [["courgette","тиквич"], 2.3],

];
function match(table, label, fallback) {
  var l = (label || "").toLowerCase();
  for (var i = 0; i < table.length; i++) {
    for (var k = 0; k < table[i][0].length; k++) {
      if (l.indexOf(table[i][0][k]) >= 0) return table[i][1];
    }
  }
  return fallback;
}
function foodEmoji(l) { return match(FOOD_EMOJI, l, "🛒"); }
function refPrice(l) { return match(REF_PRICE, l, 3); }

var state = { lang:'fr', country:'fr', city:'', checked:{}, budget:null };

function d() { return T[state.lang]; }
function region() { return REGIONS.filter(function (r) { return r.key === state.country; })[0] || REGIONS[0]; }
function priceOf(label) { var r = region(); return refPrice(label) * r.cost * r.fx; }
function allItems() { return d().groups.reduce(function (a, g) { return a.concat(g.items); }, []); }
function estimate() { return Math.round(allItems().reduce(function (a, l) { return a + priceOf(l); }, 0)); }
function emit(n, x) { document.dispatchEvent(new CustomEvent(n, { detail: x || {} })); }

function bounds() {
  var r = region(), step = r.fx > 1.5 ? 10 : 5;
  return { step: step, min: Math.round(30 * r.fx / step) * step, max: Math.round(150 * r.fx / step) * step };
}

function renderBudget() {
  var b = bounds(), r = region(), est = estimate();
  var val = Math.min(b.max, Math.max(b.min, state.budget === null ? Math.ceil(est / b.step) * b.step : state.budget));
  var pct = ((val - b.min) / (b.max - b.min) * 100).toFixed(1) + '%';
  document.getElementById('budgetVal').textContent = val + ' ' + r.cur;
  document.getElementById('budgetFill').style.width = pct;
  document.getElementById('budgetDot').style.left = pct;
  var note = document.getElementById('budgetNote');
  note.textContent = (val < est ? d().tight : d().fits).replace('{n}', est + ' ' + r.cur);
  note.classList.toggle('over', val < est);
  document.getElementById('place').textContent =
    ((state.city.trim() || CITY_PH[state.country] || '').toUpperCase() + ' · ' + r.label.toUpperCase());
}

function renderGroups() {
  document.getElementById('groups').innerHTML = d().groups.map(function (g) {
    var rows = g.items.map(function (label) {
      var on = !!state.checked[label];
      return '<div class="it' + (on ? ' on' : '') + '" data-item="' + label.replace(/"/g, '&quot;') + '">' +
        '<span class="e">' + foodEmoji(label) + '</span>' +
        '<span class="n">' + label + '</span>' +
        '<span class="p">' + priceOf(label).toFixed(2).replace('.', ',') + ' ' + region().cur + '</span>' +
        '<span class="tick"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5L10 17.5L19 7"></path></svg></span>' +
        '</div>';
    }).join('');
    return '<div class="group"><div class="hd"><span>' + g.m + '</span><i></i></div>' + rows + '</div>';
  }).join('');
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = ['home','train','scan','food','rank'].map(function (key, i) {
    if (key === 'scan') return '<div class="tab scan" data-tab="scan" aria-label="' + d().tabs[i] + '"><div class="bigscan"><i></i></div></div>';
    var paths = ICONS[key].map(function (p) { return '<path d="' + p + '"></path>'; }).join('');
    return '<div class="tab' + (key === 'food' ? ' on' : '') + '" data-tab="' + key + '" aria-label="' + d().tabs[i] + '">' +
      '<svg viewBox="0 0 300 300">' + paths + '</svg><div class="dot"></div></div>';
  }).join('');
}

function render(l) {
  if (l) { state.lang = l; }
  var dd = d();
  document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = dd[el.dataset.k]; });
  renderBudget(); renderGroups(); renderTabs();
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
  });
  document.documentElement.lang = state.lang;
  try { localStorage.setItem('espritum.lang', state.lang); } catch (e) {}
}

document.getElementById('groups').addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-item]');
  if (!el) return;
  var key = el.dataset.item;
  state.checked[key] = !state.checked[key];
  emit('espritum:item-toggle', { item: key, checked: state.checked[key] });
  renderGroups();
});

var slider = document.getElementById('budgetSlider');
slider.addEventListener('pointerdown', function (ev) {
  ev.preventDefault();
  var b = bounds();
  var apply = function (e) {
    var r = slider.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    state.budget = Math.round((b.min + ratio * (b.max - b.min)) / b.step) * b.step;
    renderBudget();
  };
  apply(ev);
  var move = function (e) { apply(e); };
  var up = function () {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    emit('espritum:budget-change', { budget: state.budget, currency: region().cur, estimate: estimate() });
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});

document.getElementById('back').addEventListener('click', function () { emit('espritum:navigate', { to: 'food' }); });
document.getElementById('tabs').addEventListener('click', function (ev) {
  var tab = ev.target.closest('[data-tab]');
  if (tab) emit('espritum:navigate', { to: tab.dataset.tab });
});
document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

window.EspritumCourses = {
  setLang: render,
  setPlace: function (o) {
    if (o.country && CITY_PH[o.country] !== undefined) state.country = o.country;
    if (o.city !== undefined) state.city = o.city;
    state.budget = null;
    render();
  },
  setGroups: function (groups) { T[state.lang].groups = groups; state.budget = null; render(); },
  setPriceSource: function (fn) { refPrice = fn; render(); },
  getState: function () { return JSON.parse(JSON.stringify(state)); },
  getEstimate: estimate
};

var saved = 'fr';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
render(saved);
</script>
<script>/* ESP-NAV — intégration */
(function () {
  // Pays + ville saisis à l'inscription (page 9) → prix & localisation des courses
  try {
    var acc = JSON.parse(localStorage.getItem('espritum.account') || 'null');
    if (acc && (acc.country || acc.city) && window.EspritumCourses) {
      window.EspritumCourses.setPlace({ country: acc.country, city: acc.city });
    }
  } catch (e) {}
})();
var ESP_ROUTES = {
  home: 'accueil.html',
  train: 'entrainement.html',
  scan: null,             // TODO: scan hebdomadaire
  food: 'nutrition.html', // aussi la cible du bouton retour
  rank: 'classement.html'              // TODO: classement
};
document.addEventListener('espritum:navigate', function (ev) {
  var to = (ev.detail || {}).to;
  var url = ESP_ROUTES[to];
  if (url) window.location.href = url;
});
/* espritum:item-toggle / budget-change : sauvegarde liste & budget à brancher plus tard.
