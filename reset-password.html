<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Espritum — Nouveau mot de passe</title>
<link rel="apple-touch-icon" href="sensei-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;background:#08080A}
body{margin:0;min-height:100%;background:#08080A;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:#0B0B0C}
@media (min-width:420px) and (min-height:880px){.phone{border-radius:44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(242,239,233,.07)}}
@media (max-width:420px){.phone{width:100%;height:100vh;height:100dvh}body{padding:0}}
@keyframes eFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.screen{position:absolute;inset:0;padding:66px 26px 26px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;animation:eFade .45s ease both}
.screen::-webkit-scrollbar{display:none}
.t{font:700 32px/0.98 Oswald,sans-serif;text-transform:uppercase}
.s{font:400 13px/1.5 'IBM Plex Sans';color:rgba(242,239,233,.5)}
.field{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.field label{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:rgba(242,239,233,.4)}
.pwwrap{position:relative;display:flex}
.field input{width:100%;padding:14px 15px;padding-right:46px;border-radius:12px;background:#141416;border:1px solid rgba(242,239,233,.1);color:#F2EFE9;font:400 16px 'IBM Plex Sans';outline:none;transition:.2s}
.field input:focus{border-color:rgba(196,30,38,.6)}
.eye{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;padding:0 9px;background:none;border:none;color:rgba(242,239,233,.4);cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent}
.eye:hover,.eye.on{color:#E23B44}
.msg{font:400 11px 'IBM Plex Sans';min-height:14px}
.msg.err{color:#C96A5A}
.msg.ok{color:#3FBF63}
.cta{margin-top:6px;padding:16px;border-radius:13px;text-align:center;font:600 13px 'IBM Plex Sans';letter-spacing:.03em;background:#C41E26;color:#F6F2EE;border:none;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent}
.cta:hover{background:#E23B44}
.cta[disabled]{background:#1B1B1E;color:rgba(242,239,233,.28);cursor:default}
.link{margin-top:10px;text-align:center;font:400 11px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.35);cursor:pointer}
.link:hover{color:#E23B44}
.hidden{display:none}
</style>
</head>
<body>
<div class="phone">
<div class="screen">
<div class="t" id="title">Nouveau mot de passe</div>
<div class="s" id="sub">Vérification du lien…</div>

<div id="form" class="hidden">
<div class="field">
<label for="p1">NOUVEAU MOT DE PASSE</label>
<div class="pwwrap">
<input id="p1" type="password" autocomplete="new-password" placeholder="••••••••">
<button type="button" class="eye" id="eye1" aria-label="Afficher"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
<div class="field">
<label for="p2">CONFIRME LE MOT DE PASSE</label>
<div class="pwwrap">
<input id="p2" type="password" autocomplete="new-password" placeholder="••••••••">
</div>
</div>
<div class="msg" id="msg"></div>
<button class="cta" id="save" type="button" disabled>Enregistrer</button>
</div>

<div class="link" id="toLogin">← Retour à la connexion</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="esp-supabase.js"></script>
<script>
var T = {
  fr: { title:"Nouveau mot de passe", checking:"Vérification du lien…", ready:"Choisis un nouveau mot de passe.",
        invalid:"Ce lien est invalide ou expiré. Demande-en un nouveau depuis la page de connexion.",
        tooShort:"6 caractères minimum.", noMatch:"Les mots de passe ne correspondent pas.",
        saving:"Enregistrement…", done:"Mot de passe changé ! Redirection…", save:"Enregistrer", back:"← Retour à la connexion" },
  en: { title:"New password", checking:"Checking the link…", ready:"Choose a new password.",
        invalid:"This link is invalid or expired. Request a new one from the login page.",
        tooShort:"At least 6 characters.", noMatch:"Passwords don't match.",
        saving:"Saving…", done:"Password changed! Redirecting…", save:"Save", back:"← Back to login" },
  bg: { title:"Нова парола", checking:"Проверка на връзката…", ready:"Избери нова парола.",
        invalid:"Връзката е невалидна или изтекла. Поискай нова от страницата за вход.",
        tooShort:"Поне 6 символа.", noMatch:"Паролите не съвпадат.",
        saving:"Запазване…", done:"Паролата е сменена! Пренасочване…", save:"Запази", back:"← Назад към входа" }
};
var lang = 'fr'; try { lang = localStorage.getItem('espritum.lang') || 'fr'; } catch (e) {}
var d = T[lang] || T.fr;
var recovery = false;

var elTitle = document.getElementById('title'), elSub = document.getElementById('sub');
var elForm = document.getElementById('form'), elP1 = document.getElementById('p1'), elP2 = document.getElementById('p2');
var elMsg = document.getElementById('msg'), elSave = document.getElementById('save');
elTitle.textContent = d.title; elSub.textContent = d.checking;
elSave.textContent = d.save; document.getElementById('toLogin').textContent = d.back;

function showForm() {
  if (recovery) return;
  recovery = true;
  elSub.textContent = d.ready;
  elForm.classList.remove('hidden');
}
function showInvalid() {
  if (recovery) return;
  elSub.textContent = d.invalid;
}

// L'URL contient le jeton de récupération → supabase-js établit une session
if (window.espSB) {
  window.espSB.auth.onAuthStateChange(function (event, session) {
    if (event === 'PASSWORD_RECOVERY' || session) showForm();
  });
  window.espSB.auth.getSession().then(function (r) { if (r.data.session) showForm(); });
  // repli : si rien au bout de 4s, lien invalide
  setTimeout(showInvalid, 4000);
} else {
  showInvalid();
}

function validate() {
  var ok = elP1.value.length >= 6 && elP1.value === elP2.value;
  elSave.disabled = !ok;
  if (elP1.value.length > 0 && elP1.value.length < 6) { elMsg.className = 'msg err'; elMsg.textContent = d.tooShort; }
  else if (elP2.value.length > 0 && elP1.value !== elP2.value) { elMsg.className = 'msg err'; elMsg.textContent = d.noMatch; }
  else { elMsg.textContent = ''; elMsg.className = 'msg'; }
}
elP1.addEventListener('input', validate);
elP2.addEventListener('input', validate);
document.getElementById('eye1').addEventListener('click', function () {
  var shown = elP1.type === 'text';
  elP1.type = elP2.type = shown ? 'password' : 'text';
  this.classList.toggle('on', !shown);
});

elSave.addEventListener('click', function () {
  if (elP1.value.length < 6 || elP1.value !== elP2.value) { validate(); return; }
  elSave.disabled = true; elSave.textContent = d.saving;
  window.EspAuth.updatePassword(elP1.value).then(function (r) {
    if (r && r.error) { elMsg.className = 'msg err'; elMsg.textContent = r.error; elSave.disabled = false; elSave.textContent = d.save; return; }
    elMsg.className = 'msg ok'; elMsg.textContent = d.done;
    setTimeout(function () { window.location.href = 'compte.html?mode=login'; }, 1600);
  });
});

document.getElementById('toLogin').addEventListener('click', function () { window.location.href = 'compte.html?mode=login'; });
</script>
</body>
</html>
