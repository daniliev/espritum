<style>
*{box-sizing:border-box}
html,body{height:100%;background:#0B0B0C}
body{margin:0;background:#0B0B0C;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
@keyframes eFadeIn{from{opacity:0}to{opacity:1}}
@keyframes eFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ePulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(1)}50%{opacity:.85;transform:translate(-50%,-50%) scale(1.04)}}
@keyframes eScanLine{0%{top:6%}100%{top:94%}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:66px 24px 30px;animation:eFadeIn .35s ease both}
.head{flex:none;display:flex;flex-direction:column;gap:9px}
.headrow{display:flex;align-items:baseline;justify-content:space-between}
.steplabel{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.18em;color:#E23B44}
.stepcount{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:rgba(242,239,233,.3)}
.segs{display:flex;gap:5px}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(242,239,233,.13);display:block;transition:background .35s ease}
.segs i.on{background:#C41E26}

.titlerow{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.title{font:700 28px/0.96 Oswald,sans-serif;text-transform:uppercase;white-space:nowrap}
.back{width:40px;height:40px;margin:-10px -12px -10px 0;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(242,239,233,.35);font:400 13px 'IBM Plex Mono',monospace;border-radius:12px;transition:.2s;-webkit-tap-highlight-color:transparent}
.back:hover{color:#F2EFE9;background:rgba(242,239,233,.06)}

.rules{flex:none;display:flex;flex-direction:column;gap:7px}
.rule{display:flex;gap:10px;align-items:baseline}
.rule b{width:4px;height:4px;flex:none;background:#C41E26;transform:rotate(45deg);display:block}
.rule span{font:400 10.5px/1.45 'IBM Plex Sans';color:rgba(242,239,233,.42);text-wrap:pretty}

.stage{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;background:repeating-linear-gradient(135deg,#151517 0 9px,#111113 9px 18px);border:1px solid rgba(242,239,233,.09)}
#video,#preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#video.on,#preview.on{display:block}
#video{transform:scaleX(-1)}

.overlay{position:absolute;inset:0;pointer-events:none}
.silhouette{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:270px;border-radius:60px 60px 40px 40px;border:1.5px dashed rgba(196,30,38,.55);animation:ePulse 2.6s ease-in-out infinite}
.scanline{position:absolute;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,#C41E26,transparent);animation:eScanLine 2.4s ease-in-out infinite alternate}
.c{position:absolute;width:22px;height:22px}
.c.tl{left:14px;top:14px;border-left:2px solid rgba(196,30,38,.8);border-top:2px solid rgba(196,30,38,.8);border-radius:5px 0 0 0}
.c.tr{right:14px;top:14px;border-right:2px solid rgba(196,30,38,.8);border-top:2px solid rgba(196,30,38,.8);border-radius:0 5px 0 0}
.c.bl{left:14px;bottom:14px;border-left:2px solid rgba(196,30,38,.8);border-bottom:2px solid rgba(196,30,38,.8);border-radius:0 0 0 5px}
.c.br{right:14px;bottom:14px;border-right:2px solid rgba(196,30,38,.8);border-bottom:2px solid rgba(196,30,38,.8);border-radius:0 0 5px 0}
.hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font:500 10.5px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.55);letter-spacing:.06em;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.tag{position:absolute;left:16px;top:16px;padding:6px 10px;border-radius:7px;background:rgba(11,11,12,.8);font:600 9.5px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#E23B44}

.shutterwrap{flex:none;display:flex;justify-content:center}
.shutter{width:74px;height:74px;border-radius:50%;border:2px solid rgba(242,239,233,.22);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent}
.shutter:hover{border-color:#C41E26}
.shutter i{width:58px;height:58px;border-radius:50%;background:#F2EFE9;display:block}
.shutter:active i{transform:scale(.92)}

.actions{flex:none;display:none;gap:10px;animation:eFade .35s ease both}
.actions.on{display:flex}
.retake{padding:16px 20px;border-radius:14px;border:1px solid rgba(242,239,233,.14);color:rgba(242,239,233,.6);font:500 12.5px 'IBM Plex Sans';cursor:pointer;-webkit-tap-highlight-color:transparent}
.retake:hover{border-color:rgba(242,239,233,.35);color:#F2EFE9}
.next{flex:1;padding:16px;border-radius:14px;background:#C41E26;color:#F6F2EE;text-align:center;font:600 13px 'IBM Plex Sans';cursor:pointer;box-shadow:0 12px 30px -12px rgba(196,30,38,.7);-webkit-tap-highlight-color:transparent}
.next:hover{background:#E23B44}

.langbar{position:absolute;top:18px;right:20px;display:flex;gap:6px;z-index:5}
.langbar button{background:none;border:1px solid rgba(242,239,233,.12);color:rgba(242,239,233,.35);font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;padding:5px 9px;border-radius:7px;cursor:pointer;transition:.2s}
.langbar button[aria-pressed="true"]{color:#E23B44;border-color:rgba(196,30,38,.5);background:rgba(196,30,38,.12)}
#fileInput{display:none}
</style>

   Espritum — écran « Photo actuelle » avec overlay caméra.

   Comportement :
   1. Tente getUserMedia (caméra arrière) → flux vidéo en direct
      sous la silhouette. Nécessite HTTPS (ou localhost).
   2. Si refusé / indisponible (fichier local, permission refusée),
      bascule sur <input type="file" capture> → appareil photo natif.
   3. La photo capturée est exposée via window.EspritumScan.getPhoto()
      qui renvoie un dataURL JPEG, prêt à envoyer à l'analyse.
   ------------------------------------------------------------------ */

var T = {
  fr: {
    stepLabel: "TON CORPS AUJOURD'HUI", stepCount: "ÉTAPE 1 / 4",
    title: "Photographie ton corps",
    hint: "ALIGNE-TOI SUR LA SILHOUETTE",
    tagBefore: "AVANT", retake: "Reprendre", next: "Continuer →",
    rules: [
      "Torse nu, face au miroir, téléphone à hauteur de poitrine.",
      "Même endroit et même lumière chaque semaine.",
      "Corps entier dans le cadre, bras le long du corps."
    ]
  },
  en: {
    stepLabel: "YOUR BODY TODAY", stepCount: "STEP 1 / 4",
    title: "Photograph your body",
    hint: "ALIGN WITH THE SILHOUETTE",
    tagBefore: "BEFORE", retake: "Retake", next: "Continue →",
    rules: [
      "Shirtless, facing the mirror, phone at chest height.",
      "Same place and same light every week.",
      "Whole body in frame, arms at your sides."
    ]
  },
  bg: {
    stepLabel: "ТЯЛОТО ТИ ДНЕС", stepCount: "СТЪПКА 1 / 4",
    title: "Снимай тялото си",
    hint: "ПОДРАВНИ СЕ СЪС СИЛУЕТА",
    tagBefore: "ПРЕДИ", retake: "Пресними", next: "Продължи →",
    rules: [
      "Гол до кръста, срещу огледалото, телефон на нивото на гърдите.",
      "Едно и също място и една и съща светлина всяка седмица.",
      "Цялото тяло в кадър, ръце покрай тялото."
    ]
  }
};

var video = document.getElementById('video');
var preview = document.getElementById('preview');
var overlay = document.getElementById('overlay');
var tag = document.getElementById('tag');
var shutterwrap = document.getElementById('shutterwrap');
var actions = document.getElementById('actions');
var fileInput = document.getElementById('fileInput');
var canvas = document.getElementById('canvas');
var stream = null;
var photoData = null;
var liveMode = false;

function render(lang) {
  var d = T[lang];
  document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = d[el.dataset.k]; });
  document.getElementById('rules').innerHTML = d.rules.map(function (r) {
    return '<div class="rule"><b></b><span>' + r + '</span></div>';
  }).join('');
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  });
  document.documentElement.lang = lang;
  try { localStorage.setItem('espritum.lang', lang); } catch (e) {}
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1080 }, height: { ideal: 1920 } },
      audio: false
    });
    video.srcObject = stream;
    video.classList.add('on');
    liveMode = true;
    return true;
  } catch (e) {
    liveMode = false;
    return false;
  }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  video.classList.remove('on');
}

function showPhoto(dataUrl) {
  photoData = dataUrl;
  preview.src = dataUrl;
  preview.classList.add('on');
  overlay.style.display = 'none';
  tag.style.display = 'block';
  shutterwrap.style.display = 'none';
  actions.classList.add('on');
  stopCamera();
  document.dispatchEvent(new CustomEvent('espritum:photo', { detail: { dataUrl: dataUrl } }));
}

function captureFromVideo() {
  var w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return;
  canvas.width = w; canvas.height = h;
  var ctx = canvas.getContext('2d');
  ctx.translate(w, 0); ctx.scale(-1, 1);   // dé-miroir la caméra frontale
  ctx.drawImage(video, 0, 0, w, h);
  showPhoto(canvas.toDataURL('image/jpeg', 0.9));
}

document.getElementById('shutter').addEventListener('click', async function () {
  if (liveMode) { captureFromVideo(); return; }
  // Caméra pas encore active : on la (re)tente AVEC le geste utilisateur.
  // iOS n'autorise la caméra qu'après un tap et affiche la demande d'autorisation à ce moment.
  var ok = await startCamera();
  if (!ok) fileInput.click(); // vraiment refusée / indisponible → appareil photo natif
});

fileInput.addEventListener('change', function () {
  var f = fileInput.files && fileInput.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () { showPhoto(reader.result); };
  reader.readAsDataURL(f);
});

document.getElementById('retake').addEventListener('click', async function () {
  photoData = null;
  preview.classList.remove('on');
  preview.removeAttribute('src');
  overlay.style.display = 'block';
  tag.style.display = 'none';
  actions.classList.remove('on');
  shutterwrap.style.display = 'flex';
  fileInput.value = '';
  await startCamera();
});

document.getElementById('next').addEventListener('click', function () {
  document.dispatchEvent(new CustomEvent('espritum:next', { detail: { dataUrl: photoData } }));
});

document.getElementById('back').addEventListener('click', function () {
  document.dispatchEvent(new CustomEvent('espritum:back'));
});

document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

/* API pour l'intégration */
window.EspritumScan = {
  getPhoto: function () { return photoData; },
  isLive: function () { return liveMode; },
  setLang: render,
  stop: stopCamera
};

var saved = 'fr';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
render(saved);
startCamera();
window.addEventListener('pagehide', stopCamera);
</script>
<script>/* ESP-NAV — intégration */
var ESP_WEEKLY = /[?&]mode=weekly/.test(location.search);
document.addEventListener('espritum:photo', function (e) { try { localStorage.setItem('espritum.photo.current', e.detail.dataUrl); } catch (_) {} });
// Scan hebdomadaire = parcours raccourci : on saute le corps de rêve/questionnaire et on va droit à l'analyse
document.addEventListener('espritum:next', function () {
  window.location.href = ESP_WEEKLY ? 'analyse.html?mode=weekly' : 'corps-de-reve.html';
});
document.addEventListener('espritum:back', function () { window.location.href = ESP_WEEKLY ? 'accueil.html' : 'scan.html'; });
</script>
</body>
