<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;background:#08080A;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:#0B0B0C}
@media (min-width:420px) and (min-height:880px){.phone{border-radius:44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(242,239,233,.07)}}
@media (max-width:420px){.phone{width:100%;height:100vh;height:100dvh}body{padding:0}}
@keyframes eFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.screen{position:absolute;inset:0;padding:60px 22px 92px;display:flex;flex-direction:column;gap:12px;animation:eFade .4s ease both;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

.top{flex:none;display:flex;justify-content:space-between;align-items:flex-end}
.top .l{display:flex;flex-direction:column;gap:5px}
.kick{font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:rgba(242,239,233,.35)}
.h1{font:700 27px/1 Oswald,sans-serif;text-transform:uppercase}
.top .r{display:flex;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:10px;background:rgba(196,30,38,.14);border:1px solid rgba(196,30,38,.25)}
.streak img{width:9px;height:auto}
.streak span{font:600 12.5px Oswald,sans-serif;color:#E23B44}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:#18181B;border:1px solid rgba(242,239,233,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;color:rgba(242,239,233,.6)}
.avatar:hover{border-color:rgba(196,30,38,.6);color:#E23B44}
.avatar svg{width:19px;height:19px;fill:currentColor;display:block}

.card{flex:none;padding:15px 17px 12px;border-radius:18px;background:#131315;border:1px solid rgba(242,239,233,.08)}
.card .h{display:flex;justify-content:space-between;align-items:flex-start}
.card .k{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:rgba(242,239,233,.35)}
.card .v{display:flex;align-items:baseline;gap:5px;margin-top:3px}
.card .v b{font:700 25px/1 Oswald,sans-serif}
.card .v em{font:500 9.5px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.4);font-style:normal}
.card .note{font:500 8.5px/1.4 'IBM Plex Mono',monospace;color:rgba(242,239,233,.28);text-align:right;max-width:112px}
.graph{position:relative;height:70px;margin-top:9px}
.graph svg{width:100%;height:100%;display:block;overflow:visible}
.graph .end{position:absolute;left:97.3%;width:7.5px;height:7.5px;border-radius:50%;background:#F2EFE9;transform:translate(-50%,-50%);transition:top .5s ease}
.days{display:flex;justify-content:space-between;margin-top:6px}
.days span{font:500 8.5px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.26)}

.macros{flex:none;display:flex;gap:9px}
.macro{flex:1;padding:12px 13px;border-radius:14px;background:#141416;border:1px solid rgba(242,239,233,.08);display:flex;flex-direction:column;gap:7px}
.macro .hd{display:flex;align-items:center;gap:5px}
.macro .hd span:first-child{font-size:11px;line-height:1}
.macro .hd span:last-child{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:rgba(242,239,233,.35)}
.macro .val{font:600 12px 'IBM Plex Sans';color:#F2EFE9}
.macro .bar{height:3px;border-radius:2px;background:#1F1F23;overflow:hidden}
.macro .bar i{display:block;height:100%;border-radius:2px;background:#C41E26;transition:width .5s ease}

.scanbtn{flex:none;display:flex;align-items:center;gap:13px;padding:15px 17px;border-radius:16px;background:#C41E26;cursor:pointer;transition:.2s cubic-bezier(.2,.8,.2,1);box-shadow:0 8px 18px -12px rgba(196,30,38,.5)}
.scanbtn:hover{background:#E23B44;transform:translateY(-2px)}
.scanbtn .ic{width:34px;height:34px;flex:none;border-radius:11px;background:rgba(11,11,12,.22);display:flex;align-items:center;justify-content:center}
.scanbtn .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.scanbtn .tx b{font:600 13.5px 'IBM Plex Sans';color:#F6F2EE}
.scanbtn .tx span{font:400 10.5px 'IBM Plex Sans';color:rgba(246,242,238,.72)}

.meals{flex:none;display:flex;flex-direction:column;gap:8px}
.meal{height:70px;display:flex;align-items:center;border-radius:14px;background:#141416;border:1px solid rgba(242,239,233,.08);overflow:hidden;animation:eFade .35s ease both}
.meal .thumb{width:64px;height:70px;flex:none;position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,#1F1F23 0 6px,#191A1D 6px 12px);display:flex;align-items:center;justify-content:center}
.meal .thumb .shot{position:absolute;inset:0;background-size:cover;background-position:center}
.meal .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:0 11px}
.meal .mid .slot{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:rgba(242,239,233,.34)}
.meal .mid .n{font:500 12.5px/1.2 'IBM Plex Sans';color:rgba(242,239,233,.62);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meal.eaten .mid .n{color:#F2EFE9}
.meal .r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-right:14px}
.meal .r .k{font:400 17px/1 'Bebas Neue',Oswald,sans-serif;letter-spacing:.05em;color:rgba(242,239,233,.55)}
.meal.eaten .r .k{color:#F2EFE9}
.meal .r .u{font:500 8.5px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.28)}
.ask{padding:5px 9px;border-radius:8px;border:1px solid rgba(196,30,38,.35);font:500 8.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:rgba(226,59,68,.9);cursor:pointer;transition:.2s;white-space:nowrap;background:none}
.ask:hover{background:rgba(196,30,38,.14);border-color:rgba(196,30,38,.6)}

.courses{flex:none;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 12px;border-radius:11px;border:1px solid rgba(242,239,233,.1);cursor:pointer;transition:.2s;background:none}
.courses:hover{border-color:rgba(196,30,38,.45)}
.courses span:first-child{font-size:11px;line-height:1}
.courses span:last-child{font:500 10px 'IBM Plex Sans';color:rgba(242,239,233,.55)}

/* --- feuilles --- */
.veil{position:absolute;inset:0;z-index:60;background:rgba(6,6,8,.72);backdrop-filter:blur(6px);animation:eFade .2s ease both;display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:88%;background:#0E0E10;border-top:1px solid rgba(242,239,233,.09);border-radius:22px 22px 0 0;display:none;flex-direction:column;padding:16px 20px 118px;gap:12px;animation:eFade .28s ease both;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
body.cam .veil,body.res .veil,body.reco .veil{display:block}
body.cam #camSheet,body.res #resSheet,body.reco #recoSheet{display:flex}
.grab{flex:none;width:44px;height:4px;border-radius:3px;background:rgba(242,239,233,.22);align-self:center}
.sheetHd{flex:none;display:flex;align-items:center;justify-content:space-between}
.sheetHd .kick{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.2em;color:#E23B44}
.x{width:30px;height:30px;border-radius:50%;border:1px solid rgba(242,239,233,.14);display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(242,239,233,.5);transition:.2s;background:none}
.x:hover{border-color:rgba(196,30,38,.6);color:#E23B44}

.viewer{flex:none;height:340px;position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(120% 80% at 50% 20%,#1B1B1F,#0E0E10);border:1px solid rgba(242,239,233,.08);display:flex;align-items:center;justify-content:center}
.viewer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:0}
.viewer video.on{display:block}
.viewer .frame,.viewer .cap{z-index:1}
.frame{width:196px;height:196px;border-radius:22px;position:relative;margin-bottom:40px}
.frame i{position:absolute;width:34px;height:34px;display:block}
.frame i:nth-child(1){top:0;left:0;border-top:2px solid #C41E26;border-left:2px solid #C41E26;border-radius:12px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-top:2px solid #C41E26;border-right:2px solid #C41E26;border-radius:0 12px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-bottom:2px solid #C41E26;border-left:2px solid #C41E26;border-radius:0 0 0 12px}
.frame i:nth-child(4){bottom:0;right:0;border-bottom:2px solid #C41E26;border-right:2px solid #C41E26;border-radius:0 0 12px 0}
.viewer .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 16px 13px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;background:linear-gradient(180deg,transparent,rgba(8,8,10,.88))}
.viewer .cap b{font:700 18px/1.05 Oswald,sans-serif;text-transform:uppercase}
.viewer .cap span{font:400 10.5px 'IBM Plex Sans';color:rgba(242,239,233,.5)}
.cta{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:14px;background:#C41E26;cursor:pointer;transition:.2s;border:none;width:100%;font-family:inherit}
.cta:hover{background:#E23B44}
.cta span{font:600 13px 'IBM Plex Sans';color:#F6F2EE}
.ghost{flex:none;text-align:center;font:500 10.5px 'IBM Plex Sans';color:rgba(242,239,233,.4);cursor:pointer;transition:.2s;background:none;border:none;width:100%}
.ghost:hover{color:#E23B44}

.shotbox{flex:none;height:118px;border-radius:16px;overflow:hidden;position:relative;background:repeating-linear-gradient(135deg,#1F1F23 0 6px,#191A1D 6px 12px)}
.shotbox .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 11px;display:flex;align-items:baseline;justify-content:space-between;background:linear-gradient(180deg,transparent,rgba(8,8,10,.88))}
.shotbox .cap b{font:700 19px/1 Oswald,sans-serif;text-transform:uppercase}
.shotbox .cap span{font:400 24px/1 'Bebas Neue',Oswald,sans-serif;letter-spacing:.05em;color:#E23B44}
.items{flex:none;display:flex;flex-direction:column}
.item{display:flex;flex-direction:column;gap:7px;padding:10px 2px 12px;border-bottom:1px solid rgba(242,239,233,.06)}
.item .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.item .hd b{font:500 12.5px 'IBM Plex Sans';color:#F2EFE9;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .hd span{font:400 16px/1 'Bebas Neue',Oswald,sans-serif;letter-spacing:.06em;color:#E23B44;flex:none}
.slider{position:relative;height:16px;display:flex;align-items:center;cursor:ew-resize;touch-action:none}
.slider .ticks{position:absolute;left:0;right:0;height:11px;background-image:repeating-linear-gradient(90deg,rgba(242,239,233,.16) 0 1px,transparent 1px 6.25%);background-repeat:no-repeat}
.slider .rail{position:absolute;left:0;right:0;height:1px;background:rgba(242,239,233,.14)}
.slider .fill{position:absolute;left:0;height:1px;background:#C41E26}
.slider .dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#C41E26;transform:translateX(-50%)}
.slots{flex:none;display:flex;flex-direction:column;gap:8px}
.slots>span{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.18em;color:rgba(242,239,233,.35)}
.slots .row{display:flex;gap:8px}
.slots .row div{flex:1;min-width:0;height:38px;padding:0 4px;border-radius:12px;background:#161619;border:1px solid rgba(242,239,233,.09);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.slots .row div.on{background:rgba(196,30,38,.16);border-color:rgba(196,30,38,.5)}
.slots .row div span{font:500 10px/1 'IBM Plex Sans';color:rgba(242,239,233,.55);text-align:center}
.slots .row div.on span{color:#E23B44}
.ideas{flex:none;display:flex;flex-direction:column;gap:8px}
.idea{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;border-radius:13px;background:#141416;border:1px solid rgba(242,239,233,.08);cursor:pointer;transition:.2s}
.idea:hover{border-color:rgba(196,30,38,.5)}
.idea b{font:500 12.5px/1.25 'IBM Plex Sans';color:#F2EFE9;min-width:0}
.idea span{font:400 17px/1 'Bebas Neue',Oswald,sans-serif;letter-spacing:.05em;color:#E23B44;flex:none}
.sheetTitle{flex:none;font:700 20px/1.05 Oswald,sans-serif;text-transform:uppercase;text-align:center}

/* --- barre d'onglets --- */
.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;background:linear-gradient(180deg,rgba(11,11,12,0),rgba(11,11,12,.96) 32%);backdrop-filter:blur(14px);border-top:1px solid rgba(242,239,233,.07);display:flex;align-items:flex-start;padding:10px 14px 0;z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding-top:9px;color:rgba(242,239,233,.32);transition:.2s}
.tab:hover{color:rgba(242,239,233,.72)}
.tab.on{color:#E23B44}
.tab svg{width:24px;height:24px;fill:currentColor;display:block}
.tab .dot{width:4px;height:4px;border-radius:50%;background:transparent}
.tab.on .dot{background:#C41E26}
.tab.scan{gap:0;padding-top:0;margin-top:-12px}
.bigscan{position:relative;width:54px;height:54px;border-radius:50%;background:#18181B;border:1px solid rgba(242,239,233,.16);display:flex;align-items:center;justify-content:center;transition:.2s}
.bigscan:hover{border-color:rgba(196,30,38,.5);transform:translateY(-3px)}
.bigscan i{width:21px;height:21px;border:2px solid rgba(242,239,233,.5);border-radius:5px;display:block}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:132px;height:4px;border-radius:3px;background:rgba(242,239,233,.28);z-index:31}

.langbar{position:absolute;top:18px;right:20px;display:flex;gap:6px;z-index:70}
.langbar button{background:none;border:1px solid rgba(242,239,233,.12);color:rgba(242,239,233,.35);font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;padding:5px 9px;border-radius:7px;cursor:pointer}
.langbar button[aria-pressed="true"]{color:#E23B44;border-color:rgba(196,30,38,.5);background:rgba(196,30,38,.12)}
</style>
</head>
<body>
<div class="phone">
<div class="screen">

<div class="top">
<div class="l">
<div class="kick" data-k="today">AUJOURD'HUI</div>

</div>
<div class="r">
<div class="streak"><img src="logo-mark.png" alt=""><span id="streak">12</span></div>
<div class="avatar" id="goProfile" role="button" tabindex="0" aria-label="Profil">
<svg viewBox="0 0 300 300"><path d="M206.83,251.56h-113.66c-36.54-5.22-29.21-46.81-11.85-68.49,11.27-14.07,28.55-22.7,46.56-23.86,12.85-.83,30.22-.84,43.09-.14,18.31.99,35.99,9.51,47.51,23.77,17.5,21.65,25.03,63.46-11.65,68.72Z"></path><path d="M193.1,111.23c-11.64,31.09-52.28,39.66-75.78,16.16-22.59-22.59-15.68-61.54,13.38-74.67,37.72-17.04,76.91,19.74,62.4,58.51Z"></path></svg>
</div>
</div>
</div>

<div class="card">
<div class="h">
<div>

<div class="v"><b id="eaten">0</b><em id="eatenTarget">/ 2340 KCAL</em></div>
</div>
<span class="note" data-k="eatenNote">Cible calculée par ton plan</span>
</div>
<div class="graph">

var MEAL_SHOTS = { 0:"repas/petit-dejeuner.png", 1:"repas/dejeuner.png", 2:"repas/diner.png" };

// --- Caméra live du scan repas (photo réelle de l'assiette) ---
var mealCam = document.getElementById('mealCam');
var mealCanvas = document.getElementById('mealCanvas');
var mealFile = document.getElementById('mealFile');
var mealStream = null, mealLive = false;
async function startMealCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { mealLive = false; return; }
  try {
    mealStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    mealCam.srcObject = mealStream; mealCam.classList.add('on'); mealLive = true;
  } catch (e) { mealLive = false; }
}
function stopMealCam() {
  if (mealStream) { mealStream.getTracks().forEach(function (t) { t.stop(); }); mealStream = null; }
  if (mealCam) mealCam.classList.remove('on');
  mealLive = false;
}
function captureMeal() {
  var w = mealCam.videoWidth, h = mealCam.videoHeight;
  if (!w || !h) return null;
  mealCanvas.width = w; mealCanvas.height = h;
  mealCanvas.getContext('2d').drawImage(mealCam, 0, 0, w, h);
  return mealCanvas.toDataURL('image/jpeg', 0.85);
}
function showMealShot() {
  var sb = document.querySelector('#resSheet .shotbox');
  if (sb && state.mealPhoto) { sb.style.backgroundImage = 'url(' + state.mealPhoto + ')'; sb.style.backgroundSize = 'cover'; sb.style.backgroundPosition = 'center'; }
}
if (mealFile) mealFile.addEventListener('change', function () {
  var fl = mealFile.files && mealFile.files[0];
  if (!fl) return;
  var r = new FileReader();
  r.onload = function () { state.mealPhoto = r.result; showMealShot(); openSheet('res'); emit('espritum:photo-taken'); };
  r.readAsDataURL(fl);
});
var EAT_HIST = [2210, 2380, 2050, 2290, 2170, 2410];
var MACRO_EMOJI = ["🥩", "🍞", "🥑"];

var state = {
  lang:'fr', streak:12, kcalTarget:2340, macroTarget:{ p:190, c:260, f:70 },
  shots:{}, planned:{}, grams:{}, slot:null, recoSlot:null, coursesCount:20
};

function guessSlot() { var h = new Date().getHours(); return h < 11 ? 0 : (h < 16 ? 1 : 2); }
function emit(n, d) { document.dispatchEvent(new CustomEvent(n, { detail: d || {} })); }
function d() { return T[state.lang]; }

function mealsView() {
  return d().meals.map(function (m, i) {
    var shot = state.shots[i] || null, plan = state.planned[i];
    return { slot: d().slots[i], n: shot ? m.n : (plan ? plan.n : m.n), k: shot ? m.k : (plan ? plan.k : m.k), shot: shot };
  });
}
function eatenTotal() { return mealsView().reduce(function (a, m) { return a + (m.shot ? m.k : 0); }, 0); }

function poly(vals, max, h, w) {
  return vals.map(function (v, i) { return [8 + i * ((w - 16) / (vals.length - 1)), h - 8 - (Math.min(v, max) / max) * (h - 18)]; });
}
function line(p) { return p.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
function area(p, h) { return '8,' + h + ' ' + line(p) + ' ' + p[p.length - 1][0].toFixed(1) + ',' + h; }

function renderTop() {
  var eaten = eatenTotal();
  document.getElementById('eaten').textContent = String(eaten);
  document.getElementById('eatenTarget').textContent = '/ ' + state.kcalTarget + ' KCAL';
  var pts = poly(EAT_HIST.concat([eaten]), 2800, 76, 300);
  document.getElementById('eatLine').setAttribute('points', line(pts));
  document.getElementById('eatArea').setAttribute('points', area(pts, 76));
  document.getElementById('eatDot').style.top = (pts[6][1] / 76 * 100).toFixed(2) + '%';
  var ty = 76 - 8 - (state.kcalTarget / 2800) * (76 - 18);
  document.getElementById('targetLine').setAttribute('y1', ty.toFixed(1));
  document.getElementById('targetLine').setAttribute('y2', ty.toFixed(1));

  var ratio = Math.min(1, eaten / (state.kcalTarget || 1));
  var g = [state.macroTarget.p, state.macroTarget.c, state.macroTarget.f];
  document.getElementById('macros').innerHTML = d().macros.map(function (k, i) {
    return '<div class="macro"><div class="hd"><span>' + MACRO_EMOJI[i] + '</span><span>' + k + '</span></div>' +
      '<span class="val">' + Math.round(g[i] * ratio) + ' / ' + g[i] + ' g</span>' +
      '<div class="bar"><i style="width:' + Math.round(ratio * 100) + '%"></i></div></div>';
  }).join('');
}

function renderMeals() {
  document.getElementById('meals').innerHTML = mealsView().map(function (m, i) {
    return '<div class="meal' + (m.shot ? ' eaten' : '') + '">' +
      '<div class="thumb">' + (m.shot
        ? '<div class="shot" style="background-image:url(' + m.shot + ')"></div>'
        : '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="rgba(242,239,233,.28)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a1 1 0 0 1 1-1h3M21 8V5a1 1 0 0 0-1-1h-3M3 16v3a1 1 0 0 0 1 1h3M21 16v3a1 1 0 0 1-1 1h-3M12 9.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z"></path></svg>') +
      '</div>' +
      '<div class="mid"><span class="slot">' + m.slot.toUpperCase() + '</span><span class="n">' + m.n + '</span></div>' +
      '<div class="r"><span class="k">' + m.k + '</span>' +
      (m.shot ? '<span class="u">KCAL</span>' : '<button class="ask" type="button" data-reco="' + i + '">' + d().ask + '</button>') +
      '</div></div>';
  }).join('');
  document.getElementById('coursesLabel').textContent = d().coursesTitle + ' · ' + state.coursesCount + ' ' + d().itemsWord;
}

function renderResult() {
  var det = d().detected;
  var total = det.reduce(function (a, x, i) {
    var g = state.grams[i] === undefined ? x.g : state.grams[i];
    return a + x.k * (g / x.g);
  }, 0);
  document.getElementById('scanTotal').textContent = String(Math.round(total));
  document.getElementById('items').innerHTML = det.map(function (x, i) {
    var max = x.g * 2, g = state.grams[i] === undefined ? x.g : state.grams[i];
    var pct = (g / max * 100).toFixed(1) + '%';
    return '<div class="item"><div class="hd"><b>' + x.n + '</b><span>' + g + ' ' + d().gramUnit + '</span></div>' +
      '<div class="slider" data-slider="' + i + '"><div class="ticks"></div><div class="rail"></div>' +
      '<div class="fill" style="width:' + pct + '"></div><div class="dot" style="left:' + pct + '"></div></div></div>';
  }).join('');
  var slot = state.slot === null ? guessSlot() : state.slot;
  document.getElementById('slotRow').innerHTML = d().slots.map(function (label, i) {
    return '<div class="' + (i === slot ? 'on' : '') + '" data-slot="' + i + '"><span>' + label + '</span></div>';
  }).join('');
}

function renderReco() {
  var i = state.recoSlot;
  if (i === null) return;
  document.getElementById('recoTitle').textContent = d().recoTitle + ' ' + d().slots[i].toLowerCase();
  document.getElementById('ideas').innerHTML = d().ideas[i].map(function (x, k) {
    return '<div class="idea" data-idea="' + k + '"><b>' + x.n + '</b><span>' + x.k + '</span></div>';
  }).join('');
}

function renderTabs() {
  var keys = ['home', 'train', 'scan', 'food', 'rank'];
  document.getElementById('tabs').innerHTML = keys.map(function (key, i) {
    if (key === 'scan') return '<div class="tab scan" data-tab="scan" aria-label="' + d().tabs[i] + '"><div class="bigscan"><i></i></div></div>';
    var paths = ICONS[key].map(function (p) { return '<path d="' + p + '"></path>'; }).join('');
    return '<div class="tab' + (key === 'food' ? ' on' : '') + '" data-tab="' + key + '" aria-label="' + d().tabs[i] + '">' +
      '<svg viewBox="0 0 300 300">' + paths + '</svg><div class="dot"></div></div>';
  }).join('');
}

function render(l) {
  if (l) { state.lang = l; }
  var dd = d();
  document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = dd[el.dataset.k]; });
  document.getElementById('streak').textContent = String(state.streak);
  document.getElementById('days').innerHTML = dd.week.map(function (x) { return '<span>' + x + '</span>'; }).join('');
  renderTop(); renderMeals(); renderResult(); renderReco(); renderTabs();
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
  });
  document.documentElement.lang = state.lang;
  try { localStorage.setItem('espritum.lang', state.lang); } catch (e) {}
}

function openSheet(name) {
  document.body.classList.remove('cam', 'res', 'reco');
  if (name) document.body.classList.add(name);
}

document.getElementById('openScan').addEventListener('click', function () {
  state.grams = {}; state.slot = null;
  renderResult();
  openSheet('cam');
  startMealCam();
  emit('espritum:scan-open');
});
document.getElementById('shoot').addEventListener('click', function () {
  if (mealLive) { state.mealPhoto = captureMeal(); showMealShot(); stopMealCam(); openSheet('res'); emit('espritum:photo-taken'); }
  else { mealFile.click(); }
});
document.getElementById('retake').addEventListener('click', function () { openSheet('cam'); startMealCam(); });
document.getElementById('confirm').addEventListener('click', function () {
  var slot = state.slot === null ? guessSlot() : state.slot;
  state.shots[slot] = state.mealPhoto || MEAL_SHOTS[slot];
  openSheet(null);
  emit('espritum:meal-added', { slot: slot, grams: state.grams });
  render();
});
document.getElementById('veil').addEventListener('click', function () { stopMealCam(); openSheet(null); });
document.querySelectorAll('[data-close]').forEach(function (b) {
  b.addEventListener('click', function () { stopMealCam(); openSheet(null); });
});

document.getElementById('resSheet').addEventListener('pointerdown', function (ev) {
  var sl = ev.target.closest('[data-slider]'), slot = ev.target.closest('[data-slot]');
  if (slot) { state.slot = parseInt(slot.dataset.slot, 10); renderResult(); return; }
  if (!sl) return;
  ev.preventDefault();
  var i = parseInt(sl.dataset.slider, 10), max = d().detected[i].g * 2;
  var apply = function (e) {
    var r = sl.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    state.grams[i] = Math.max(10, Math.round(ratio * max / 10) * 10);
    renderResult();
  };
  apply(ev);
  var move = function (e) { apply(e); };
  var up = function () { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
});

document.getElementById('meals').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-reco]');
  if (!b) return;
  state.recoSlot = parseInt(b.dataset.reco, 10);
  renderReco();
  openSheet('reco');
});
document.getElementById('ideas').addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-idea]');
  if (!el) return;
  var i = state.recoSlot, k = parseInt(el.dataset.idea, 10);
  state.planned[i] = d().ideas[i][k];
  openSheet(null);
  emit('espritum:meal-planned', { slot: i, meal: state.planned[i] });
  render();
});

document.getElementById('goCourses').addEventListener('click', function () { emit('espritum:navigate', { to: 'courses' }); });
document.getElementById('goProfile').addEventListener('click', function () { emit('espritum:navigate', { to: 'profile' }); });
document.getElementById('tabs').addEventListener('click', function (ev) {
  var tab = ev.target.closest('[data-tab]');
  if (tab) emit('espritum:navigate', { to: tab.dataset.tab });
});
document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

window.EspritumNutrition = {
  setLang: render,
  setTargets: function (o) {
    if (o.calories !== undefined) state.kcalTarget = o.calories;
    if (o.protein !== undefined) state.macroTarget.p = o.protein;
    if (o.carbs !== undefined) state.macroTarget.c = o.carbs;
    if (o.fat !== undefined) state.macroTarget.f = o.fat;
    render();
  },
  setMealPhoto: function (slot, url) { state.shots[slot] = url; render(); },
  setDetected: function (list) { T[state.lang].detected = list; state.grams = {}; render(); },
  setCoursesCount: function (n) { state.coursesCount = n; render(); },
  setStreak: function (n) { state.streak = n; render(); },
  getState: function () { return JSON.parse(JSON.stringify(state)); }
};

var saved = 'fr';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
render(saved);
</script>
