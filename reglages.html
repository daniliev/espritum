var state = {
  lang:'fr', name:'', email:'', country:'fr', city:'', pass:'', avatar:null,
  trialDays:11, toggles:{}, open:null, docKind:'terms',
  draft:'', pass1:'', pass2:'', passShown:false
};

function u() { return UI[state.lang]; }
function region() { return REGIONS.filter(function (r) { return r.key === state.country; })[0] || REGIONS[0]; }
function cityLabel() { return state.city.trim() || region().city; }
function emit(n, x) { document.dispatchEvent(new CustomEvent(n, { detail: x || {} })); }
function toggleOn(row) { return state.toggles[row.id] === undefined ? !!row.on : state.toggles[row.id]; }

function valueOf(row) {
  if (row.id === 'name') return state.name.trim() || '—';
  if (row.id === 'email') return state.email.trim() || '—';
  if (row.id === 'place') return cityLabel() + ' · ' + region().label;
  if (row.id === 'pass') return '••••••••';
  if (row.id === 'lang') return (LANGS.filter(function (l) { return l.k === state.lang; })[0] || LANGS[0]).label;
  return '';
}

function renderList() {
  document.getElementById('list').innerHTML = u().groups.map(function (g) {
    var rows = g.rows.map(function (r) {
      var right = '';
      if (r.kind === 'toggle') {
        right = '<div class="sw' + (toggleOn(r) ? ' on' : '') + '"><i></i></div>';
      } else if (r.kind === 'photo') {
        right = '<div class="pic">' + (state.avatar
          ? '<div class="av" style="background-image:url(' + state.avatar + ')"></div>'
          : '<div class="empty"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7.5 9.5 12 5l4.5 4.5M5 19h14"></path></svg></div>') +
          '<span class="arrow">→</span></div>';
      } else if (r.kind === 'sub' || r.kind === 'doc') {
        right = '<span class="arrow">→</span>';
      } else {
        right = '<span class="v">' + valueOf(r) + ' &nbsp;→</span>';
      }
      return '<div class="row" data-row="' + r.id + '"><div class="l"><b>' + r.k + '</b>' +
        (r.hint ? '<span>' + r.hint + '</span>' : '') + '</div>' + right + '</div>';
    }).join('');
    return '<div class="group"><div class="hd"><span>' + g.title + '</span><i></i></div><div class="rows">' + rows + '</div></div>';
  }).join('') +
  '<button class="logout" id="logout" type="button"><span>' + u().logout + '</span></button>' +
  '<button class="danger" id="del" type="button"><span>' + u().deleteAccount + '</span></button>';
}

function rowById(id) {
  var out = null;
  u().groups.forEach(function (g) { g.rows.forEach(function (r) { if (r.id === id) out = r; }); });
  return out;
}

function sheetBody(row) {
  var w = u();
  if (row.kind === 'text') {
    return '<div class="field"><input id="draft" type="text" value="' + (state.draft || '').replace(/"/g, '&quot;') + '" placeholder="' + w.ph + '"></div>' +
      '<button class="cta" id="save" type="button">' + w.save + '</button>' +
      '<button class="ghost" data-close type="button">' + w.cancel + '</button>';
  }
  if (row.kind === 'place') {
    return '<div style="display:flex;gap:8px">' +
      '<div class="field" style="flex:1;min-width:0"><label>' + w.country + '</label>' +
      '<select id="fCountry">' + REGIONS.map(function (r) {
        return '<option value="' + r.key + '"' + (r.key === state.country ? ' selected' : '') + '>' + r.label + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field" style="flex:1;min-width:0"><label>' + w.city + '</label>' +
      '<input id="fCity" type="text" value="' + state.city.replace(/"/g, '&quot;') + '" placeholder="' + region().city + '"></div>' +
      '</div>' +
      '<button class="cta" id="save" type="button">' + w.save + '</button>' +
      '<button class="ghost" data-close type="button">' + w.cancel + '</button>';
  }
  if (row.kind === 'pass') {
    var type = state.passShown ? 'text' : 'password';
    var err = state.pass1.length > 0 && state.pass1.length < 6 ? w.passShort
      : (state.pass2.length > 0 && state.pass1 !== state.pass2 ? w.passMismatch : '');
    var eye = state.passShown
      ? '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.8"></circle><path d="M3.5 3.5l17 17"></path></svg>'
      : '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.8"></circle></svg>';
    return '<div style="display:flex;flex-direction:column;gap:11px">' +
      '<div class="field"><label>' + w.newPass + '</label>' +
      '<div style="position:relative;display:flex;align-items:center">' +
      '<input id="p1" type="' + type + '" value="' + state.pass1 + '" placeholder="' + w.passPh + '" style="padding-right:46px">' +
      '<div class="eye" id="eye">' + eye + '</div></div></div>' +
      '<div class="field"><label>' + w.confirmPass + '</label>' +
      '<input id="p2" type="' + type + '" value="' + state.pass2 + '" placeholder="' + w.passPh + '"></div>' +
      (err ? '<span class="err">' + err + '</span>' : '') +
      '</div>' +
      '<button class="cta" id="save" type="button">' + w.save + '</button>' +
      '<button class="ghost" data-close type="button">' + w.cancel + '</button>';
  }
  if (row.kind === 'photo') {
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:12px">' +
      (state.avatar
        ? '<div class="avatarBig" style="background-image:url(' + state.avatar + ')"></div>'
        : '<div class="avatarEmpty" id="pickBig"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V6M7 11l5-5 5 5M5 20h14"></path></svg></div>') +
      '<span style="font:400 10.5px \'IBM Plex Sans\';color:rgba(242,239,233,.35)">' + u().photoHint + '</span></div>' +
      '<button class="cta" id="pick" type="button">' + u().choosePhoto + '</button>' +
      (state.avatar ? '<button class="remove" id="removePhoto" type="button">' + u().removePhoto + '</button>' : '') +
      '<button class="ghost" data-close type="button">' + u().cancel + '</button>';
  }
  if (row.kind === 'lang') {
    return '<div style="display:flex;flex-direction:column;gap:8px">' + LANGS.map(function (o) {
      return '<div class="opt' + (o.k === state.lang ? ' on' : '') + '" data-lang-opt="' + o.k + '"><span>' + o.label + '</span>' +
        (o.k === state.lang ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#E23B44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M5 12.5L10 17.5L19 7"></path></svg>' : '') +
        '</div>';
    }).join('') + '</div>' +
    '<button class="ghost" data-close type="button">' + u().cancel + '</button>';
  }
  if (row.kind === 'sub') {
    var q = SUB_T[state.lang], over = state.trialDays <= 0;
    return '<div style="display:flex;flex-direction:column;gap:9px">' +
      '<div class="trial' + (over ? ' over' : '') + '"><div class="t"><b>' + q.trialTitle + '</b>' +
      '<span>' + (over ? q.tagOver : q.tagActive) + '</span></div>' +
      '<p>' + (over ? q.trialOver : q.trialLeft.replace('{n}', state.trialDays)) + '</p></div>' +
      '<div class="paid" id="subscribe"><div class="t"><b>' + q.paidTitle + '</b>' +
      '<div class="price"><span>' + q.price + '</span><span>' + q.per + '</span></div></div>' +
      '<p>' + q.desc + '</p></div></div>' +
      '<button class="ghost" data-close type="button">' + u().cancel + '</button>';
  }
  if (row.kind === 'doc') {
    var L = LEGAL[state.lang];
    return '<div class="doc"><span class="updated">' + L.updated + '</span>' +
      L[state.docKind].map(function (s) {
        return '<section><h3>' + s[0] + '</h3><p>' + s[1] + '</p></section>';
      }).join('') + '</div>' +
      '<button class="ghost" data-close type="button">' + u().cancel + '</button>';
  }
  return '';
}

function openSheet(id) {
  var row = rowById(id);
  if (!row || row.kind === 'toggle') return;
  state.open = id;
  if (row.kind === 'doc') state.docKind = row.doc;
  if (row.kind === 'text') state.draft = id === 'name' ? state.name : (id === 'email' ? state.email : '');
  if (row.kind === 'pass') { state.pass1 = ''; state.pass2 = ''; state.passShown = false; }
  document.getElementById('sheetTitle').textContent = row.k;
  document.getElementById('sheetBody').innerHTML = sheetBody(row);
  document.body.classList.add('sheeton');
}
function closeSheet() { state.open = null; document.body.classList.remove('sheeton'); }
function refreshSheet() {
  if (!state.open) return;
  var row = rowById(state.open);
  document.getElementById('sheetBody').innerHTML = sheetBody(row);
}

function render(l) {
  if (l) { state.lang = l; }
  document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = u()[el.dataset.k]; });
  renderList();
  if (state.open) { refreshSheet(); document.getElementById('sheetTitle').textContent = rowById(state.open).k; }
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
  });
  document.documentElement.lang = state.lang;
  try { localStorage.setItem('espritum.lang', state.lang); } catch (e) {}
}

document.getElementById('list').addEventListener('click', function (ev) {
  if (ev.target.closest('#logout')) { emit('espritum:logout'); return; }
  if (ev.target.closest('#del')) { emit('espritum:delete-account'); return; }
  var r = ev.target.closest('[data-row]');
  if (!r) return;
  var row = rowById(r.dataset.row);
  if (row.kind === 'toggle') {
    state.toggles[row.id] = !toggleOn(row);
    emit('espritum:setting-change', { id: row.id, value: state.toggles[row.id] });
    renderList();
    return;
  }
  openSheet(row.id);
});

document.getElementById('veil').addEventListener('click', closeSheet);

document.getElementById('sheetBody').addEventListener('input', function (ev) {
  if (ev.target.id === 'draft') state.draft = ev.target.value;
  if (ev.target.id === 'p1') state.pass1 = ev.target.value;
  if (ev.target.id === 'p2') state.pass2 = ev.target.value;
  if (ev.target.id === 'fCity') state.city = ev.target.value;
});
document.getElementById('sheetBody').addEventListener('change', function (ev) {
  if (ev.target.id === 'fCountry') { state.country = ev.target.value; refreshSheet(); }
});
document.getElementById('sheetBody').addEventListener('click', function (ev) {
  if (ev.target.closest('[data-close]')) { closeSheet(); return; }
  if (ev.target.closest('#eye')) { state.passShown = !state.passShown; refreshSheet(); return; }
  if (ev.target.closest('#pick') || ev.target.closest('#pickBig')) { document.getElementById('photoInput').click(); return; }
  if (ev.target.closest('#removePhoto')) { state.avatar = null; refreshSheet(); renderList(); emit('espritum:setting-change', { id:'photo', value:null }); return; }
  if (ev.target.closest('#subscribe')) { closeSheet(); emit('espritum:subscribe', { plan:'monthly', price:11.99 }); emit('espritum:navigate', { to:'pay' }); return; }
  var lo = ev.target.closest('[data-lang-opt]');
  if (lo) { closeSheet(); render(lo.dataset.langOpt); emit('espritum:setting-change', { id:'lang', value: state.lang }); return; }
  if (ev.target.closest('#save')) {
    var row = rowById(state.open);
    if (row.kind === 'text') {
      if (state.open === 'name') state.name = state.draft;
      if (state.open === 'email') state.email = state.draft;
    }
    if (row.kind === 'pass') {
      if (state.pass1.length < 6 || state.pass1 !== state.pass2) { refreshSheet(); return; }
      state.pass = state.pass1;
    }
    emit('espritum:setting-change', { id: state.open, value: row.kind === 'pass' ? '••••••' : valueOf(row) });
    closeSheet();
    renderList();
  }
});

document.getElementById('photoInput').addEventListener('change', function (ev) {
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    state.avatar = r.result;
    refreshSheet(); renderList();
    emit('espritum:setting-change', { id:'photo', value:'(image)' });
  };
  r.readAsDataURL(f);
});

document.getElementById('back').addEventListener('click', function () { emit('espritum:navigate', { to:'profile' }); });
document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

window.EspritumSettings = {
  setLang: render,
  setUser: function (o) {
    ['name', 'email', 'country', 'city', 'avatar'].forEach(function (k) {
      if (o[k] !== undefined) state[k] = o[k];
    });
    render();
  },
  setTrial: function (days) { state.trialDays = days; render(); },
  getState: function () { return JSON.parse(JSON.stringify(state)); }
};

var saved = 'fr';
try { var v = localStorage.getItem('espritum.lang'); if (v && UI[v]) saved = v; } catch (e) {}
render(saved);
</script>

  /* TODO: confirmation + suppression réelle du compte (Supabase). Ne rien supprimer sans confirmation. */
});
document.addEventListener('espritum:subscribe', function () { /* voir paiement.html (navigate:pay) */ });
