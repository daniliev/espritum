<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Espritum — Créer ton compte</title>
<link rel="apple-touch-icon" href="sensei-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0B0B0C"/><text x="50" y="62" font-family="Oswald,sans-serif" font-size="34" font-weight="700" fill="#C41E26" text-anchor="middle">E</text></svg>
</template>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;background:#08080A;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:#0B0B0C}
@media (min-width:420px) and (min-height:880px){.phone{border-radius:44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(242,239,233,.07)}}
@media (max-width:420px){.phone{width:100%;height:100vh;height:100dvh}body{padding:0}}
@keyframes eFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.screen{position:absolute;inset:0;padding:66px 26px 26px;display:flex;flex-direction:column;gap:14px;animation:eFade .45s ease both}

.head{flex:none;display:flex;flex-direction:column;gap:9px}
.head .t{font:700 34px/0.95 Oswald,sans-serif;text-transform:uppercase;white-space:nowrap}
.head .s{font:400 12.5px/1.55 'IBM Plex Sans';color:rgba(242,239,233,.45);text-wrap:pretty}

.tabs{flex:none;display:flex;gap:4px;padding:4px;background:#141416;border-radius:13px;border:1px solid rgba(242,239,233,.08)}
.tabs button{flex:1;padding:10px 0;border:none;border-radius:10px;background:none;color:rgba(242,239,233,.45);font:500 12px 'IBM Plex Sans';cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent}
.tabs button:hover{color:#F2EFE9}
.tabs button[aria-pressed="true"]{background:#C41E26;color:#F6F2EE;font-weight:600;letter-spacing:.02em}

.fields{flex:none;display:flex;flex-direction:column;gap:11px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:rgba(242,239,233,.4)}
.field input{width:100%;padding:14px 15px;border-radius:12px;background:#141416;border:1px solid rgba(242,239,233,.1);color:#F2EFE9;font:400 15px 'IBM Plex Sans';outline:none;transition:.2s}
.field input:focus{border-color:rgba(196,30,38,.6)}
.field select{width:100%;height:49.5px;padding:0 32px 0 15px;border-radius:12px;background-color:#141416;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='rgba(242,239,233,0.45)' stroke-width='1.6' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center;border:1px solid rgba(242,239,233,.1);color:#F2EFE9;font:400 15px 'IBM Plex Sans';outline:none;appearance:none;transition:.2s}
.field select:focus{border-color:rgba(196,30,38,.6)}
.field.half input{height:49.5px;padding:0 15px}
.duo{display:flex;gap:8px}
.duo .field{flex:1;min-width:0}
.weak{font:400 10.5px 'IBM Plex Sans';color:#C96A5A;display:none}
body.weak .weak{display:block}

.terms{flex:none;display:flex;gap:11px;align-items:flex-start;cursor:pointer;-webkit-tap-highlight-color:transparent}
.terms .box{width:18px;height:18px;flex:none;border-radius:6px;border:1px solid rgba(242,239,233,.22);margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.2s}
.terms .box i{width:7px;height:7px;background:#F6F2EE;transform:rotate(45deg);opacity:0;transition:.2s}
.terms[aria-checked="true"] .box{background:#C41E26;border-color:#C41E26}
.terms[aria-checked="true"] .box i{opacity:1}
.terms span{font:400 11px/1.5 'IBM Plex Sans';color:rgba(242,239,233,.45);text-wrap:pretty}

.cta{flex:none;padding:16px;border-radius:13px;text-align:center;font:600 13px 'IBM Plex Sans';letter-spacing:.03em;background:#1B1B1E;color:rgba(242,239,233,.28);border:1px solid rgba(242,239,233,.07);transition:.2s;-webkit-tap-highlight-color:transparent}
.cta.on{background:#C41E26;color:#F6F2EE;border-color:transparent;cursor:pointer;box-shadow:0 12px 30px -12px rgba(196,30,38,.7)}
.cta.on:hover{background:#E23B44;transform:translateY(-1px)}

.perks{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:9px;padding-top:16px;border-top:1px solid rgba(242,239,233,.08)}
.perks .row{display:flex;gap:10px;align-items:baseline}
.perks .row i{width:4px;height:4px;flex:none;background:#C41E26;transform:rotate(45deg)}
.perks .row span{font:400 11px/1.5 'IBM Plex Sans';color:rgba(242,239,233,.45);text-wrap:pretty}

.back{flex:none;text-align:center;font:400 11px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.3);cursor:pointer;-webkit-tap-highlight-color:transparent}
.back:hover{color:rgba(242,239,233,.6)}

.langbar{position:absolute;top:18px;right:20px;display:flex;gap:6px;z-index:30}
.langbar button{background:none;border:1px solid rgba(242,239,233,.12);color:rgba(242,239,233,.35);font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;padding:5px 9px;border-radius:7px;cursor:pointer;transition:.2s}
.langbar button[aria-pressed="true"]{color:#E23B44;border-color:rgba(196,30,38,.5);background:rgba(196,30,38,.12)}

body.login .signup-only{display:none}
</style>
</head>
<body>
<div class="phone">
<div class="screen">
<div class="head">
<div class="t" id="title">Commence ici.</div>
<div class="s" id="sub"></div>
</div>

<div class="tabs">
<button data-tab="signup" aria-pressed="true" id="tabSignup">Inscription</button>
<button data-tab="login" aria-pressed="false" id="tabLogin">Connexion</button>
</div>

<div class="fields">
<div class="field signup-only">
<label for="fName" id="lName">PRÉNOM</label>
<input id="fName" type="text" autocomplete="given-name" placeholder="Marc">
</div>
<div class="field">
<label for="fEmail" id="lEmail">ADRESSE EMAIL</label>
<input id="fEmail" type="email" autocomplete="email" placeholder="marc@espritum.com">
</div>
<div class="duo signup-only">
<div class="field half">
<label for="fCountry" id="lCountry">PAYS</label>
<select id="fCountry" autocomplete="country">
<option value="fr">France</option>
<option value="be">Belgique</option>
<option value="ch">Suisse</option>
<option value="uk">UK</option>
<option value="bg">България</option>
</select>
</div>
<div class="field half">
<label for="fCity" id="lCity">VILLE</label>
<input id="fCity" type="text" autocomplete="address-level2" placeholder="Lyon">
</div>
</div>
<div class="field">
<label for="fPass" id="lPass">MOT DE PASSE</label>
<input id="fPass" type="password" autocomplete="current-password" placeholder="••••••••">
<span class="weak" id="weak">6 caractères minimum.</span>
</div>
</div>

<div class="terms signup-only" id="terms" role="checkbox" aria-checked="false" tabindex="0">
<div class="box"><i></i></div>
<span id="termsText"></span>
</div>

<div class="cta" id="cta" role="button">Créer mon compte →</div>

<div class="perks" id="perks"></div>

<div class="back" id="back">← Revenir à mon analyse</div>
</div>
</div>

<script>
/* ------------------------------------------------------------------
   Espritum — écran 9 « Créer ton compte » / « Connexion ».

   Le compte est créé AVANT le choix de l'offre : on capte l'email au
   pic de motivation, avant la question du prix.
   Suite du parcours : compte → abonnement → paiement.

   Intégration :
     window.EspritumAuth.getValues()   {mode, name, email, pass, terms}
     window.EspritumAuth.setMode('signup'|'login')
     window.EspritumAuth.setLang('fr'|'en'|'bg')
     window.EspritumAuth.setError(texte|null)
   Émet espritum:signup, espritum:login (detail = valeurs) et espritum:back.
   ------------------------------------------------------------------ */

var T = {
  fr: {
    signupTab: "Inscription", loginTab: "Connexion",
    authTitle: "Commence ici.", authSub: "Tout commence par un premier pas. Le tien commence ici.",
    loginTitle: "Bon retour.", loginSub: "Entre tes identifiants pour reprendre là où tu t'étais arrêté.",
    fName: "PRÉNOM", fEmail: "ADRESSE EMAIL", fCountry: "PAYS", fCity: "VILLE", fPass: "MOT DE PASSE",
    phName: "Marc", phEmail: "marc@espritum.com",
    passWeak: "6 caractères minimum.",
    terms: "J'accepte les conditions d'utilisation et la politique de confidentialité d'Espritum.",
    ctaSignup: "Créer mon compte", ctaLogin: "Se connecter",
    back: "Revenir à mon analyse",
    perks: ["Estimation masse grasse par caméra dès l'inscription", "Verset biblique motivationnel chaque matin", "Coach Sensei IA disponible à tout moment", "Annulation à tout moment, sans engagement"]
  },
  en: {
    signupTab: "Sign up", loginTab: "Log in",
    authTitle: "Start here.", authSub: "It all starts with a first step. Yours starts here.",
    loginTitle: "Welcome back.", loginSub: "Enter your credentials to pick up where you left off.",
    fName: "FIRST NAME", fEmail: "EMAIL ADDRESS", fCountry: "COUNTRY", fCity: "CITY", fPass: "PASSWORD",
    phName: "Marc", phEmail: "marc@espritum.com",
    passWeak: "6 characters minimum.",
    terms: "I accept Espritum's terms of use and privacy policy.",
    ctaSignup: "Create my account", ctaLogin: "Log in",
    back: "Back to my analysis",
    perks: ["Camera body-fat estimate from day one", "A motivational Bible verse every morning", "Sensei AI coach available anytime", "Cancel anytime, no commitment"]
  },
  bg: {
    signupTab: "Регистрация", loginTab: "Вход",
    authTitle: "Започни тук.", authSub: "Всичко започва с една първа стъпка. Твоята е тук.",
    loginTitle: "Добре дошъл.", loginSub: "Въведи данните си, за да продължиш оттам, докъдето стигна.",
    fName: "ИМЕ", fEmail: "ИМЕЙЛ АДРЕС", fCountry: "ДЪРЖАВА", fCity: "ГРАД", fPass: "ПАРОЛА",
    phName: "Марк", phEmail: "marc@espritum.com",
    passWeak: "Минимум 6 символа.",
    terms: "Приемам общите условия и политиката за поверителност на Espritum.",
    ctaSignup: "Създай акаунт", ctaLogin: "Влез",
    back: "Обратно към анализа",
    perks: ["Оценка на телесните мазнини с камера от първия ден", "Мотивиращ библейски стих всяка сутрин", "AI треньор Сенсей по всяко време", "Отказ по всяко време, без ангажимент"]
  }
};

var lang = 'fr', mode = 'signup', terms = false;
var elName = document.getElementById('fName');
var elEmail = document.getElementById('fEmail');
var elPass = document.getElementById('fPass');
var elCountry = document.getElementById('fCountry');
var elCity = document.getElementById('fCity');
var CITY_PH = { fr: 'Lyon', be: 'Bruxelles', ch: 'Genève', uk: 'London', bg: 'София' };
var ctaEl = document.getElementById('cta');
var termsEl = document.getElementById('terms');
var weakEl = document.getElementById('weak');

function values() {
  return { mode: mode, name: elName.value.trim(), email: elEmail.value.trim(), country: elCountry.value, city: elCity.value.trim(), pass: elPass.value, terms: terms };
}
function valid() {
  var v = values();
  var okMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email);
  var okPass = v.pass.length >= 6;
  if (mode === 'login') return okMail && okPass;
  return okMail && okPass && v.name.length > 0 && terms;
}
function refresh() {
  document.body.classList.toggle('weak', elPass.value.length > 0 && elPass.value.length < 6);
  ctaEl.classList.toggle('on', valid());
}

function render(l) {
  lang = l;
  var d = T[l];
  document.getElementById('tabSignup').textContent = d.signupTab;
  document.getElementById('tabLogin').textContent = d.loginTab;
  document.getElementById('title').textContent = mode === 'signup' ? d.authTitle : d.loginTitle;
  document.getElementById('sub').textContent = mode === 'signup' ? d.authSub : d.loginSub;
  document.getElementById('lName').textContent = d.fName;
  document.getElementById('lEmail').textContent = d.fEmail;
  document.getElementById('lCountry').textContent = d.fCountry;
  document.getElementById('lCity').textContent = d.fCity;
  document.getElementById('lPass').textContent = d.fPass;
  elCity.placeholder = CITY_PH[elCountry.value] || '';
  elName.placeholder = d.phName;
  elEmail.placeholder = d.phEmail;
  weakEl.textContent = d.passWeak;
  document.getElementById('termsText').textContent = d.terms;
  ctaEl.textContent = (mode === 'signup' ? d.ctaSignup : d.ctaLogin) + ' →';
  document.getElementById('back').textContent = '← ' + d.back;
  document.getElementById('perks').innerHTML = d.perks.map(function (p) {
    return '<div class="row"><i></i><span>' + p + '</span></div>';
  }).join('');
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === l));
  });
  document.documentElement.lang = l;
  try { localStorage.setItem('espritum.lang', l); } catch (e) {}
  refresh();
}

function setMode(m) {
  mode = m;
  document.body.classList.toggle('login', m === 'login');
  elPass.setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.tab === m));
  });
  render(lang);
}

elCountry.addEventListener('change', function () {
  elCity.placeholder = CITY_PH[elCountry.value] || '';
  document.dispatchEvent(new CustomEvent('espritum:place', { detail: { country: elCountry.value, city: elCity.value.trim() } }));
});
elCity.addEventListener('change', function () {
  document.dispatchEvent(new CustomEvent('espritum:place', { detail: { country: elCountry.value, city: elCity.value.trim() } }));
});
document.querySelectorAll('.tabs button').forEach(function (b) {
  b.addEventListener('click', function () { setMode(b.dataset.tab); });
});
[elName, elEmail, elPass].forEach(function (i) { i.addEventListener('input', refresh); });

termsEl.addEventListener('click', function () {
  terms = !terms;
  termsEl.setAttribute('aria-checked', String(terms));
  refresh();
});
termsEl.addEventListener('keydown', function (e) {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); termsEl.click(); }
});

ctaEl.addEventListener('click', function () {
  if (!valid()) return;
  document.dispatchEvent(new CustomEvent('espritum:' + mode, { detail: values() }));
});
document.getElementById('back').addEventListener('click', function () {
  document.dispatchEvent(new CustomEvent('espritum:back'));
});
document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

window.EspritumAuth = {
  getValues: values,
  setMode: setMode,
  setLang: render,
  setError: function (txt) {
    weakEl.textContent = txt || T[lang].passWeak;
    document.body.classList.toggle('weak', !!txt);
  }
};

var saved = 'fr';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
setMode('signup');
render(saved);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="esp-supabase.js"></script>
<script>/* ESP-NAV — intégration (Supabase Auth) */
(function () {
  // Ouvre directement l'onglet Connexion si on arrive via « Déjà un compte ? »
  try {
    var p = new URLSearchParams(location.search);
    if (p.get('mode') === 'login' && window.EspritumAuth) window.EspritumAuth.setMode('login');
  } catch (e) {}
})();

function espShowError(msg) {
  if (window.EspritumAuth && window.EspritumAuth.setError) window.EspritumAuth.setError(msg);
  else alert(msg);
}
function espLang() { try { return localStorage.getItem('espritum.lang') || 'fr'; } catch (e) { return 'fr'; } }

document.addEventListener('espritum:signup', function (e) {
  var d = e.detail || {};
  if (!window.EspAuth) { window.location.href = 'abonnement.html'; return; }
  window.EspAuth.signUp({
    email: d.email, password: d.pass, prenom: d.name,
    pays: d.country, ville: d.city, langue: espLang()
  }).then(function (r) {
    if (r && r.error) { espShowError(r.error); return; }
    if (r && r.needsConfirm) { espShowError('Vérifie ta boîte mail pour confirmer ton compte.'); return; }
    // Prénom/email/pays/ville gardés pour la suite (prix courses, nom classement…). Jamais le mot de passe.
    try { localStorage.setItem('espritum.account', JSON.stringify({ name: d.name, email: d.email, country: d.country, city: d.city })); } catch (err) {}
    window.location.href = 'abonnement.html';
  }).catch(function () { espShowError('Erreur réseau, réessaie.'); });
});

document.addEventListener('espritum:login', function (e) {
  var d = e.detail || {};
  if (!window.EspAuth) { window.location.href = 'accueil.html'; return; }
  window.EspAuth.login({ email: d.email, password: d.pass }).then(function (r) {
    if (r && r.error) { espShowError(r.error); return; }
    window.location.href = 'accueil.html';
  }).catch(function () { espShowError('Erreur réseau, réessaie.'); });
});

document.addEventListener('espritum:back', function () { window.location.href = 'resultat.html'; });
</script>
</body>
</html>
