<style>
*{box-sizing:border-box}
html,body{height:100%;background:#08080A}
body{margin:0;min-height:100%;background:#08080A;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:#0B0B0C}
@media (min-width:420px) and (min-height:880px){.phone{border-radius:44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(242,239,233,.07)}}
@media (max-width:420px){.phone{width:100%;height:100vh;height:100dvh}body{padding:0}}
@keyframes eFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ePulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

.screen{position:absolute;inset:0;padding:60px 22px 92px;display:flex;flex-direction:column;gap:12px;animation:eFade .4s ease both;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

.top{flex:none;display:flex;justify-content:space-between;align-items:center}
.top .l{display:flex;flex-direction:column;gap:5px}
.kick{font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:rgba(242,239,233,.35)}
.h1{font:700 27px/1 Oswald,sans-serif;text-transform:uppercase}
.top .r{display:flex;align-items:center;gap:10px}
.count{font:600 11px 'IBM Plex Mono',monospace;color:#E23B44}
.streak{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:10px;background:rgba(196,30,38,.14);border:1px solid rgba(196,30,38,.25)}
.streak img{width:9px;height:auto}
.streak span{font:600 12.5px Oswald,sans-serif;color:#E23B44}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:#18181B;border:1px solid rgba(242,239,233,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;color:rgba(242,239,233,.6)}
.avatar:hover{border-color:rgba(196,30,38,.6);color:#E23B44}
.avatar svg{width:19px;height:19px;fill:currentColor;display:block}

/* --- carte muscle du jour --- */
.muscle{flex:none;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:#111113;border:1px solid rgba(196,30,38,.22);cursor:pointer;transition:.2s}
.muscle:hover{border-color:rgba(196,30,38,.55)}
.muscle .l{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.muscle .l img{width:88px;height:78px;object-fit:contain;display:block;filter:drop-shadow(0 0 18px rgba(196,30,38,.55)) drop-shadow(0 0 46px rgba(196,30,38,.4))}
.muscle .n{display:flex;flex-direction:column;align-items:center;gap:4px}
.muscle .n b{font:700 22px/1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.muscle .n i{font:500 8px 'IBM Plex Mono',monospace;letter-spacing:.2em;color:rgba(196,30,38,.85);font-style:normal}
.muscle .ringwrap{flex:1;display:flex;align-items:center;justify-content:center}
.ring{position:relative;width:106px;height:106px;flex:none}
.ring svg{width:106px;height:106px;transform:rotate(-90deg);display:block}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 22px/1 Oswald,sans-serif;color:#F6F2EE}

/* --- calories dépensées --- */
.burn{flex:none;padding:15px 17px 12px;border-radius:18px;background:#131315;border:1px solid rgba(242,239,233,.08)}
.burn .h{display:flex;justify-content:space-between;align-items:flex-start}
.burn .k{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:rgba(242,239,233,.35)}
.burn .v{display:flex;align-items:baseline;gap:5px;margin-top:3px}
.burn .v b{font:700 25px/1 Oswald,sans-serif;color:#C41E26}
.burn .v em{font:500 9.5px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.4);font-style:normal}
.burn .note{font:500 8.5px/1.4 'IBM Plex Mono',monospace;color:rgba(242,239,233,.28);text-align:right;max-width:118px}
.graph{position:relative;height:70px;margin-top:9px}
.graph svg{width:100%;height:100%;display:block;overflow:visible}
.graph .end{position:absolute;left:97.3%;width:7.5px;height:7.5px;border-radius:50%;background:#C41E26;transform:translate(-50%,-50%);transition:top .5s ease}
.days{display:flex;justify-content:space-between;margin-top:6px}
.days span{font:500 8.5px 'IBM Plex Mono',monospace;color:rgba(242,239,233,.26)}

/* --- exercices --- */
.list{flex:none;display:flex;flex-direction:column;gap:8px}
.exo{border-radius:14px;background:#141416;border:1px solid rgba(242,239,233,.08);overflow:hidden;transition:.2s}
.exo .row{height:70px;display:flex;align-items:center;cursor:pointer}
.exo .thumb{width:64px;height:70px;flex:none;position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,#EFEBE4 0 6px,#F6F2EE 6px 12px)}
.exo .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.exo .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:0 11px}
.exo .mid .n{font:500 12.5px/1.2 'IBM Plex Sans';display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.exo.done .mid .n{color:rgba(242,239,233,.42)}
.exo .mid .s{font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.04em;color:rgba(242,239,233,.32)}
.step{flex:none;display:flex;align-items:center;gap:5px;padding-right:10px}
.step button{width:21px;height:21px;flex:none;border-radius:50%;background:transparent;border:1px solid rgba(242,239,233,.14);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;color:rgba(242,239,233,.42);padding:0}
.step button:hover{border-color:rgba(196,30,38,.6);color:#E23B44}
.step .load{min-width:42px;text-align:center;font:400 16px/1 'Bebas Neue',Oswald,sans-serif;letter-spacing:.06em;color:rgba(242,239,233,.8)}
.sets{border-top:1px solid rgba(242,239,233,.07);background:#0F0F11;padding:6px 14px 10px;animation:eFade .25s ease both}
.set{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid rgba(242,239,233,.06);cursor:pointer;transition:.2s}
.set:last-child{border-bottom-color:transparent}
.set:hover{padding-left:5px}
.set span{flex:1;min-width:0;font:400 11.5px 'IBM Plex Sans';letter-spacing:.06em;color:rgba(242,239,233,.55)}
.set.on span{color:rgba(242,239,233,.32)}
.set .tick{width:22px;height:22px;flex:none;border-radius:50%;border:1px solid rgba(242,239,233,.18);display:flex;align-items:center;justify-content:center;color:transparent;transition:.2s}
.set.on .tick{border-color:#3FBF63;background:rgba(63,191,99,.16);color:#3FBF63}

/* --- pop-up muscles --- */
.picker{position:absolute;inset:0;z-index:60;background:rgba(6,6,8,.9);backdrop-filter:blur(10px);display:none;flex-direction:column;padding:70px 20px 100px;gap:18px;animation:eFade .25s ease both}
body.picking .picker{display:flex}
.picker .grab{flex:none;width:44px;height:4px;border-radius:3px;background:rgba(242,239,233,.22);align-self:center}
.picker .t{flex:none;font:700 24px/1 Oswald,sans-serif;text-transform:uppercase;text-align:center}
.grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:11px;align-content:start;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.mtile{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;padding:16px 10px 13px;border-radius:16px;background:#111113;border:1px solid rgba(242,239,233,.08);cursor:pointer;transition:.2s}
.mtile:hover{border-color:rgba(196,30,38,.55)}
.mtile.on{border-color:rgba(196,30,38,.55)}
.mtile img{width:74px;height:74px;object-fit:contain;display:block}
.mtile span{font:700 14px/1 Oswald,sans-serif;text-transform:uppercase;text-align:center}
.mtile.on span{color:#E23B44}
.exit{flex:none;padding:13px;border-radius:13px;border:1px solid rgba(242,239,233,.12);text-align:center;font:600 11px 'IBM Plex Sans';color:rgba(242,239,233,.55);cursor:pointer;transition:.2s}
.exit:hover{border-color:rgba(196,30,38,.5);color:#E23B44}

/* --- barre d'onglets --- */
.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;background:linear-gradient(180deg,rgba(11,11,12,0),rgba(11,11,12,.96) 32%);backdrop-filter:blur(14px);border-top:1px solid rgba(242,239,233,.07);display:flex;align-items:flex-start;padding:10px 14px 0;z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding-top:9px;color:rgba(242,239,233,.32);transition:.2s}
.tab:hover{color:rgba(242,239,233,.72)}
.tab.on{color:#E23B44}
.tab svg{width:24px;height:24px;fill:currentColor;display:block}
.tab .dot{width:4px;height:4px;border-radius:50%;background:transparent}
.tab.on .dot{background:#C41E26}
.tab.scan{gap:0;padding-top:0;margin-top:-12px}
.scanbtn{position:relative;width:54px;height:54px;border-radius:50%;background:#18181B;border:1px solid rgba(242,239,233,.16);display:flex;align-items:center;justify-content:center;transition:.2s}
.scanbtn:hover{border-color:rgba(196,30,38,.5);transform:translateY(-3px)}
.scanbtn i{width:21px;height:21px;border:2px solid rgba(242,239,233,.5);border-radius:5px;display:block}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:132px;height:4px;border-radius:3px;background:rgba(242,239,233,.28);z-index:31}

.langbar{position:absolute;top:18px;right:20px;display:flex;gap:6px;z-index:70}
.langbar button{background:none;border:1px solid rgba(242,239,233,.12);color:rgba(242,239,233,.35);font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;padding:5px 9px;border-radius:7px;cursor:pointer}
.langbar button[aria-pressed="true"]{color:#E23B44;border-color:rgba(196,30,38,.5);background:rgba(196,30,38,.12)}
</style>

var EX_KCAL = [140, 115, 130, 95, 110];
var BURNED_HIST = [520, 610, 470, 700, 590, 355];

var state = { lang:'fr', muscle:'pectoraux', streak:12, openEx:null, weights:{}, sets:{} };

function setsOf(str) { var m = /^\s*(\d+)\s*[×x]/.exec(str || ''); return m ? parseInt(m[1], 10) : 4; }
function repsOf(str) { var m = /[×x]\s*(\d+)/.exec(str || ''); return m ? m[1] : '10'; }
function weightOf(str) { var m = /([\d.,]+)\s*(kg|кг)/i.exec(str || ''); return m ? parseFloat(m[1].replace(',', '.')) : null; }
function exos() { return MUS_EX[state.muscle] || MUS_EX.pectoraux; }
function setsFor(i) {
  var n = setsOf(exos()[i].s), cur = state.sets[state.muscle + ':' + i], out = [];
  for (var k = 0; k < n; k++) out.push(!!(cur && cur[k]));
  return out;
}
function isDone(i) { return setsFor(i).every(function (v) { return v; }); }
function doneCount() { return exos().reduce(function (a, e, i) { return a + (isDone(i) ? 1 : 0); }, 0); }
function burnedToday() { return exos().reduce(function (a, e, i) { return a + (isDone(i) ? EX_KCAL[i] : 0); }, 0); }

function poly(vals, max, h, w) {
  return vals.map(function (v, i) {
    return [8 + i * ((w - 16) / (vals.length - 1)), h - 8 - (Math.min(v, max) / max) * (h - 18)];
  });
}
function line(p) { return p.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
function area(p, h) { return '8,' + h + ' ' + line(p) + ' ' + p[p.length - 1][0].toFixed(1) + ',' + h; }

function emit(name, detail) { document.dispatchEvent(new CustomEvent(name, { detail: detail || {} })); }

function renderList() {
  var d = T[state.lang];
  document.getElementById('list').innerHTML = exos().map(function (e, i) {
    var sets = setsFor(i), n = sets.length, done = isDone(i);
    var base = weightOf(e.s), key = state.muscle + ':' + i;
    var w = state.weights[key] === undefined ? base : state.weights[key];
    var load = base === null ? d.bodyweight : (w + ' KG');
    var rows = sets.map(function (on, k) {
      return '<div class="set' + (on ? ' on' : '') + '" data-ex="' + i + '" data-set="' + k + '">' +
        '<span>' + d.setLabel + ' ' + (k + 1) + ' — ' + repsOf(e.s) + ' ' + d.repsWord + '</span>' +
        '<div class="tick"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5L10 17.5L19 7"></path></svg></div></div>';
    }).join('');
    return '<div class="exo' + (done ? ' done' : '') + '">' +
      '<div class="row" data-row="' + i + '">' +
        '<div class="thumb"><img src="' + e.img + '" alt=""></div>' +
        '<div class="mid"><span class="n">' + e[state.lang] + '</span><span class="s">' +
          sets.filter(Boolean).length + '/' + n + ' ' + d.setWord + '</span></div>' +
        '<div class="step">' +
          '<button type="button" data-minus="' + i + '" aria-label="-"><svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>' +
          '<span class="load">' + load + '</span>' +
          '<button type="button" data-plus="' + i + '" aria-label="+"><svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>' +
        '</div>' +
      '</div>' +
      (state.openEx === i ? '<div class="sets">' + rows + '</div>' : '') +
    '</div>';
  }).join('');
}

function renderStats() {
  var dc = doneCount(), burn = burnedToday();
  document.getElementById('count').textContent = dc + '/5';
  document.getElementById('musPct').textContent = Math.round(dc / 5 * 100) + '%';
  document.getElementById('musArc').setAttribute('stroke-dashoffset', String(289 - 289 * (dc / 5)));
  document.getElementById('burned').textContent = String(burn);
  var pts = poly(BURNED_HIST.concat([burn]), 800, 76, 300);
  document.getElementById('burnLine').setAttribute('points', line(pts));
  document.getElementById('burnArea').setAttribute('points', area(pts, 76));
  document.getElementById('burnDot').style.top = (pts[6][1] / 76 * 100).toFixed(2) + '%';
}

function renderGrid() {
  document.getElementById('grid').innerHTML = MUSCLES.map(function (m) {
    return '<div class="mtile' + (m.key === state.muscle ? ' on' : '') + '" data-muscle="' + m.key + '">' +
      '<img src="' + m.img + '" alt=""><span>' + m[state.lang] + '</span></div>';
  }).join('');
}

function renderTabs() {
  var d = T[state.lang], keys = ['home', 'train', 'scan', 'food', 'rank'];
  document.getElementById('tabs').innerHTML = keys.map(function (key, i) {
    if (key === 'scan') return '<div class="tab scan" data-tab="scan" aria-label="' + d.tabs[i] + '"><div class="scanbtn"><i></i></div></div>';
    var paths = ICONS[key].map(function (p) { return '<path d="' + p + '"></path>'; }).join('');
    return '<div class="tab' + (key === 'train' ? ' on' : '') + '" data-tab="' + key + '" aria-label="' + d.tabs[i] + '">' +
      '<svg viewBox="0 0 300 300">' + paths + '</svg><div class="dot"></div></div>';
  }).join('');
}

function render(l) {
  if (l) { state.lang = l; }
  var d = T[state.lang];
  document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = d[el.dataset.k]; });
  var m = MUSCLES.filter(function (x) { return x.key === state.muscle; })[0] || MUSCLES[1];
  document.getElementById('muscleName').textContent = m[state.lang];
  document.getElementById('muscleImg').src = m.img;
  document.getElementById('streak').textContent = String(state.streak);
  document.getElementById('days').innerHTML = d.week.map(function (x) { return '<span>' + x + '</span>'; }).join('');
  renderList(); renderStats(); renderGrid(); renderTabs();
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
  });
  document.documentElement.lang = state.lang;
  try { localStorage.setItem('espritum.lang', state.lang); } catch (e) {}
}

document.getElementById('list').addEventListener('click', function (ev) {
  var minus = ev.target.closest('[data-minus]'), plus = ev.target.closest('[data-plus]');
  var setEl = ev.target.closest('.set'), row = ev.target.closest('[data-row]');
  if (minus || plus) {
    var i = parseInt((minus || plus).dataset[minus ? 'minus' : 'plus'], 10);
    var base = weightOf(exos()[i].s);
    if (base === null) return;
    var key = state.muscle + ':' + i;
    var cur = state.weights[key] === undefined ? base : state.weights[key];
    state.weights[key] = Math.max(0, Math.round((cur + (minus ? -2.5 : 2.5)) * 2) / 2);
    emit('espritum:weight-change', { exercise: i, weight: state.weights[key] });
    renderList();
    return;
  }
  if (setEl) {
    var ei = parseInt(setEl.dataset.ex, 10), sk = parseInt(setEl.dataset.set, 10);
    var arr = setsFor(ei);
    arr[sk] = !arr[sk];
    state.sets[state.muscle + ':' + ei] = arr;
    emit('espritum:set-toggle', { exercise: ei, set: sk, done: arr[sk] });
    renderList(); renderStats();
    return;
  }
  if (row) {
    var ri = parseInt(row.dataset.row, 10);
    state.openEx = state.openEx === ri ? null : ri;
    renderList();
  }
});

document.getElementById('muscleCard').addEventListener('click', function () { document.body.classList.add('picking'); });
document.getElementById('exit').addEventListener('click', function () { document.body.classList.remove('picking'); });
document.getElementById('picker').addEventListener('click', function (ev) {
  var tile = ev.target.closest('[data-muscle]');
  if (tile) {
    state.muscle = tile.dataset.muscle;
    state.openEx = null;
    document.body.classList.remove('picking');
    emit('espritum:muscle-change', { muscle: state.muscle });
    render();
    return;
  }
  if (ev.target === this) { document.body.classList.remove('picking'); }
});
document.getElementById('tabs').addEventListener('click', function (ev) {
  var tab = ev.target.closest('[data-tab]');
  if (tab) emit('espritum:navigate', { to: tab.dataset.tab });
});
document.getElementById('goProfile').addEventListener('click', function () { emit('espritum:navigate', { to: 'profile' }); });
document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

window.EspritumTraining = {
  setLang: render,
  setMuscle: function (key) { if (MUS_EX[key]) { state.muscle = key; state.openEx = null; render(); } },
  setExercises: function (key, list) { MUS_EX[key] = list; render(); },
  setStreak: function (n) { state.streak = n; render(); },
  getState: function () { return JSON.parse(JSON.stringify(state)); }
};

var saved = 'fr';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
render(saved);
</script>
<script>/* ESP-NAV — intégration */
var ESP_ROUTES = {
  home: 'accueil.html',
  train: null,     // déjà ici
  scan: null,      // TODO: scan hebdomadaire
  food: 'nutrition.html',
  rank: 'classement.html',      // TODO: classement
  profile: 'profil.html'    // TODO: profil
};
document.addEventListener('espritum:navigate', function (ev) {
  var to = (ev.detail || {}).to;
  if (to === 'scan') { window.location.href = 'photo-actuelle.html?mode=weekly'; return; }
  var url = ESP_ROUTES[to];
  if (url) window.location.href = url;
});
// Avatar (photo de profil) en haut à droite
if (window.EspAuth) window.EspAuth.getProfile().then(function (p) {
  if (p && p.avatar_url) { var av = document.getElementById('goProfile'); if (av) { av.style.backgroundImage = 'url(' + p.avatar_url + ')'; av.style.backgroundSize = 'cover'; av.style.backgroundPosition = 'center'; var s = av.querySelector('svg'); if (s) s.style.display = 'none'; } }
}).catch(function () {});
/* Persistance de la séance du jour (localStorage) + logging Supabase des exercices terminés */
(function () {
  if (typeof state === 'undefined') return;
  var t = new Date();
  var ymd = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  var LS = 'espritum.train.' + ymd;         // séance en cours (survit au rechargement)
  var LOGKEY = 'espritum.train.logged.' + ymd; // exercices déjà enregistrés en base aujourd'hui

  // 1) Restaurer la séance du jour
  try {
    var saved = JSON.parse(localStorage.getItem(LS) || 'null');
    if (saved) {
      if (saved.sets) state.sets = saved.sets;
      if (saved.weights) state.weights = saved.weights;
      if (saved.muscle && MUS_EX[saved.muscle]) state.muscle = saved.muscle;
      render();
    }
  } catch (e) {}

  function persist() {
    try { localStorage.setItem(LS, JSON.stringify({ sets: state.sets, weights: state.weights, muscle: state.muscle })); } catch (e) {}
  }
  function loadLogged() { try { return JSON.parse(localStorage.getItem(LOGKEY) || '{}'); } catch (e) { return {}; } }
  function saveLogged(o) { try { localStorage.setItem(LOGKEY, JSON.stringify(o)); } catch (e) {} }

  // Exercice « terminé » = toutes ses séries cochées (pour un muscle donné, pas seulement l'actif)
  function doneFor(muscle, e, i) {
    var n = setsOf(e.s), cur = state.sets[muscle + ':' + i];
    if (!cur) return false;
    for (var k = 0; k < n; k++) if (!cur[k]) return false;
    return true;
  }

  var uid = null;
  function logDone() {
    if (!uid || !window.espSB) return;
    var logged = loadLogged();
    Object.keys(MUS_EX).forEach(function (muscle) {
      (MUS_EX[muscle] || []).forEach(function (e, i) {
        var key = muscle + '|' + e.fr;
        if (logged[key] || !doneFor(muscle, e, i)) return;
        var base = weightOf(e.s);
        var w = state.weights[muscle + ':' + i]; if (w === undefined) w = base;
        var rec = {
          user_id: uid, nom: e.fr, muscle_cible: muscle,
          series: setsOf(e.s), reps: parseInt(repsOf(e.s), 10) || null,
          poids: (w == null ? 0 : w), termine: true
        };
        window.espSB.from('workouts').insert(rec).then(function (r) {
          if (!r.error) { logged[key] = true; saveLogged(logged); }
        }, function () {});
      });
    });
  }

  if (window.EspAuth) window.EspAuth.getSession().then(function (s) { if (s) { uid = s.user.id; logDone(); } });

  document.addEventListener('espritum:set-toggle', function () { persist(); logDone(); });
  document.addEventListener('espritum:weight-change', persist);
  document.addEventListener('espritum:muscle-change', persist);
})();
</script>
