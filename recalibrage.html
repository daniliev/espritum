<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Espritum — Recalibrage</title>
<link rel="apple-touch-icon" href="sensei-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0B0B0C"/><text x="50" y="62" font-family="Oswald,sans-serif" font-size="34" font-weight="700" fill="#C41E26" text-anchor="middle">E</text></svg>
</template>
<style>
*{box-sizing:border-box}
html,body{height:100%;background:#08080A}
body{margin:0;min-height:100%;background:#08080A;color:#F2EFE9;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:flex-start;justify-content:center;padding:16px 0}
.phone{position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:#0B0B0C}
@media (min-width:420px) and (min-height:880px){.phone{border-radius:44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(242,239,233,.07)}}
@media (max-width:420px){.phone{width:100%;height:100vh;height:100dvh}body{padding:0}}
@keyframes eFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.screen{position:absolute;inset:0;padding:56px 22px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:22px;animation:eFade .5s ease both}

.title{flex:none;font:700 30px/0.96 Oswald,sans-serif;text-transform:uppercase;white-space:nowrap}

.pair{flex:none;height:206px;display:flex;gap:9px;align-items:stretch}
.shot{flex:1;position:relative;border-radius:15px;overflow:hidden;background:#1B1B1F;border:1px solid rgba(242,239,233,.1)}
.shot.now{border-color:rgba(196,30,38,.5)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.shot .cap{position:absolute;left:0;right:0;bottom:0;padding:20px 9px 8px;background:linear-gradient(180deg,transparent,rgba(11,11,12,.85));display:flex;justify-content:space-between;align-items:baseline}
.shot .cap span{font:600 8px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:rgba(242,239,233,.6)}
.shot .cap b{font:700 14px/1 Oswald,sans-serif;color:rgba(242,239,233,.75)}
.shot.now .cap{background:linear-gradient(180deg,transparent,rgba(11,11,12,.88))}
.shot.now .cap span{color:#E23B44}
.shot.now .cap b{color:#F6F2EE}
.arrow{flex:none;align-self:center;width:26px;height:26px;border-radius:50%;background:#C41E26;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -4px rgba(196,30,38,.85);z-index:2;margin:0 -18px}
.arrow svg{display:block}

.tiles{flex:none;display:flex;align-items:stretch;padding:13px 4px;border-radius:14px;background:#131315;border:1px solid rgba(242,239,233,.07)}
.tile{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 4px;border-left:1px solid rgba(242,239,233,.08)}
.tile:first-child{border-left-color:transparent}
.tile .k{font:500 7.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:rgba(242,239,233,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .v{font:700 19px/1 Oswald,sans-serif;color:#F2EFE9}
.tile .d{font:600 9px 'IBM Plex Mono',monospace;color:#E23B44}

.block{flex:none;display:flex;flex-direction:column;gap:13px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow span{font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.18em;color:rgba(242,239,233,.35);white-space:nowrap}
.hrow i{flex:1;height:1px;background:rgba(242,239,233,.08);display:block}
.list{display:flex;flex-direction:column;gap:8px}
.chg{display:flex;gap:11px;align-items:center;padding:11px 13px;border-radius:13px;background:#141416;border:1px solid rgba(242,239,233,.08)}
.chg .ic{width:26px;height:26px;flex:none;border-radius:9px;background:rgba(196,30,38,.14);display:flex;align-items:center;justify-content:center}
.chg .ic svg{display:block}
.chg .tx{font:400 11.5px/1.4 'IBM Plex Sans';color:rgba(242,239,233,.72);flex:1}

.cta{flex:none;padding:16px;border-radius:14px;background:#C41E26;color:#F6F2EE;text-align:center;font:600 13px 'IBM Plex Sans';cursor:pointer;box-shadow:0 12px 30px -12px rgba(196,30,38,.7);transition:.2s;border:none;width:100%;font-family:'IBM Plex Sans',system-ui,sans-serif}
.cta:hover{background:#E23B44}

</style>
</head>
<body>
<div class="phone">
<div class="screen">

<div class="title" data-k="adjustTitle">Cette semaine.</div>

<div class="pair">
<div class="shot">
<img src="photo-avant.png" alt="">
<div class="cap"><span data-k="lastWeek">S12</span><b id="bfBefore">19,4%</b></div>
</div>
<div class="arrow">
<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#F6F2EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 6l6 6-6 6"></path></svg>
</div>
<div class="shot now">
<img src="photo-apres.png" alt="">
<div class="cap"><span data-k="thisWeek">S13 · AUJOURD'HUI</span><b id="bfAfter">18,6%</b></div>
</div>
</div>

<div class="tiles" id="tiles"></div>

<div class="block">
<div class="hrow"><span data-k="adjustPlanTitle">TON PLAN RÉÉCRIT</span><i></i></div>
<div class="list" id="changes"></div>
</div>

<button class="cta" id="apply" type="button"><span data-k="adjustCta">Appliquer mon nouveau plan</span> →</button>

</div>
</div>

<script>
var T = {
  fr: {
    adjustTitle:"Cette semaine.", lastWeek:"S12", thisWeek:"S13 · AUJOURD'HUI",
    adjustRows:[{k:"Masse grasse",b:"18,6 %",d:"−0,8"},{k:"Calories cibles",b:"2 210",d:"−130"},{k:"Protéines",b:"205 g",d:"+15"},{k:"Séances / semaine",b:"5",d:"+1"}],
    adjustPlanTitle:"TON PLAN RÉÉCRIT",
    adjustChanges:["Jour jambes déplacé au lundi","Développé couché : 4 × 6 · 75 kg","+15 min de marche les jours off"],
    adjustCta:"Appliquer mon nouveau plan"
  },
  en: {
    adjustTitle:"This week.", lastWeek:"W12", thisWeek:"W13 · TODAY",
    adjustRows:[{k:"Body fat",b:"18.6 %",d:"−0.8"},{k:"Target calories",b:"2,210",d:"−130"},{k:"Protein",b:"205 g",d:"+15"},{k:"Sessions / week",b:"5",d:"+1"}],
    adjustPlanTitle:"YOUR REWRITTEN PLAN",
    adjustChanges:["Leg day moves to Monday","Bench press: 4 × 6 · 75 kg","+15 min walking on off days"],
    adjustCta:"Apply my new plan"
  },
  bg: {
    adjustTitle:"Тази седмица.", lastWeek:"С12", thisWeek:"С13 · ДНЕС",
    adjustRows:[{k:"Мазнини",b:"18,6 %",d:"−0,8"},{k:"Целеви калории",b:"2 210",d:"−130"},{k:"Протеин",b:"205 г",d:"+15"},{k:"Тренировки / седмица",b:"5",d:"+1"}],
    adjustPlanTitle:"ПРЕНАПИСАНИЯТ ТИ ПЛАН",
    adjustChanges:["Краката минават в понеделник","Лежанка: 4 × 6 · 75 кг","+15 мин ходене в почивните дни"],
    adjustCta:"Приложи новия план"
  }
};

var CHANGE_ICONS = [
  "M4 6h16M4 6v13a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V6M8 3v4M16 3v4M14 12l-3 5",
  "M3 12h2M19 12h2M6.5 8v8M17.5 8v8M6.5 12h11",
  "M13 4.5a1.5 1.5 0 1 0 0-.1M11 8l2.5 1.5L15 13M13.5 9.5 11 13l1 4M11 13l-3 3M15 13l2 2"
];

var state = { lang:'fr', bfBefore:'19,4%', bfAfter:'18,6%', rows:null, changes:null };

function render(l) {
  if (l) { state.lang = l; }
  var d = T[state.lang];
  document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = d[el.dataset.k]; });
  document.getElementById('bfBefore').textContent = state.bfBefore;
  document.getElementById('bfAfter').textContent = state.bfAfter;

  var rows = state.rows || d.adjustRows;
  document.getElementById('tiles').innerHTML = rows.map(function (r) {
    return '<div class="tile"><span class="k">' + r.k + '</span><span class="v">' + r.b + '</span><span class="d">' + r.d + '</span></div>';
  }).join('');

  var changes = state.changes || d.adjustChanges;
  document.getElementById('changes').innerHTML = changes.map(function (c, i) {
    return '<div class="chg"><div class="ic"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#E23B44" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="' +
      CHANGE_ICONS[i % CHANGE_ICONS.length] + '"></path></svg></div><span class="tx">' + c + '</span></div>';
  }).join('');

  document.documentElement.lang = state.lang;
  try { localStorage.setItem('espritum.lang', state.lang); } catch (e) {}
}

document.getElementById('apply').addEventListener('click', function () {
  document.dispatchEvent(new CustomEvent('espritum:apply-plan'));
});

window.EspritumAdjust = {
  setLang: render,
  setPhotos: function (o) {
    if (o.before) { document.querySelector('.shot img').src = o.before; }
    if (o.after) { document.querySelector('.shot.now img').src = o.after; }
    if (o.bfBefore) { state.bfBefore = o.bfBefore; }
    if (o.bfAfter) { state.bfAfter = o.bfAfter; }
    render();
  },
  setRows: function (rows) { state.rows = rows; render(); },
  setChanges: function (list) { state.changes = list; render(); },
  getState: function () { return JSON.parse(JSON.stringify(state)); }
};

var saved = 'fr';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
render(saved);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="esp-supabase.js"></script>
<script>/* ESP-NAV — intégration */
(function () {
  var lang = 'fr'; try { lang = localStorage.getItem('espritum.lang') || 'fr'; } catch (e) {}
  var dec = (lang === 'en') ? '.' : ',';
  var gram = (lang === 'bg') ? ' г' : ' g';
  function grp(x) { return String(Math.abs(Math.round(x))).replace(/\B(?=(\d{3})+(?!\d))/g, (lang === 'en' ? ',' : ' ')); }
  function fmtNum(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−' : '') + grp(n); }
  function fmtPct(n) { return (Number(n) || 0).toFixed(1).replace('.', dec) + ' %'; }
  function signPct(n) { var v = Number(n) || 0; return (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1).replace('.', dec); }
  function signInt(n) { var v = Math.round(Number(n) || 0); return v === 0 ? '±0' : (v > 0 ? '+' : '−') + grp(v); }

  // Photo « aujourd'hui » = le scan qui vient d'être pris
  try { var now = sessionStorage.getItem('espritum.photo.current'); if (now) window.EspritumAdjust.setPhotos({ after: now }); } catch (e) {}

  var result = null; try { result = JSON.parse(localStorage.getItem('espritum.recalibrage') || 'null'); } catch (e) {}
  if (!result || !window.EspAuth) return; // accès direct sans analyse → on garde les valeurs de démo

  window.EspAuth.getProfile().then(function (p) {
    p = p || {};
    var prevBf = Number(p.masse_grasse) || 0, prevCal = Number(p.calories_objectif) || 0;
    var prevProt = Number(p.proteines_objectif) || 0;
    var prevSess = (p.questionnaire && p.questionnaire.freq) ? Number(p.questionnaire.freq) : null;
    var newBf = Number(result.bodyFatCurrent), newCal = Number(result.caloriesTarget);
    var newProt = Number(result.proteinTarget), newSess = Number(result.sessionsPerWeek);

    window.EspritumAdjust.setPhotos({ bfBefore: fmtPct(prevBf), bfAfter: fmtPct(newBf) });

    var base = (window.T && window.T[lang] && window.T[lang].adjustRows) ? window.T[lang].adjustRows : null;
    var lab = base ? base.map(function (r) { return r.k; }) : ['Masse grasse', 'Calories', 'Protéines', 'Séances'];
    window.EspritumAdjust.setRows([
      { k: lab[0], b: fmtPct(newBf), d: prevBf ? signPct(newBf - prevBf) : '' },
      { k: lab[1], b: fmtNum(newCal), d: prevCal ? signInt(newCal - prevCal) : '' },
      { k: lab[2], b: fmtNum(newProt) + gram, d: prevProt ? signInt(newProt - prevProt) : '' },
      { k: lab[3], b: String(Math.round(newSess)), d: (prevSess != null) ? signInt(newSess - prevSess) : '' }
    ]);
    if (result.changes && result.changes.length) window.EspritumAdjust.setChanges(result.changes);

    // Photo « avant » = dernier scan enregistré
    window.EspAuth.lastScan().then(function (m) {
      if (m && m.photo_url) window.EspAuth.getSignedUrl(m.photo_url).then(function (url) { if (url) window.EspritumAdjust.setPhotos({ before: url }); });
    });
  }).catch(function () {});
})();

document.addEventListener('espritum:apply-plan', function () {
  function go() { try { localStorage.removeItem('espritum.recalibrage'); } catch (e) {} window.location.href = 'accueil.html'; }
  var result = null; try { result = JSON.parse(localStorage.getItem('espritum.recalibrage') || 'null'); } catch (e) {}
  if (result && window.EspAuth) {
    window.EspAuth.getProfile().then(function (p) { return window.EspAuth.saveWeeklyScan(result, p || {}); }).then(go, go);
  } else { go(); }
});
</script>
</body>
</html>
