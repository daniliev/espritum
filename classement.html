var TAB_KEYS = ['progress', 'force', 'endurance', 'friends'];
var GLOBAL_OFFSET = { progress:0, force:0, endurance:0, friends:0 }; // positions réelles (#1, #2, …)

var state = {
  lang:'fr', tab:'progress', streak:12, name:'',
  rank:5, esprit:860, force:'—', endurance:'—'
};

function d() { return T[state.lang]; }
function board() { return BOARDS[state.tab] || BOARDS.progress; }
function emit(n, x) { document.dispatchEvent(new CustomEvent(n, { detail: x || {} })); }
function myLabel() { return (state.name.trim() || d().you); }
function posOf(i) { return (GLOBAL_OFFSET[state.tab] || 0) + i + 1; }
function detailOf(b) {
  var tpl = d().detail[state.tab] || d().detail.progress;
  return tpl.replace('{n}', b.pts).replace('{s}', b.s === undefined ? '—' : b.s).replace('{p}', b.p || '—');
}
function nameOf(b) { return b.me ? myLabel() : b.name; }
function iniOf(b) { return b.me ? (state.name.trim() ? state.name.trim().slice(0, 2).toUpperCase() : 'ES') : b.ini; }

var LOCKED_TABS = ['endurance', 'friends']; // cardio/amis pas encore mesurés
function renderSegs() {
  document.getElementById('segs').innerHTML = d().tabs.map(function (label, i) {
    var cls = (TAB_KEYS[i] === state.tab ? 'on' : '') + (LOCKED_TABS.indexOf(TAB_KEYS[i]) >= 0 ? ' locked' : '');
    return '<div class="' + cls.trim() + '" data-tab="' + TAB_KEYS[i] + '">' + label + '</div>';
  }).join('');
}

function renderMe() {
  var b = board(), mine = b.filter(function (x) { return x.me; })[0] || b[0];
  var idx = b.indexOf(mine);
  document.getElementById('myPos').textContent = '#' + posOf(idx);
  document.getElementById('myIni').textContent = iniOf(mine);
  document.getElementById('myName').textContent = myLabel().toUpperCase();
  document.getElementById('myDetail').textContent = detailOf(mine);
  document.getElementById('myStreak').textContent = String(state.streak);
  document.getElementById('rankNum').textContent = String(state.rank);
  document.getElementById('rankName').textContent = d().ranks[state.rank - 1];
  document.getElementById('axes').innerHTML = d().axes.map(function (a) {
    var v = state[a.key];
    if (a.key === 'endurance') v = v + ' ' + d().unit.endurance;
    if (a.key === 'force') v = v + ' ' + d().unit.force;
    return '<div class="axis"><span class="k">' + a.k + '</span><span class="v">' + v + '</span></div>';
  }).join('');
  document.getElementById('restLabel').textContent = state.tab === 'friends' ? d().rest : d().around;
  document.getElementById('push').textContent = d().push;
}

function renderPodium() {
  document.getElementById('podium').innerHTML = board().slice(0, 3).map(function (b, i) {
    var s = PODIUM_STYLE[i];
    return '<div class="col">' +
      '<div class="av" style="width:' + s.av + ';height:' + s.av + ';border:2px solid ' + s.ring + ';color:' + s.c + '">' + iniOf(b) + '</div>' +
      '<span class="nm">' + nameOf(b) + '</span>' +
      '<div class="st"><img src="logo-mark.png" alt=""><span>' + b.st + '</span></div>' +
      '<div class="bar" style="height:' + s.bar + ';background:' + s.bg + ';border:1px solid ' + s.ring + ';color:' + s.c + '">' + (i + 1) + '</div>' +
      '</div>';
  }).join('');
}

function renderRows() {
  document.getElementById('rows').innerHTML = board().slice(3).map(function (b, i) {
    return '<div class="row' + (b.me ? ' mine' : '') + '">' +
      '<span class="p">' + posOf(i + 3) + '</span>' +
      '<div class="av">' + iniOf(b) + '</div>' +
      '<div class="c"><b>' + nameOf(b) + '</b><span>' + detailOf(b) + '</span></div>' +
      '<span class="pts">' + b.pts + '</span></div>';
  }).join('');
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = ['home', 'train', 'scan', 'food', 'rank'].map(function (key, i) {
    if (key === 'scan') return '<div class="tab scan" data-nav="scan" aria-label="' + d().navTabs[i] + '"><div class="bigscan"><i></i></div></div>';
    var paths = ICONS[key].map(function (p) { return '<path d="' + p + '"></path>'; }).join('');
    return '<div class="tab' + (key === 'rank' ? ' on' : '') + '" data-nav="' + key + '" aria-label="' + d().navTabs[i] + '">' +
      '<svg viewBox="0 0 300 300">' + paths + '</svg><div class="dot"></div></div>';
  }).join('');
}

function render(l) {
  if (l) { state.lang = l; }
  var dd = d();
  document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = dd[el.dataset.k]; });
  document.getElementById('meta').textContent = dd.meta;
  document.getElementById('streak').textContent = String(state.streak);
  renderSegs(); renderMe(); renderPodium(); renderRows(); renderTabs();
  document.querySelectorAll('.langbar button').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang));
  });
  document.documentElement.lang = state.lang;
  try { localStorage.setItem('espritum.lang', state.lang); } catch (e) {}
}

document.getElementById('segs').addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-tab]');
  if (!el) return;
  state.tab = el.dataset.tab;
  emit('espritum:board-tab', { tab: state.tab });
  render();
});
document.getElementById('tabs').addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-nav]');
  if (el) emit('espritum:navigate', { to: el.dataset.nav });
});
document.getElementById('goProfile').addEventListener('click', function () { emit('espritum:navigate', { to: 'profile' }); });
document.querySelectorAll('.langbar button').forEach(function (b) {
  b.addEventListener('click', function () { render(b.dataset.lang); });
});

window.EspritumRanking = {
  setLang: render,
  setBoard: function (tab, rows) { if (BOARDS[tab]) { BOARDS[tab] = rows; render(); } },
  setTab: function (tab) { if (BOARDS[tab]) { state.tab = tab; render(); } },
  setMe: function (o) {
    ['name', 'streak', 'rank', 'esprit', 'force', 'endurance'].forEach(function (k) {
      if (o[k] !== undefined) state[k] = o[k];
    });
    render();
  },
  getState: function () { return JSON.parse(JSON.stringify(state)); }
};

var saved = 'fr';
try { var v = localStorage.getItem('espritum.lang'); if (v && T[v]) saved = v; } catch (e) {}
render(saved);
</script>
<script>/* ESP-NAV — intégration */
(function () {
  // Nom du compte → carte « TOI » (fallback avant les données serveur)
  try {
    var acc = JSON.parse(localStorage.getItem('espritum.account') || 'null');
    if (acc && acc.name && window.EspritumRanking) window.EspritumRanking.setMe({ name: acc.name });
  } catch (e) {}

  // Classement Esprit RÉEL : fonction serveur sécurisée get_leaderboard (prénom + score uniquement)
  function initiales(n) { n = (n || '').trim(); if (!n) return 'ES'; var p = n.split(/\s+/); return (p.length > 1 ? (p[0][0] + p[1][0]) : n.slice(0, 2)).toUpperCase(); }
  function tierOf(score) { var TH = [0, 200, 400, 700, 1000, 1400, 2000], r = 1; for (var i = 0; i < TH.length; i++) if (score >= TH[i]) r = i + 1; return r; }

  var espLang = 'fr'; try { espLang = localStorage.getItem('espritum.lang') || 'fr'; } catch (e) {}
  function fp(n) { return espLang === 'en' ? String(n) : String(n).replace('.', ','); }

  if (window.espSB) {
    // Onglet PROGRESSION = score Esprit (régularité + séances + gras perdu − décroissance)
    window.espSB.rpc('get_leaderboard').then(function (res) {
      var data = res && res.data;
      if (!data || !data.length) return;
      var rows = data.map(function (u) {
        return { name: u.prenom, ini: initiales(u.prenom), pts: u.score, s: u.sessions, st: u.streak, me: !!u.is_me };
      });
      window.EspritumRanking.setBoard('progress', rows);
      var mine = rows.filter(function (r) { return r.me; })[0];
      if (mine) window.EspritumRanking.setMe({ name: mine.name, streak: mine.st, rank: tierOf(mine.pts), esprit: mine.pts });
    }).catch(function () {});

    // Onglet FORCE = progression des charges vs ton propre départ (%)
    window.espSB.rpc('get_leaderboard_force').then(function (res) {
      var data = res && res.data;
      if (!data || !data.length) return;
      var rows = data.map(function (u) {
        return { name: u.prenom, ini: initiales(u.prenom), pts: fp(u.force_pct), s: u.lifts, st: u.streak, me: !!u.is_me };
      });
      window.EspritumRanking.setBoard('force', rows);
      var mine = rows.filter(function (r) { return r.me; })[0];
      if (mine) window.EspritumRanking.setMe({ force: mine.pts });
    }).catch(function () {});
  }
})();
var ESP_ROUTES = {
  home: 'accueil.html',
  train: 'entrainement.html',
  scan: null,             // TODO: scan hebdomadaire
  food: 'nutrition.html',
  rank: null,             // déjà ici
  profile: 'profil.html'           // TODO: profil
};
document.addEventListener('espritum:navigate', function (ev) {
  var to = (ev.detail || {}).to;
  if (to === 'scan') { window.location.href = 'photo-actuelle.html?mode=weekly'; return; }
  var url = ESP_ROUTES[to];
  if (url) window.location.href = url;
});
// Avatar (photo de profil) en haut à droite
if (window.EspAuth) window.EspAuth.getProfile().then(function (p) {
  if (p && p.avatar_url) { var av = document.getElementById('goProfile'); if (av) { av.style.backgroundImage = 'url(' + p.avatar_url + ')'; av.style.backgroundSize = 'cover'; av.style.backgroundPosition = 'center'; var s = av.querySelector('svg'); if (s) s.style.display = 'none'; } }
}).catch(function () {});
/* Onglet Progression = classement Esprit réel (get_leaderboard). Force/Endurance/Amis verrouillés jusqu'au logging d'entraînement. */
</script>
